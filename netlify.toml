# Netlify serves the BRG website fragments + shared assets from /website.
#   Each page   : website/<slug>/embed.html      → https://<site>.netlify.app/<slug>/embed.html
#   Each section: website/sections/<id>/embed.html → …/sections/<id>/embed.html
#   Shared      : website/assets/{brgw.css,brgw.js,media/**}
# The WordPress mu-plugin (vc-clients-embed) fetches these server-side and prints them
# natively via [brg_home], [brg_section id=…], … Edit a fragment, git push, done.
[build]
  publish = "website"

  # ── Do not deploy a commit that changes nothing this site serves ────────────────
  # brg-web ran 271 production deploys in August. Netlify bills PER DEPLOY regardless
  # of build time, so a 4-second no-op build still costs — that is ~95% of Sean's
  # credit spend and $125 of overage across his sites. Five chats commit here all day
  # and most commits touch notes/, work/, kit/ or a .md, none of which ship.
  #
  # POLARITY, which is the easy thing to get backwards: `git diff --quiet` exits 0 when
  # NOTHING in those paths changed, and exit 0 is Netlify's SKIP signal. No negation.
  #
  # WATCHED, deliberately wider than the publish dir:
  #   website/      what is served
  #   netlify/      the functions — they live OUTSIDE publish on purpose, and a change
  #                 to lab-state.mjs must deploy or the lab's sync silently stops saving
  #   netlify.toml  headers, redirects and this rule itself
  #   package.json  the functions' dependencies
  # When unsure, watch it: a needless deploy costs cents, a missed one ships nothing.
  #
  # Verified against 60 real commits, both directions, zero disagreements with what
  # each commit actually touched.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- website netlify netlify.toml package.json"
  # Functions live OUTSIDE the publish dir on purpose: anything under website/ is
  # served as a static file, so a function there would be downloadable source.
  functions = "netlify/functions"

# ── Keep the raw CDN out of Google ──────────────────────────────────────────────
# The fragments are the SAME content as the real pages on blacktoprestaurantgroup.com.
# If Google indexes …netlify.app/home/embed.html it becomes duplicate content competing
# with the canonical WP page. noindex tells crawlers not to index anything on the CDN
# host. It does NOT affect the plugin's server-side fetch (that ignores robots headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Fonts must load cross-origin (CSS is inlined onto blacktoprestaurantgroup.com).
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Media (images/svg/logos) is content-addressed by filename → safe to cache hard.
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000"

# A stray visit to the bare CDN root should land on the real site, not a Netlify 404.
# (Fragments are still reachable directly; only "/" redirects.)
[[redirects]]
  from = "/"
  to = "https://blacktoprestaurantgroup.com/"
  status = 302
  force = true
