<!-- BRG · section: team-members  →  [brg_team-members]
     Matches the Team comp (mocks/BRG - Team.png, y 916–3486 @1x).
     Light section. Owns the yellow smiley seam badge, bleeding upward.
     Nine crew cards: coloured plate + portrait + tilted black name bar + pull quote.
     Card colours come from the comp; portraits are placeholders until headshots land. -->
<section class="brgw-sec brgw-sec--team-members reveal" data-nav="light" aria-label="The crew">
<style>
.brgw-sec--team-members{position:relative;background:var(--white);color:var(--ink);overflow:visible;
  padding:clamp(78px,8.5vw,124px) var(--pad) clamp(74px,8vw,116px);text-align:center;}
.brgw-sec--team-members .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--team-members .seam img{width:100%;height:auto;display:block;}

.brgw-sec--team-members .lede{max-width:74ch;margin:0 auto clamp(26px,3vw,40px);
  font-size:clamp(.98rem,1.15vw,1.1rem);line-height:1.6;opacity:.9;}
.brgw-sec--team-members .banner{display:inline-block;background:var(--yellow);color:var(--ink);
  font-size:clamp(1.1rem,2.4vw,2rem);text-transform:uppercase;padding:.1em .5em;
  margin-bottom:clamp(42px,5vw,74px);}

.brgw-sec--team-members .grid{display:grid;grid-template-columns:1fr;gap:clamp(34px,3.4vw,54px);
  max-width:1320px;margin-inline:auto;}
@media(min-width:640px){ .brgw-sec--team-members .grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1000px){ .brgw-sec--team-members .grid{grid-template-columns:repeat(3,1fr);} }

.brgw-sec--team-members figure{margin:0;}

/* Coloured plate behind the cut-out portrait.
   SHAPE IS A VARIABLE, set once on .grid so every card in the grid matches — a grid of
   mixed aspect ratios is a broken grid, not a design choice, which is why this is a
   section field and the crop below is a per-person one. Sean asked for "about 7:9".

   THE PHOTO IS A CSS BACKGROUND, NOT AN <img>, and that is deliberate rather than
   inherited: a crew row can exist before its headshot does, and <img src=""> resolves
   against the PAGE URL and re-downloads the document — once per person without a photo.
   background-size then expresses all three fits honestly: cover fills, `auto 100%` is a
   true fit-to-height, contain shows the whole cut-out. data-photo="" states the empty
   case rather than leaving url('') to the browser. */
.brgw-sec--team-members .card{position:relative;aspect-ratio:var(--ar,7/9);overflow:hidden;
  background-color:var(--c,var(--teal));background-image:var(--photo,none);
  background-repeat:no-repeat;background-size:auto 100%;background-position:center bottom;}
.brgw-sec--team-members .card[data-photo=""]{background-image:none;}

/* HOW IT FITS — section-wide. */
.brgw-sec--team-members .card[data-fit="cover"]{background-size:cover;}
.brgw-sec--team-members .card[data-fit="height"]{background-size:auto 100%;}
.brgw-sec--team-members .card[data-fit="contain"]{background-size:contain;}

/* THE CROP — per person, because people do not stand in the same place twice. */
.brgw-sec--team-members .card[data-crop="top"]{background-position:center top;}
.brgw-sec--team-members .card[data-crop="center"]{background-position:center center;}
.brgw-sec--team-members .card[data-crop="bottom"]{background-position:center bottom;}
.brgw-sec--team-members .card[data-crop="left"]{background-position:left bottom;}
.brgw-sec--team-members .card[data-crop="right"]{background-position:right bottom;}

/* Tilted name plate. NOW A SIBLING OF .card, NOT A CHILD — Sean, 1 Oct: "it shouldn't
   have the label inside of the container. The label should be out on its own in a box
   that's rotated like it is." It was inside a container with overflow:hidden, so the
   rotated corners were being clipped and it could never extend past the plate the way
   the comp draws it. Outside, the negative margins do both jobs: pulled up to overlap
   the photo, and wider than it on both sides. */
.brgw-sec--team-members .bar{position:relative;z-index:2;display:block;background:#000;
  margin:-11% -4% 0;transform:rotate(-2.2deg);padding:10px 8px 12px;}
.brgw-sec--team-members .nm{display:block;color:var(--yellow);font-size:clamp(1rem,1.5vw,1.35rem);
  text-transform:uppercase;line-height:1;}
.brgw-sec--team-members .ti{display:block;color:var(--white);font-size:clamp(.58rem,.7vw,.66rem);
  letter-spacing:.18em;text-transform:uppercase;margin-top:6px;opacity:.9;}
.brgw-sec--team-members figcaption{margin-top:16px;font-size:clamp(.84rem,.95vw,.92rem);
  line-height:1.5;opacity:.78;font-style:italic;}

/* Scattered doodles between the cards, positioned as in the comp. */
.brgw-sec--team-members .dood{position:absolute;z-index:4;pointer-events:none;}
.brgw-sec--team-members .dood img{width:100%;height:auto;display:block;}
.brgw-sec--team-members .d1{top:20%;left:2%;width:clamp(38px,4vw,64px);}
.brgw-sec--team-members .d2{top:46%;left:35%;width:clamp(44px,5vw,78px);}
.brgw-sec--team-members .d3{top:44%;left:6%;width:clamp(48px,5.2vw,84px);}
.brgw-sec--team-members .d4{top:26%;right:5%;width:clamp(46px,5vw,80px);}
.brgw-sec--team-members .d5{bottom:26%;right:22%;width:clamp(56px,6.4vw,104px);}
@media(max-width:760px){ .brgw-sec--team-members .dood{display:none;} }

/* Colours cycle by position so nobody has to choose one per person. */
/* AUTOMATIC COLOURS cycle by position, so nobody has to choose one per person and
   adding someone re-colours the rest on its own. Scoped to [data-color="auto"] rather
   than left to specificity: an explicit choice is only TWO classes and an attribute,
   while this cycle is four classes and a type, so without the scope the cycle would
   quietly win every time and the colour field would look broken. Mutually exclusive
   attribute values mean neither rule has to out-specify the other. */
.brgw-sec--team-members .grid figure:nth-child(5n+1) .card[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+1) .card[data-color=""]{--c:var(--teal)}
.brgw-sec--team-members .grid figure:nth-child(5n+2) .card[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+2) .card[data-color=""]{--c:var(--orange)}
.brgw-sec--team-members .grid figure:nth-child(5n+3) .card[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+3) .card[data-color=""]{--c:var(--yellow)}
.brgw-sec--team-members .grid figure:nth-child(5n+4) .card[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+4) .card[data-color=""]{--c:var(--pink)}
.brgw-sec--team-members .grid figure:nth-child(5n+5) .card[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+5) .card[data-color=""]{--c:#6C2BB8} /* purple: reuses the hex already on fallback card 4. NOT var(--violet) — that token does not exist, so it silently fell back to teal, making the "5-colour" cycle 4 colours with teal twice. Worse, SPEC-005 wants a --violet for Press: defining it there would have retroactively changed THIS page. */

/* EXPLICIT per-person colours. The hexes are the ones already on the fallback cards —
   this names them rather than introducing a second palette. */
.brgw-sec--team-members .card[data-color="teal"]{--c:var(--teal)}
.brgw-sec--team-members .card[data-color="orange"]{--c:var(--orange)}
.brgw-sec--team-members .card[data-color="yellow"]{--c:var(--yellow)}
.brgw-sec--team-members .card[data-color="pink"]{--c:var(--pink)}
.brgw-sec--team-members .card[data-color="purple"]{--c:#6C2BB8}
.brgw-sec--team-members .card[data-color="blue"]{--c:#2BB3E3}
.brgw-sec--team-members .card[data-color="coral"]{--c:#F4736B}
.brgw-sec--team-members .card[data-color="green"]{--c:#22B34B}
.brgw-sec--team-members .card[data-color="red"]{--c:#E02020}
</style>
  <span class="seam" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/div-icn-smile.svg" alt="" width="150" height="145" loading="lazy" decoding="async"></span>

  <p class="lede anim-up">Behind every great restaurant is a team that genuinely gives a damn. Our leadership crew brings decades of food &amp; beverage experience, a shared obsession with hospitality, and enough personality to fill a very loud dinner table.</p>
  <span class="banner blanco anim-up">We work hard, we have fun, and we take care of our people</span>

  <span class="dood d1" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-circle-wht.svg" alt="" width="122" height="118" loading="lazy" decoding="async"></span>
  <span class="dood d2" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-blk.svg" alt="" width="151" height="145" loading="lazy" decoding="async"></span>
  <span class="dood d3" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-smile-yel.svg" alt="" width="215" height="208" loading="lazy" decoding="async"></span>
  <span class="dood d4" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg" alt="" width="129" height="207" loading="lazy" decoding="async"></span>
  <span class="dood d5" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-brg-yel.svg" alt="" width="265" height="192" loading="lazy" decoding="async"></span>

  <div class="grid" style="--ar:{{card_shape}}">
    <!--brg:repeat members-->
      <figure class="anim-up"><div class="card" data-photo="{{members.photo}}" data-fit="{{photo_fit}}" data-crop="{{members.crop}}" data-color="{{members.bg_color}}" style="--photo:url('{{members.photo}}')"></div><span class="bar"><span class="nm blanco">{{members.name}}</span><span class="ti">{{members.title}}</span></span><figcaption>{{members.quote}}</figcaption></figure>
    <!--brg:empty-->
      <figure class="anim-up"><div class="card" style="--c:var(--teal)"></div><span class="bar"><span class="nm blanco">Craig Applegate</span><span class="ti">CEO</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:var(--orange)"></div><span class="bar"><span class="nm blanco">Clayton Wheeler</span><span class="ti">CEO</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:#2BB3E3"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:#6C2BB8"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:var(--yellow)"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:var(--pink)"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:#F4736B"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:#22B34B"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <figure class="anim-up"><div class="card" style="--c:#E02020"></div><span class="bar"><span class="nm blanco">Name</span><span class="ti">Title</span></span><figcaption>&ldquo;Quote to come.&rdquo;</figcaption></figure>
    <!--/brg:repeat-->
  </div>
</section>
