<!-- BRG · section: team-members  →  [brg_team-members]
     Matches the Team comp (mocks/BRG - Team.png, y 916–3486 @1x).
     Light section. Owns the yellow smiley seam badge, bleeding upward.
     Nine crew cards: colored plate + portrait + tilted black name bar + pull quote.
     Card colors come from the comp; portraits are placeholders until headshots land. -->
<section class="brgw-sec brgw-sec--team-members reveal" data-nav="light" aria-label="The crew" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--team-members{--brgw-wrap:1440px;position:relative;background:var(--white);color:var(--ink);overflow:visible;
  padding:clamp(78px,8.5vw,124px) var(--pad) clamp(74px,8vw,116px);text-align:center;}
.brgw-sec--team-members .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--team-members .seam img{width:100%;height:auto;display:block;}

.brgw-sec--team-members .lede{max-width:74ch;margin:0 auto clamp(26px,3vw,40px);
  font-size:clamp(.98rem,1.15vw,1.1rem);line-height:1.6;opacity:.9;}
.brgw-sec--team-members .banner{display:inline-block;background:var(--yellow);color:var(--ink);
  font-size:clamp(1.1rem,2.4vw,2rem);text-transform:uppercase;padding:.1em .5em;
  margin-bottom:clamp(42px,5vw,74px);}

/* 1440, up from 1320 — Sean, 1 Oct. The column count is a field; the LADDER below it is
   not, because the useful number of columns is decided by how wide a card ends up, not by
   taste: four columns inside 1000px gives a 230px card, which is too small for a face and
   a name plate. So four only engages once there is room for it, and anything narrower
   falls back to three, then two, then one. */
.brgw-sec--team-members .grid{display:grid;grid-template-columns:1fr;gap:clamp(34px,3.4vw,54px);
  max-width:var(--brgw-wrap);margin-inline:auto;}
@media(min-width:640px){ .brgw-sec--team-members .grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1000px){
  .brgw-sec--team-members .grid{grid-template-columns:repeat(3,1fr);}
  .brgw-sec--team-members .grid[data-cols="2"]{grid-template-columns:repeat(2,1fr);}
}
@media(min-width:1240px){
  .brgw-sec--team-members .grid[data-cols="4"]{grid-template-columns:repeat(4,1fr);}
}

.brgw-sec--team-members figure{margin:0;}

/* Colored plate behind the cut-out portrait.
   SHAPE IS A VARIABLE set once on .grid, so every box is the same height and the same
   width — Sean, 1 Oct: "all containers should be the same height and same width."
   That uniformity is what makes a row of different people read as a set, so shape and
   fit are grid-wide and only the crop and color are per person.

   A REAL <img>, NOT A CSS BACKGROUND. The background version could never do what Sean
   asked for next — "whether or not the overflow of the image is visible or hidden" —
   because a CSS background is always clipped to its own box, whatever overflow says.
   Nothing can hang outside the frame when it is painted as a background.

   The earlier commits justified the background by claiming <img src=""> resolves against
   the page URL and re-downloads the document. THAT WAS WRONG for anything current:
   measured on this page, an empty src produced zero requests. HTML5 aborts on an empty
   src; the re-download is a pre-HTML5 quirk. It is hidden here anyway, via data-photo,
   so a crew row still renders as a clean colored plate before its headshot exists. */
.brgw-sec--team-members .card{position:relative;aspect-ratio:var(--ar,7/9);}
/* THE COLOR IS A LAYER, NOT THE CARD'S OWN BACKGROUND. Sean, 1 Oct: "the color
   background [should] vertically shrink a little bit also… that doesn't crop out the top
   of the image that's being hovered over." A background-color belongs to the element and
   cannot be scaled on its own, so shrinking it would have meant shrinking the card — which
   is also the box that crops the photo, so the top of the head would have been cut exactly
   as he said it must not be. A separate painted layer scales independently of both. */
.brgw-sec--team-members .card::before{content:"";position:absolute;inset:0;z-index:0;
  background:var(--c,var(--teal));transform-origin:bottom center;}
.brgw-sec--team-members .card img{display:block;z-index:1;}
/* WIDTH/HEIGHT ATTRIBUTES ARE NOT DECORATION HERE. With width:auto, an image that has
   not loaded yet has NO intrinsic size and so lays out zero pixels wide — and
   loading="lazy" decides what to load from exactly that box. A zero-width element is a
   poor candidate for intersection, so the photo can sit unloaded while the card shows as
   a bare colored panel: measured on the live page at 390px, 0 of 19 images loaded.
   The CSS background this replaced had no such state, so the regression came in with the
   <img>. The attributes give the element a real box before the bytes arrive; `aspect-ratio:
   auto <w>/<h>` in the UA stylesheet means the photo's true proportions take over the
   moment it loads, so these numbers never distort anything — 800x1000 is a placeholder
   shape, not a claim about any particular headshot. They also remove the layout shift. */
.brgw-sec--team-members .card[data-photo=""] img{display:none;}

/* OVERFLOW — the escape hatch, per person, default hidden. Sean: "just in case we want
   something to hang outside of the composition." Only has anything to act on with Fit
   the height, where the image keeps its own proportions and is wider than the box;
   Fill and Show-the-whole-photo both resolve inside the frame by construction. */
.brgw-sec--team-members .card[data-overflow="hidden"],
.brgw-sec--team-members .card[data-overflow=""]{overflow:hidden;}
.brgw-sec--team-members .card[data-overflow="visible"]{overflow:visible;}
/* A card that spills has to paint over its neighbours, not under them. */
.brgw-sec--team-members .card[data-overflow="visible"]{z-index:1;}
/* A SPILL MUST NEVER WIDEN THE PAGE. Measured: a spilling card pushes 56px past the box
   on each side. On desktop the grid is centered inside a max-width with room to spare, so
   that lands in the margin — but at one column the card is 342 of a 390 screen and the
   same 56px would put the document wider than the viewport, which is a horizontal
   scrollbar on the surface most of this traffic uses. Below the two-column breakpoint the
   escape hatch is therefore closed, and overflow-x:clip on the section is the backstop at
   every other width. `clip` rather than `hidden` on purpose: hidden on one axis forces the
   other to scroll, which would cut off the seam badge that deliberately bleeds upward. */
@media(max-width:639px){
  .brgw-sec--team-members .card[data-overflow="visible"]{overflow:hidden;}
}
.brgw-sec--team-members{overflow-x:clip;}

/* HOW IT FITS — grid-wide.
   Fit the height is the default and the one Sean specified: height pinned to the box,
   width left to the photo's own proportions, so every person is the same height and the
   sides fall where they fall. max-width:none is load-bearing — a global img{max-width:100%}
   would otherwise shrink it back to the box width and silently undo the whole mode. */
.brgw-sec--team-members .card[data-fit="height"] img,
.brgw-sec--team-members .card[data-fit=""] img{position:absolute;bottom:0;height:100%;
  width:auto;max-width:none;}
.brgw-sec--team-members .card[data-fit="cover"] img{position:absolute;inset:0;width:100%;
  height:100%;object-fit:cover;}
.brgw-sec--team-members .card[data-fit="contain"] img{position:absolute;inset:0;width:100%;
  height:100%;object-fit:contain;}

/* THE CROP — per person, because people do not stand in the same place twice.
   With Fit the height this is horizontal placement; with Fill the box it picks which
   edges get trimmed. Top and Bottom cannot mean anything in height mode, where the
   height already matches exactly, so they center rather than doing something arbitrary. */
.brgw-sec--team-members .card[data-fit="height"] img,
.brgw-sec--team-members .card[data-fit=""] img{left:50%;
  transform:translateX(-50%) scale(var(--z,1));transform-origin:bottom center;}
.brgw-sec--team-members .card[data-fit="height"][data-crop="left"] img{left:0;
  transform:scale(var(--z,1));transform-origin:bottom left;}
.brgw-sec--team-members .card[data-fit="height"][data-crop="right"] img{left:auto;right:0;
  transform:scale(var(--z,1));transform-origin:bottom right;}
.brgw-sec--team-members .card[data-fit="cover"][data-crop="top"] img{object-position:center top;}
.brgw-sec--team-members .card[data-fit="cover"][data-crop="center"] img{object-position:center center;}
.brgw-sec--team-members .card[data-fit="cover"][data-crop="bottom"] img{object-position:center bottom;}
.brgw-sec--team-members .card[data-fit="cover"][data-crop="left"] img{object-position:left center;}
.brgw-sec--team-members .card[data-fit="cover"][data-crop="right"] img{object-position:right center;}

/* Tilted name plate. NOW A SIBLING OF .card, NOT A CHILD — Sean, 1 Oct: "it shouldn't
   have the label inside of the container. The label should be out on its own in a box
   that's rotated like it is." It was inside a container with overflow:hidden, so the
   rotated corners were being clipped and it could never extend past the plate the way
   the comp draws it. Outside, the negative margins do both jobs: pulled up to overlap
   the photo, and wider than it on both sides. */
.brgw-sec--team-members .bar{position:relative;z-index:2;display:block;background:#000;
  margin:-11% -4% 0;transform:rotate(-2.2deg);padding:10px 8px 12px;}
/* THE NAME BOX ARRIVES AFTER ITS OWN CARD. Sean: "their name also needs to animate in,
   like their name box." It uses `translate`, not `transform`, because transform already
   holds the -2.2deg tilt and the two would overwrite each other; translate is a separate
   property that composes with it. The delay reads --brgw-delay, which the reveal engine
   sets on each card, so the bar follows ITS OWN card rather than a number fixed here. */
.brgw-sec--team-members .grid > .each-pending .bar{opacity:0;translate:0 16px;}
.brgw-sec--team-members .grid > .each-in .bar{opacity:1;translate:none;
  transition:opacity .5s ease, translate .55s cubic-bezier(.2,.85,.3,1);
  transition-delay:calc(var(--brgw-delay,0ms) + 190ms);}
@media (prefers-reduced-motion:reduce){
  .brgw-sec--team-members .grid > .each-pending .bar{opacity:1;translate:none;}
}
.brgw-sec--team-members .nm{display:block;color:var(--yellow);font-size:clamp(1rem,1.5vw,1.35rem);
  text-transform:uppercase;line-height:1;}
.brgw-sec--team-members .ti{display:block;color:var(--white);font-size:clamp(.58rem,.7vw,.66rem);
  letter-spacing:.18em;text-transform:uppercase;margin-top:6px;opacity:.9;}
.brgw-sec--team-members figcaption{margin-top:16px;font-size:clamp(.84rem,.95vw,.92rem);
  line-height:1.5;opacity:.78;font-style:italic;}

/* ── The oversized quote mark ────────────────────────────────────────────────
   Sean supplied quote-15.svg, quote-40.svg and quote-100.svg. They are the SAME PATH;
   only the `opacity` attribute on it differs, so shipping three assets would be shipping
   one shape three times and hard-coding a decision CSS can make better. The 100% file is
   the base, exactly as he suggested, and opacity is set here.

   A MASK, NOT AN IMAGE, because the mark has to take each person's color — an <img> or a
   background-image carries the fill baked in at #FAE200 and could only ever be yellow.
   Masking paints `background-color` through the shape, so var(--c) just works, and that is
   the whole reason --c moved from .card up to the figure in this commit: the caption is a
   SIBLING of the card, so it could not see a variable set on the card.

   Inline as a data URI rather than a file: it is 1.1KB, it saves a request per card, and
   it keeps the shape in the same commit as the rule that colors it. */
/* THE CAPTION BOX SHRINKS TO ITS TEXT. Sean, 2 Oct: "it should be anchored to the left
   side of the quote… can we still anchor it onto the edge of the actual text?" The mark is
   positioned against the caption, and the caption was a full-width block — so on a short
   quote like "Utah, Get me two!" the mark sat way out at the card's edge with a gap before
   the words, while the text sat centered in the middle.
   width:fit-content makes the box hug the text instead, and margin-inline:auto keeps that
   box centered under the card, so nothing moves visually except the mark's anchor.
   IT ALSO HANDLES THE WRAPPING CASE WITHOUT A SECOND RULE: fit-content is min(max-content,
   available), so a quote long enough to wrap fills the width and the box's left edge IS the
   paragraph's left edge — which is exactly where Sean asked for it on the multi-line ones. */
/* THE MARK SITS BESIDE THE WORDS, NOT UNDER THEM. Sean, 3 Oct: "some of these quotes are
   in strange places. They should be to the left of the text." It was absolutely positioned
   at left:0 top:-6px INSIDE the caption box, so it sat behind the first words and — being
   taller than a line of text at 44/33 — hung below them, which on a one-line quote read as
   a stray blob under the caption rather than as punctuation.
   The caption now carries left padding the width of the mark plus a gap, and the mark lives
   in that padding, vertically centred on the text. The box is still width:fit-content and
   centred, so a short quote stays centred under its card; the mark just moved out of the
   words. */
.brgw-sec--team-members figcaption{position:relative;width:fit-content;max-width:100%;
  margin-inline:auto;padding-left:calc(clamp(34px,3.6vw,52px) + 10px);
  /* AND THE SAME AGAIN ON THE RIGHT, or the quote reads off-centre under its card.
     The box is width:fit-content and centred with margin-inline:auto, so the box —
     padding included — is what gets centred, not the words. Padding on one side only
     pushed every caption right by half of it, which is what Sean saw as "they all got
     shifted off-centre". Mirroring it keeps the WORDS centred while the mark still sits
     out in the left gutter. */
  padding-right:calc(clamp(34px,3.6vw,52px) + 10px);}
.brgw-sec--team-members figcaption::before{
  content:"";position:absolute;left:0;top:50%;translate:0 -50%;z-index:0;
  width:clamp(34px,3.6vw,52px);aspect-ratio:44/33;pointer-events:none;
  background-color:var(--c,var(--yellow));opacity:.15;
  -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2044%2033%22%3E%3Cpath%20d%3D%22M15.1755%2014.4209C16.8517%2015.1877%2018.1388%2016.3378%2019.0367%2017.8713C19.9946%2019.3458%2020.4735%2021.0858%2020.4735%2023.0912C20.4735%2026.0402%2019.5156%2028.429%2017.6%2030.2574C15.6844%2032.0858%2013.2299%2033%2010.2367%2033C7.24354%2033%204.78912%2032.0858%202.87347%2030.2574C0.957823%2028.429%200%2026.0402%200%2023.0912C0%2021.7346%200.179592%2020.378%200.538775%2019.0214C0.897959%2017.6649%201.70612%2015.6595%202.96327%2013.0054L8.7102%200H19.3959L15.1755%2014.4209ZM38.702%2014.4209C40.3782%2015.1877%2041.6653%2016.3378%2042.5633%2017.8713C43.5211%2019.3458%2044%2021.0858%2044%2023.0912C44%2026.0402%2043.0422%2028.429%2041.1265%2030.2574C39.2109%2032.0858%2036.7565%2033%2033.7633%2033C30.7701%2033%2028.3156%2032.0858%2026.4%2030.2574C24.4844%2028.429%2023.5265%2026.0402%2023.5265%2023.0912C23.5265%2021.7346%2023.7061%2020.378%2024.0653%2019.0214C24.4245%2017.6649%2025.2327%2015.6595%2026.4898%2013.0054L32.2367%200H42.9224L38.702%2014.4209Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E") no-repeat left top/contain;
          mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2044%2033%22%3E%3Cpath%20d%3D%22M15.1755%2014.4209C16.8517%2015.1877%2018.1388%2016.3378%2019.0367%2017.8713C19.9946%2019.3458%2020.4735%2021.0858%2020.4735%2023.0912C20.4735%2026.0402%2019.5156%2028.429%2017.6%2030.2574C15.6844%2032.0858%2013.2299%2033%2010.2367%2033C7.24354%2033%204.78912%2032.0858%202.87347%2030.2574C0.957823%2028.429%200%2026.0402%200%2023.0912C0%2021.7346%200.179592%2020.378%200.538775%2019.0214C0.897959%2017.6649%201.70612%2015.6595%202.96327%2013.0054L8.7102%200H19.3959L15.1755%2014.4209ZM38.702%2014.4209C40.3782%2015.1877%2041.6653%2016.3378%2042.5633%2017.8713C43.5211%2019.3458%2044%2021.0858%2044%2023.0912C44%2026.0402%2043.0422%2028.429%2041.1265%2030.2574C39.2109%2032.0858%2036.7565%2033%2033.7633%2033C30.7701%2033%2028.3156%2032.0858%2026.4%2030.2574C24.4844%2028.429%2023.5265%2026.0402%2023.5265%2023.0912C23.5265%2021.7346%2023.7061%2020.378%2024.0653%2019.0214C24.4245%2017.6649%2025.2327%2015.6595%2026.4898%2013.0054L32.2367%200H42.9224L38.702%2014.4209Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E") no-repeat left top/contain;}
/* A row with no quote renders an EMPTY figcaption, and a lone mark under a card with no
   words beside it reads as a stray graphic rather than punctuation. */
.brgw-sec--team-members figcaption:empty::before{display:none;}
/* The words sit above the mark, never behind it. */
.brgw-sec--team-members figcaption{z-index:1;}

/* Yellow instead of the person's color — same shape, heavier because yellow at 15% on
   white is invisible. */
.brgw-sec--team-members .grid[data-quote="yellow"] figcaption::before{
  background-color:var(--yellow);opacity:.4;}
.brgw-sec--team-members .grid[data-quote="none"] figcaption::before{display:none;}

/* Scattered doodles between the cards, positioned as in the comp. */
.brgw-sec--team-members .dood{position:absolute;z-index:4;pointer-events:none;}
.brgw-sec--team-members .dood img{width:100%;height:auto;display:block;}
.brgw-sec--team-members .d1{top:20%;left:2%;width:clamp(38px,4vw,64px);}
.brgw-sec--team-members .d2{top:46%;left:35%;width:clamp(44px,5vw,78px);}
.brgw-sec--team-members .d3{top:44%;left:6%;width:clamp(48px,5.2vw,84px);}
.brgw-sec--team-members .d4{top:26%;right:5%;width:clamp(46px,5vw,80px);}
.brgw-sec--team-members .d5{bottom:26%;right:22%;width:clamp(56px,6.4vw,104px);}
@media(max-width:760px){ .brgw-sec--team-members .dood{display:none;} }

/* Colors cycle by position so nobody has to choose one per person. */
/* AUTOMATIC COLORS cycle by position, so nobody has to choose one per person and
   adding someone re-colors the rest on its own. Scoped to [data-color="auto"] rather
   than left to specificity: an explicit choice is only TWO classes and an attribute,
   while this cycle is four classes and a type, so without the scope the cycle would
   quietly win every time and the color field would look broken. Mutually exclusive
   attribute values mean neither rule has to out-specify the other. */
.brgw-sec--team-members .grid figure:nth-child(5n+1)[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+1)[data-color=""]{--c:var(--teal)}
.brgw-sec--team-members .grid figure:nth-child(5n+2)[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+2)[data-color=""]{--c:var(--orange)}
.brgw-sec--team-members .grid figure:nth-child(5n+3)[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+3)[data-color=""]{--c:var(--yellow)}
.brgw-sec--team-members .grid figure:nth-child(5n+4)[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+4)[data-color=""]{--c:var(--pink)}
.brgw-sec--team-members .grid figure:nth-child(5n+5)[data-color="auto"],
.brgw-sec--team-members .grid figure:nth-child(5n+5)[data-color=""]{--c:#A17DC4} /* purple: softened to #A17DC4 at Sean's request 1 Oct; was #6C2BB8, which read
   heavier than the rest of the palette beside teal and orange. NOT var(--violet) — that token does not exist, so it silently fell back to teal, making the "5-color" cycle 4 colors with teal twice. Worse, SPEC-005 wants a --violet for Press: defining it there would have retroactively changed THIS page. */

/* EXPLICIT per-person colors. The hexes are the ones already on the fallback cards —
   this names them rather than introducing a second palette. */
.brgw-sec--team-members figure[data-color="teal"]{--c:var(--teal)}
.brgw-sec--team-members figure[data-color="orange"]{--c:var(--orange)}
.brgw-sec--team-members figure[data-color="yellow"]{--c:var(--yellow)}
.brgw-sec--team-members figure[data-color="pink"]{--c:var(--pink)}
.brgw-sec--team-members figure[data-color="purple"]{--c:#A17DC4}
.brgw-sec--team-members figure[data-color="blue"]{--c:#2BB3E3}
.brgw-sec--team-members figure[data-color="coral"]{--c:#F4736B}
.brgw-sec--team-members figure[data-color="green"]{--c:#22B34B}
.brgw-sec--team-members figure[data-color="red"]{--c:#E02020}

/* ── Hover ───────────────────────────────────────────────────────────────────
   Sean, 1 Oct: the name box turns slightly clockwise, the photo lifts, the crop
   shrinks a little, and the top is allowed to escape — "if the head pokes out a
   little bit… it's fine, but the sides crop stays hidden if it's set to hidden."

   THAT LAST PART IS WHY THIS USES `clip`. overflow:hidden on ONE axis forces the
   other to `auto`, so asking for hidden sides and a free top with `hidden` silently
   produces a scrollbar instead. `overflow-x:clip` with `overflow-y:visible` is the
   only pairing that means what he asked for, and it leaves a card that was set to
   spill on both axes alone.

   THE LIFT IS `bottom`, NOT A TRANSFORM, because the photo already spends its
   transform on staying centered (translateX(-50%)) — a hover transform would have to
   restate that, and would then be wrong for the left and right crops, which do not
   use it. Moving `bottom` is independent of all three.

   The shrink rides a variable for the same reason: --z is the only thing hover
   touches, so each crop keeps its own origin and centring. transform-origin is the
   BASE of the photo, so it shrinks toward the bottom edge it stands on rather than
   drifting up as it scales — the lift should be the only vertical movement.

   The plate's resting angle is -2.2deg, so 1.5deg CLOCKWISE is -0.7deg, not +1.5.

   HOVER ONLY WHERE HOVER EXISTS. Without the (hover:hover) gate a phone fires these
   on tap and leaves the card stuck in its hovered state until something else is
   touched. */
@media (hover:hover){
  .brgw-sec--team-members figure .card::before,
  .brgw-sec--team-members figure .card img,
  .brgw-sec--team-members figure .bar{
    transition:bottom .34s cubic-bezier(.2,.7,.2,1),transform .34s cubic-bezier(.2,.7,.2,1);}
  /* VERTICAL ONLY — scaleY, not scale. The sides of the color stay put against the name
     plate, which is wider than the card and would read as misaligned if the plate narrowed
     under it. Origin is the base, so the top edge draws down and the lifted head sits
     above the color rather than being covered by it. */
  .brgw-sec--team-members figure:hover .card::before{transform:scaleY(.965);}

  /* the hovered card paints over its neighbours, or the escaping head slides under them */
  /* THE SHRINK AND THE LIFT FIGHT EACH OTHER, so the numbers are chosen, not picked.
     transform-origin is the base, so scaling to 0.97 drops the TOP of a 501px photo by
     15px while a 14px lift raises it — measured head-poke was MINUS 1px, i.e. the effect
     canceled itself exactly and nothing escaped the frame. The shrink is therefore kept
     to 1.5% (7.5px at this size) and the lift raised to 22px, leaving ~14px of head above
     the box. Any future change to one has to be checked against the other. */
  .brgw-sec--team-members figure:hover .card{z-index:2;--z:.985;}

  /* top free, sides exactly as the per-person setting left them */
  /* STAY INSIDE THE BOX, per person. Sean, 1 Oct: "there's some that should go beyond
     it, and there's some that should not (for example, if they intentionally have a crop
     at the top of them)." A headshot already cut off at the crown has nothing to lift out
     of the frame — raising it only exposes the flat edge of the cut, so letting the top
     escape makes that photo look broken rather than lively. Written as :not() on the rule
     that frees the top, so "stay cropped" is the ABSENCE of an exception rather than a
     second rule fighting the first on specificity. */
  .brgw-sec--team-members figure:hover .card[data-overflow="hidden"]:not([data-hovercrop="keep"]),
  .brgw-sec--team-members figure:hover .card[data-overflow=""]:not([data-hovercrop="keep"]){
    overflow-x:clip;overflow-y:visible;}

  .brgw-sec--team-members figure:hover .card[data-fit="height"]:not([data-hovercrop="keep"]) img,
  .brgw-sec--team-members figure:hover .card[data-fit=""]:not([data-hovercrop="keep"]) img{bottom:22px;}
  /* THE LIFT IS DROPPED, NOT JUST CLIPPED. With the box still closed, a 22px lift would
     simply cut 22px off the top of the head — the opposite of what this setting is for.
     The scale stays, per Sean ("that should also be still scaling"), but it anchors to the
     TOP rather than the base, so the photo stays flush with the top edge of the color and
     shrinks downward; the few pixels that open at the bottom sit behind the name plate,
     which already overlaps the card by about 50px. */
  .brgw-sec--team-members figure .card[data-hovercrop="keep"] img{transform-origin:top center;}
  .brgw-sec--team-members figure:hover .card[data-fit="cover"] img,
  .brgw-sec--team-members figure:hover .card[data-fit="contain"] img{
    transform:translateY(-14px) scale(.985);}

  .brgw-sec--team-members figure:hover .bar{transform:rotate(-0.7deg);}
}
/* Motion is decoration here, so it goes entirely rather than being shortened. The
   escaping top goes with it: without the movement it is just a clipped head. */
@media (prefers-reduced-motion:reduce){
  .brgw-sec--team-members figure .card::before,
  .brgw-sec--team-members figure .card img,
  .brgw-sec--team-members figure .bar{transition:none!important;}
  .brgw-sec--team-members figure:hover .card::before{transform:none;}
  .brgw-sec--team-members figure:hover .card{--z:1;}
  .brgw-sec--team-members figure:hover .card[data-overflow="hidden"],
  .brgw-sec--team-members figure:hover .card[data-overflow=""]{overflow:hidden;}
  .brgw-sec--team-members figure:hover .card[data-fit="height"] img,
  .brgw-sec--team-members figure:hover .card[data-fit=""] img{bottom:0;}
  .brgw-sec--team-members figure:hover .bar{transform:rotate(-2.2deg);}
}
