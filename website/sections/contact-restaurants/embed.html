<!-- BRG · section: contact-restaurants  →  [brg_contact-restaurants]
     Built from Expo SPEC-006 §2.3. Closing band, re-skin of community-partner's shape.

     This section exists to catch a hole in the routing above: the single most likely reason a
     stranger lands on a restaurant group's Contact page is that they want ONE restaurant's
     address or hours, and none of the four route cards serve them.

     NO MAP EMBED, deliberately (BUILD-SPEC §2.7 floats one). A third-party map is a script
     inside a fragment that gets inlined into WordPress — cookies, a consent banner, and a
     second JS engine, which the MANIFESTO's one-engine rule pushes back on. The 12 locations
     already live on /our-restaurants/, so a link is the right size for this. -->
<section class="brgw-sec brgw-sec--contact-restaurants reveal" data-nav="light" aria-label="Looking for a restaurant?" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--contact-restaurants{background:var(--teal);color:var(--ink);text-align:center;
  padding:clamp(56px,6.4vw,88px) var(--pad);}
.brgw-sec--contact-restaurants h2{font-size:clamp(1.8rem,4.2vw,3.5rem);text-transform:uppercase;
  max-width:20ch;margin:0 auto;}
.brgw-sec--contact-restaurants .sub{max-width:60ch;margin:clamp(18px,2.2vw,28px) auto 0;
  font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.6;}
.brgw-sec--contact-restaurants .btn{background:var(--ink);color:var(--white);
  margin-top:clamp(26px,3vw,40px);}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <h2 class="blanco anim-head" data-head="words">{{heading}}</h2>
  <p class="sub anim-up">{{sub}}</p>
  <a class="btn anim-cta" data-btn-size="{{btn_size}}" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" href="{{cta_href}}">{{cta_label}}</a>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
