<!-- BRG · section: our-restaurants-brands  →  [brg_our-restaurants-brands]
     Matches the Our Restaurants comp (mocks/BRG - Our Restaurants.png, y 916–2466 @1x).
     Light section. Owns the yellow asterisk seam badge, bleeding upward per the bleed rule.
     Brand plates are the real label artwork (bnb-img-label / odies-img-label), each on the
     image-reveal + parallax hooks. -->
<section class="brgw-sec brgw-sec--our-restaurants-brands reveal" data-nav="light" aria-label="Our brands" data-cta-pos="{{cta_position}}" data-btn-color="{{btn_color}}" data-btn-hover="{{btn_hover}}">
<style>
.brgw-sec--our-restaurants-brands{--brgw-wrap:1400px;position:relative;background:var(--white);color:var(--ink);overflow:visible;
  padding:clamp(78px,8.5vw,124px) var(--pad) clamp(74px,8vw,116px);}
.brgw-sec--our-restaurants-brands .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--our-restaurants-brands .seam img{width:100%;height:auto;display:block;}

.brgw-sec--our-restaurants-brands .brand{display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,64px);
  max-width:var(--brgw-wrap);margin-inline:auto;align-items:center;}
@media(min-width:900px){ .brgw-sec--our-restaurants-brands .brand{grid-template-columns:1fr 1fr;gap:clamp(40px,5vw,84px);} }
/* Hairline rule between the two brands, as in the comp — nothing above or below. */
.brgw-sec--our-restaurants-brands .brand + .brand{margin-top:clamp(46px,5vw,80px);padding-top:clamp(46px,5vw,80px);
  border-top:1px solid var(--ink);}

/* No image-reveal here: these are logo lockups, and the reveal's 2→1.2 counter-scale
   crops the wordmark. A brand mark should never be cropped for the sake of an effect. */
.brgw-sec--our-restaurants-brands .plate{border-radius:14px;aspect-ratio:16/11;overflow:hidden;}
.brgw-sec--our-restaurants-brands .plate img{width:100%;height:100%;object-fit:cover;display:block;}
.brgw-sec--our-restaurants-brands h3{font-size:clamp(1.8rem,3.6vw,3.1rem);text-transform:uppercase;margin-bottom:18px;}
.brgw-sec--our-restaurants-brands p{opacity:.86;font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.62;max-width:46ch;}
.brgw-sec--our-restaurants-brands p + p{margin-top:1.1em;}
.brgw-sec--our-restaurants-brands .btn{margin-top:clamp(24px,2.6vw,36px);}
.brgw-sec--our-restaurants-brands .btn[data-btn-color="keep"],
.brgw-sec--our-restaurants-brands .btn[data-btn-color=""]{
  --brgw-btn-bg:var(--ink);--brgw-btn-fg:var(--white);
  background:var(--brgw-btn-bg);color:var(--brgw-btn-fg);}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <span class="seam" aria-hidden="true" data-mark-pos="{{mark_1_ast_pos}}" data-mark-show="{{mark_1_ast_show}}" data-mark-anim="{{mark_1_ast_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_ast_opacity}}"><img class="brgw-pop" src="{{mark_1_ast_art}}" alt="" width="150" height="146" loading="lazy" decoding="async"></span>

  <div class="brand">
    <div class="plate" data-brgw-frame>
      <img class="anim-up" src="{{bnb_image}}"
           alt="Board &amp; Brew" width="800" height="550" decoding="async" loading="lazy" data-tone="{{bnb_image_tone}}" data-px="{{bnb_image_px}}" data-px-dir="{{bnb_image_px_dir}}">
    </div>
    <div>
      <h3 class="blanco anim-head">{{bnb_heading}}</h3>
      <p class="anim-up">{{bnb_body_1}}</p>
      <p class="anim-up">{{bnb_body_2}}</p>
      <a class="btn anim-cta" data-btn-size="{{btn_size}}" data-btn-color="{{bnb_cta_color}}" data-btn-hover="{{bnb_cta_hover}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" href="{{bnb_cta_href}}" target="_blank" rel="noopener">{{bnb_cta_label}}</a>
    </div>
  </div>

  <div class="brand">
    <div class="plate" data-brgw-frame>
      <img class="anim-up" src="{{odies_image}}"
           alt="Odie's Pizza Co." width="800" height="550" decoding="async" loading="lazy" data-tone="{{odies_image_tone}}" data-px="{{odies_image_px}}" data-px-dir="{{odies_image_px_dir}}">
    </div>
    <div>
      <h3 class="blanco anim-head">{{odies_heading}}</h3>
      <p class="anim-up">{{odies_body_1}}</p>
      <p class="anim-up">{{odies_body_2}}</p>
      <a class="btn anim-cta" data-btn-size="{{btn_size}}" data-btn-color="{{odies_cta_color}}" data-btn-hover="{{odies_cta_hover}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" href="{{odies_cta_href}}" target="_blank" rel="noopener">{{odies_cta_label}}</a>
    </div>
  </div>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-hover="{{btn_hover}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-hover="{{buttons.hover}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
