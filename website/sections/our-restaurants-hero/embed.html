<!-- BRG · section: our-restaurants-hero  →  [brg_our-restaurants-hero]
     Type hero (no photo). Same build as the other type heroes — headline, marker
     underline, lede, scattered doodles — differing only in copy, underline colour
     and which brand icons scatter. Real icon artwork, not hand-drawn paths. -->
<section class="brgw-sec brgw-sec--our-restaurants-hero brgw-hero reveal" aria-label="Our Restaurants">
<style>
.brgw-sec--our-restaurants-hero{overflow:hidden;}
.brgw-sec--our-restaurants-hero .brgw-uline{color:var(--teal);}
</style>
  <h1 class="blanco anim-head" data-head="words">{{heading}}</h1>
  <span class="brgw-uline anim-up" aria-hidden="true"></span>
  <p class="sub anim-up">{{sub}}</p>
  <span class="brgw-doodle brgw-doodle--c" style="top:var(--brgw-doodle-top);right:9%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-circle-wht.svg" alt="" width="122" height="118"></span>
  <span class="brgw-doodle" style="bottom:var(--brgw-doodle-bottom);left:8%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg" alt="" width="129" height="207"></span>
</section>
