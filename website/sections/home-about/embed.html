<!-- BRG · section: home-about  →  [brg_home-about]
     Matches website/mocks/brg_home-about. Light section — .brgw is white-on-dark, so this
     re-grounds to ink. Full-bleed color photograph on the left half, content on the right;
     below 940px the photo goes full-width above the copy rather than shrinking to a sliver. -->
<section class="brgw-sec brgw-sec--home-about reveal" data-nav="light" aria-label="What we're about" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--home-about{background:var(--white);color:var(--ink);}
.brgw-sec--home-about .grid{display:grid;grid-template-columns:1fr;align-items:stretch;}
@media(min-width:940px){ .brgw-sec--home-about .grid{grid-template-columns:1fr 1fr;} }

.brgw-sec--home-about .shot{position:relative;min-height:clamp(260px,46vw,620px);overflow:hidden;}
/* Scale + reveal are owned by the GSAP layer (data-brgw-img); the CSS here only
   guarantees the picture is visible and correctly cropped if that layer never loads. */
.brgw-sec--home-about .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

.brgw-sec--home-about .body{display:flex;flex-direction:column;justify-content:center;
  gap:clamp(26px,3vw,44px);padding:clamp(52px,6vw,90px) var(--pad);text-align:center;}
/* Yellow marker block behind the section title, rotated as in the comp. */
.brgw-sec--home-about h2{display:inline-block;align-self:center;background:var(--yellow);color:var(--ink);
  font-size:clamp(1.7rem,3.4vw,3rem);text-transform:uppercase;padding:.04em .3em;
  transform:rotate(-1.6deg);}
.brgw-sec--home-about .lbl{display:inline-block;align-self:center;background:var(--teal);color:var(--white);
  font-weight:700;font-size:clamp(.66rem,.82vw,.76rem);letter-spacing:.22em;text-transform:uppercase;
  padding:9px 20px;}
.brgw-sec--home-about .big{font-size:clamp(1.35rem,2.5vw,2.05rem);text-transform:uppercase;
  max-width:22ch;margin-inline:auto;}
.brgw-sec--home-about .pair{display:grid;gap:clamp(14px,1.6vw,22px);}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <div class="grid">
    <div class="shot brgw-img" data-brgw-img>
      <img src="{{photo}}"
           alt="Friends walking the Oceanside pier at golden hour" width="1600" height="1067"
           decoding="async" loading="lazy" data-tone="{{photo_tone}}" data-px="{{photo_px}}" data-px-dir="{{photo_px_dir}}" data-float="{{photo_float}}" data-float-dir="{{photo_float_dir}}">
    </div>
    <div class="body">
      <h2 class="blanco anim-head">{{heading}}</h2>
  <div class="brgw-cta" data-cta-at="head" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
      <div class="pair">
        <span class="lbl anim-up">{{vision_label}}</span>
        <div class="big blanco anim-up">{{vision_text}}</div>
      </div>
      <div class="pair">
        <span class="lbl anim-up">{{mission_label}}</span>
        <div class="big blanco anim-up">{{mission_text}}</div>
      </div>
    </div>
  </div>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
