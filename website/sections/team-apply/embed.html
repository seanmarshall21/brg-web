<!-- BRG · section: team-apply  →  [brg_team-apply]
     Teal band. Doodle cluster bleeds off the bottom-right corner as in the comp.
     ACF-editable (slots.json beside this file): heading, sub copy, CTA label + href. The
     <h2> IS wired here, unlike careers-apply's — it has no structural <br> and no inline
     span, so it free-wraps inside max-width:20ch and substituted copy behaves like
     authored copy. The cluster is decorative and stays as code. -->
<section class="brgw-sec brgw-sec--team-apply reveal" data-nav="light" aria-label="Join the team" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--team-apply{position:relative;background:var(--teal);color:var(--ink);overflow:hidden;
  text-align:center;padding:clamp(56px,6.4vw,88px) var(--pad);}
.brgw-sec--team-apply h2{font-size:clamp(1.8rem,4.2vw,3.5rem);text-transform:uppercase;max-width:20ch;margin:0 auto;}
.brgw-sec--team-apply .sub{max-width:60ch;margin:clamp(18px,2.2vw,28px) auto 0;
  font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.6;}
.brgw-sec--team-apply .btn{background:var(--ink);color:var(--white);margin-top:clamp(26px,3vw,40px);}
.brgw-sec--team-apply .cluster{position:absolute;right:2%;bottom:-24%;width:clamp(130px,15vw,230px);
  z-index:2;pointer-events:none;}
.brgw-sec--team-apply .cluster img{width:100%;height:auto;display:block;}
@media(max-width:760px){ .brgw-sec--team-apply .cluster{display:none;} }
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <h2 class="blanco anim-head" data-head="words">{{heading}}</h2>
  <p class="sub anim-up">{{sub}}</p>
  <a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" href="{{cta_href}}">{{cta_label}}</a>
  <span class="cluster" aria-hidden="true" data-mark-pos="{{mark_1_all_trim_pos}}" data-mark-show="{{mark_1_all_trim_show}}" data-mark-anim="{{mark_1_all_trim_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_all_trim_opacity}}"><img class="brgw-pop" src="{{mark_1_all_trim_art}}" alt="" width="302" height="310" loading="lazy" decoding="async"></span>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
