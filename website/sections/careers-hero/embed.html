<!-- BRG · section: careers-hero  →  [brg_careers-hero]
     The sub highlight reveals per the shared variant system in brgw.css, picked with
     [brg_careers-hero hl_variant="h1"]. Default h3 (rough block + angled wipe) matches
     the comps; h1 is the one that survives a line wrap. -->
<section class="brgw-sec brgw-sec--careers-hero brgw-hero reveal" data-bg-style="{{bg_style}}" data-nav="dark" data-uline="{{uline_variant}}" data-hl="{{hl_variant}}" aria-label="Careers" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--careers-hero{overflow:hidden;}
/* Underline is now Sean's line-careers-lg.svg; its color is baked into the path fill,
   so the old `color:var(--teal)` is gone rather than left as a rule that does nothing.
   Geometry matches the blob it replaces; the reveal is the shared system in brgw.css. */
/* Width is the ARTWORK'S OWN LENGTH at home-hero's scale, not a shared number.
   line-careers-lg.svg is 1122 units and home renders its 845 at 640px, so 1122x0.757
   = 850px keeps this stroke the same WEIGHT as home's. A flat width for every hero
   would thin the wide sources and fatten the narrow ones, because height is auto and
   the aspect ratio differs per drawing. The 62% keeps it responsive on narrow screens.
   (Was min(340px,62%) — inherited from the CSS blob this replaced, which was a small
   decorative bar; on a ~1100px headline it read as far too short.) */
.brgw-sec--careers-hero .uline{display:block;width:min(850px,62%);margin:16px auto 0;height:auto;}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <!-- Background photo + color overlay, both ACF. The scrim NESTS INSIDE the photo
       layer so that "no photo" and "no overlay" are one state: an empty photo hides
       the parent and takes the overlay with it, which is why adding this control
       changes nothing on a hero that has no photo set. Rules live in brgw.css. -->
  <div class="hero-bg" data-bg="{{bg_photo}}" data-vid-set="{{video_id}}"
       aria-hidden="true" data-tone="{{bg_photo_tone}}" data-brgw-frame>
    <!-- THE SPLASH PAGE'S BACKGROUND, as a hero option (Sean, 3 Oct). Four photo plates
         that enter once and hand off to a slow drift; the splash's graphics — logo,
         COMING SOON, doodles, tagline, CTA — are deliberately not here.
         OFF unless Background style is set to the splash animation, so a hero nobody
         has touched renders exactly as it does today. Each plate takes its own photo;
         left empty it keeps the splash original, and --sp-img is only ever READ by a
         rule gated on data-img being non-empty, so an empty one is never fetched. -->
    <div class="splash-bg" aria-hidden="true">
      <span class="sp sp--skater" data-brgw-frame data-px-bleed data-px="{{splash_skater_px}}" data-px-dir="{{splash_skater_px_dir}}" data-show="{{splash_skater_on}}" data-img="{{splash_skater}}" style="--sp-img:url('{{splash_skater}}')"></span>
      <span class="sp sp--car" data-brgw-frame data-px="{{splash_car_px}}" data-px-dir="{{splash_car_px_dir}}"    data-show="{{splash_car_on}}"    data-img="{{splash_car}}"    style="--sp-img:url('{{splash_car}}')"></span>
      <span class="sp sp--surfer" data-brgw-frame data-px="{{splash_surfer_px}}" data-px-dir="{{splash_surfer_px_dir}}" data-show="{{splash_surfer_on}}" data-img="{{splash_surfer}}" style="--sp-img:url('{{splash_surfer}}')"></span>
      <span class="sp sp--crown" data-brgw-frame data-px="{{splash_crown_px}}" data-px-dir="{{splash_crown_px_dir}}"  data-show="{{splash_crown_on}}"  data-img="{{splash_crown}}"  style="--sp-img:url('{{splash_crown}}')"></span>
    </div>
    <!-- THE PHOTO IS A REAL <img> NOW, not a CSS background, because the parallax
         engine moves an element and cannot move a background-image. NO src ATTRIBUTE:
         the <img> was rejected here originally because an empty src resolves against
         the PAGE and re-downloads the document as an image for every visitor. A
         <source srcset=""> is SKIPPED instead, and an <img> with no src makes no
         request at all — so "no photo set" costs nothing, which is the whole reason
         the background-image version existed. -->
    <picture>
      <source media="(max-width:767px)" srcset="{{bg_photo_mobile}}">
      <source srcset="{{bg_photo}}">
      <img alt="" decoding="async" width="1920" height="1280"
           data-px="{{bg_photo_px}}" data-px-dir="{{bg_photo_px_dir}}">
    </picture>
    <div class="vid" data-vid="{{video_id}}" data-src="{{video_source}}"></div>
    <span class="hero-scrim" data-scrim="{{overlay_color}}" style="--brgw-scrim-o:{{overlay_strength}}"></span>
  </div>
  <h1 class="blanco anim-head" data-head="words">{{heading}}</h1>
  <div class="brgw-cta" data-cta-at="head" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
  <img class="uline anim-up" aria-hidden="true" alt="" width="1122" height="31"
       src="https://blacktoprg.netlify.app/assets/media/lines/line-careers-lg.svg">
  <p class="sub anim-up">{{sub_1}} <span class="hl"><svg class="hl-b" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"><path d="M5,6 C62,3 140,5 210,3 C228,2 236,4 236,9 C237,20 235,31 234,38 C233,42 226,43 208,42 C138,40 64,42 10,41 C5,41 3,38 3,31 C2,22 2,12 5,6 Z"/></svg><span class="hl-t">{{sub_highlight}}</span></span></p>
  <span class="brgw-doodle brgw-doodle--c" aria-hidden="true" data-mark-pos="{{mark_1_ast_circle_pos}}" data-mark-show="{{mark_1_ast_circle_show}}" data-mark-anim="{{mark_1_ast_circle_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_ast_circle_opacity}}"><img src="{{mark_1_ast_circle_art}}" alt="" width="122" height="118"></span>
  <span class="brgw-doodle brgw-doodle--b" aria-hidden="true" data-mark-pos="{{mark_2_smile_pos}}" data-mark-show="{{mark_2_smile_show}}" data-mark-anim="{{mark_2_smile_anim}}" data-mark-o style="--brgw-mark-o:{{mark_2_smile_opacity}}"><img src="{{mark_2_smile_art}}" alt="" width="215" height="208"></span>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
