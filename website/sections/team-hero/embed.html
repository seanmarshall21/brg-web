<!-- BRG · section: team-hero  →  [brg_team-hero] -->
<section class="brgw-sec brgw-sec--team-hero brgw-hero reveal" data-uline="{{uline_variant}}" aria-label="Team">
<style>
.brgw-sec--team-hero{overflow:hidden;}
/* Underline is now Sean's line-team-lg.svg; its colour is baked into the path fill,
   so the old `color:var(--pink)` is gone rather than left as a rule that does nothing.
   Geometry matches the blob it replaces; the reveal is the shared system in brgw.css. */
/* Width is the ARTWORK'S OWN LENGTH at home-hero's scale, not a shared number.
   line-team-lg.svg is 647 units and home renders its 845 at 640px, so 647x0.757
   = 490px keeps this stroke the same WEIGHT as home's. A flat width for every hero
   would thin the wide sources and fatten the narrow ones, because height is auto and
   the aspect ratio differs per drawing. The 62% keeps it responsive on narrow screens.
   (Was min(340px,62%) — inherited from the CSS blob this replaced, which was a small
   decorative bar; on a ~1100px headline it read as far too short.) */
.brgw-sec--team-hero .uline{display:block;width:min(490px,62%);margin:16px auto 0;height:auto;}
</style>
  <h1 class="blanco anim-head">{{heading}}</h1>
  <img class="uline anim-up" aria-hidden="true" alt="" width="647" height="25"
       src="https://blacktoprg.netlify.app/assets/media/lines/line-team-lg.svg">
  <p class="sub anim-up">{{sub_1}} <span style="color:var(--pink)">{{sub_highlight}}</span>{{sub_2}}</p>
  <span class="brgw-doodle" style="top:var(--brgw-doodle-top);right:9%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg" alt="" width="129" height="207"></span>
  <span class="brgw-doodle brgw-doodle--b" style="bottom:var(--brgw-doodle-bottom);left:8%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-smile-yel.svg" alt="" width="215" height="208"></span>
</section>
