<!-- BRG · section: home-hero  →  [brg_home-hero]
     Background + entrance ported from the coming-soon splash (css/brg-coming-soon.css):
     the same four-plate photo collage — skater full-bleed, car in from the left, surfer in
     from the bottom-right, spray crown top-right — over drifting blobs, grit and noise.
     Entrance timings and offsets are the splash's own values.

     Two deliberate differences from the splash:
      · Classes/keyframes are namespaced brgw-hh-* rather than reusing the splash's brg-*.
        Everything here renders in ONE shared namespace on the WP page (no iframe), so the
        MANIFESTO's uniqueness rule applies — a collision would be silent and horrible.
      · Entrance is gated on .is-in (the shared reveal engine) instead of firing on load,
        so the plates animate when the hero is actually seen and never flash pre-paint. -->
<section class="brgw-sec brgw-sec--home-hero brgw-hero reveal" aria-label="Blacktop Restaurant Group">
<style>
.brgw-sec--home-hero{
  --mute:rgba(16,15,13,.66);              /* the splash's veil, mutes car/surfer to skater level */
  position:relative;overflow:hidden;background:var(--bg2);
  min-height:88vh;display:grid;place-items:center;
  padding:clamp(90px,14vh,160px) var(--pad) clamp(70px,10vh,120px);}

/* ---- background collage ------------------------------------------------ */
.brgw-sec--home-hero .bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.brgw-sec--home-hero .plate{position:absolute;background-repeat:no-repeat;background-size:cover;
  background-position:center;opacity:0;filter:grayscale(1) contrast(1.04);will-change:transform,opacity;}

/* Skater: full-bleed, edges dissolved by a radial mask so it never hard-cuts. */
.brgw-sec--home-hero .plate--skater{inset:0;width:100%;height:100%;transform:scale(1.2);
  background-image:url('https://blacktoprg.netlify.app/assets/media/bg/skater.webp');
  -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 46%, #000 64%, transparent 100%);
  mask-image:radial-gradient(ellipse 100% 100% at 50% 46%, #000 64%, transparent 100%);}
.brgw-sec--home-hero.is-in .plate--skater{
  animation:brgw-hh-skater 1.6s cubic-bezier(.16,.72,.2,1) both, brgw-hh-drift 42s ease-in-out 1.6s infinite;}

/* Car: bottom-left, in from the left. Edges dissolved by a mask — the splash painted a
   --bg2 edge instead, which works there because its base IS flat --bg2; ours is the
   veiled skater, so a painted edge reads as a visible rectangle. */
.brgw-sec--home-hero .plate--car{left:0;bottom:0;width:31%;height:58%;opacity:0;
  background-image:linear-gradient(var(--mute), var(--mute)),
    url('https://blacktoprg.netlify.app/assets/media/bg/car.webp');
  -webkit-mask-image:radial-gradient(ellipse 66% 68% at 42% 62%, #000 12%, transparent 96%);
  mask-image:radial-gradient(ellipse 66% 68% at 42% 62%, #000 12%, transparent 96%);}
.brgw-sec--home-hero.is-in .plate--car{animation:brgw-hh-car 1.5s cubic-bezier(.16,.72,.2,1) .25s both;}

/* Surfer: bottom-right, in from the bottom-right. Masked for the same reason as the car. */
.brgw-sec--home-hero .plate--surfer{right:0;bottom:0;width:29%;height:78%;opacity:0;
  background-image:linear-gradient(var(--mute), var(--mute)),
    url('https://blacktoprg.netlify.app/assets/media/bg/surfer.webp');
  -webkit-mask-image:radial-gradient(ellipse 64% 68% at 58% 62%, #000 12%, transparent 96%);
  mask-image:radial-gradient(ellipse 64% 68% at 58% 62%, #000 12%, transparent 96%);}
.brgw-sec--home-hero.is-in .plate--surfer{animation:brgw-hh-surfer 1.5s cubic-bezier(.16,.72,.2,1) .4s both;}

/* Spray crown: pre-knocked-out white mark, top-right. */
.brgw-sec--home-hero .plate--crown{top:3%;right:3%;width:11%;aspect-ratio:1/1;height:auto;
  background-size:contain;filter:none;
  background-image:url('https://blacktoprg.netlify.app/assets/media/bg/crown-white.webp');}
.brgw-sec--home-hero.is-in .plate--crown{animation:brgw-hh-crown .8s cubic-bezier(.2,.9,.3,1) .75s both;}

/* Blobs / grit / noise — the splash's atmosphere layer. */
.brgw-sec--home-hero .blob{position:absolute;border-radius:45%;filter:blur(42px);
  mix-blend-mode:screen;pointer-events:none;will-change:transform;}
.brgw-sec--home-hero .blob--1{width:46vmax;height:46vmax;left:-10%;top:-12%;opacity:.06;
  background:radial-gradient(circle at 50% 50%, var(--yellow), transparent 68%);
  animation:brgw-hh-blob 34s ease-in-out infinite;}
.brgw-sec--home-hero .blob--2{width:38vmax;height:38vmax;right:-8%;bottom:-10%;opacity:.045;
  background:radial-gradient(circle at 50% 50%, #fff, transparent 70%);
  animation:brgw-hh-blob 46s ease-in-out -12s infinite reverse;}
.brgw-sec--home-hero .grit{position:absolute;inset:-4%;background:center/cover no-repeat
  url('https://blacktoprg.netlify.app/assets/media/bg/grit.webp');
  opacity:.45;mix-blend-mode:overlay;animation:brgw-hh-drift 48s ease-in-out infinite;}
.brgw-sec--home-hero .veil{position:absolute;inset:0;z-index:1;
  background:radial-gradient(120% 90% at 50% 30%, rgba(0,0,0,.15), rgba(19,18,16,.86) 78%);}

@keyframes brgw-hh-skater{0%{opacity:0;transform:scale(1.2);}100%{opacity:.30;transform:scale(1.02);}}
@keyframes brgw-hh-drift{0%,100%{transform:scale(1.02) translate3d(0,0,0);}50%{transform:scale(1.05) translate3d(-1%,.8%,0);}}
@keyframes brgw-hh-car{0%{opacity:0;transform:translateX(-60%);}100%{opacity:.72;transform:translateX(0);}}
@keyframes brgw-hh-surfer{0%{opacity:0;transform:translate(58%,46%);}100%{opacity:.72;transform:translate(0,0);}}
@keyframes brgw-hh-crown{0%{opacity:0;transform:scale(.7);}100%{opacity:.8;transform:scale(1);}}
@keyframes brgw-hh-blob{
  0%,100%{border-radius:42% 58% 63% 37%/45% 38% 62% 55%;transform:translate(0,0) rotate(0deg) scale(1);}
  50%    {border-radius:58% 42% 38% 62%/55% 62% 38% 45%;transform:translate(6%,4%) rotate(18deg) scale(1.08);}}

/* ---- foreground ------------------------------------------------------- */
.brgw-sec--home-hero > *:not(.bg){position:relative;z-index:2;}
.brgw-sec--home-hero h1{font-size:clamp(2.6rem,7vw,6rem);max-width:15ch;}
.brgw-sec--home-hero .sub{font-size:clamp(1rem,1.4vw,1.35rem);max-width:46ch;margin:26px auto 8px;}
.brgw-sec--home-hero .tag{font-size:clamp(1.4rem,2.6vw,2.4rem);color:var(--yellow);margin:14px auto 34px;}
.brgw-sec--home-hero .brgw-uline{color:var(--yellow);}

/* Below the phone breakpoint the side plates crowd the headline — drop to skater only,
   which is exactly what the splash does at small widths. */
@media (max-width:700px){
  .brgw-sec--home-hero .plate--car,
  .brgw-sec--home-hero .plate--surfer,
  .brgw-sec--home-hero .plate--crown{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .brgw-sec--home-hero .plate{animation:none!important;transform:none!important;}
  .brgw-sec--home-hero .plate--skater{opacity:.30!important;}
  .brgw-sec--home-hero .plate--car,
  .brgw-sec--home-hero .plate--surfer{opacity:.72!important;}
  .brgw-sec--home-hero .plate--crown{opacity:.8!important;}
  .brgw-sec--home-hero .blob,.brgw-sec--home-hero .grit{animation:none!important;}
}
</style>
  <div class="bg" aria-hidden="true">
    <div class="plate plate--skater"></div>
    <div class="plate plate--car"></div>
    <div class="plate plate--surfer"></div>
    <div class="plate plate--crown"></div>
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="grit"></div>
    <div class="veil"></div>
  </div>

  <h1 class="blanco anim-head" data-head="words">We're in the business of making your day great.</h1>
  <p class="sub anim-up">From a classic Board &amp; Brew sandwich to a slice at Odie's &mdash; we're here for the moments that matter.</p>
  <p class="tag blanco anim-up">Good food. Real people. Rad experience.</p>
  <a class="btn anim-cta" href="/our-restaurants/">Explore Our Restaurants</a>
  <span class="brgw-uline anim-up" aria-hidden="true"></span>
</section>
