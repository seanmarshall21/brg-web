<!-- BRG · section: home-different  →  [brg_home-different]
     Matches website/mocks/brg_home-different.
     Owns the white paper-tag BOLT badge at top-left, which bleeds upward over the seam into
     home-about (bleed rule: lower section owns it). The color blocks on the right are
     literal design elements in the comp, not photo placeholders. -->
<section class="brgw-sec brgw-sec--home-different reveal" data-nav="dark" data-hl="{{hl_variant}}" aria-label="A different kind of restaurant company" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--home-different{position:relative;background:#232120;overflow:visible;
  padding:clamp(88px,10vw,150px) var(--pad) clamp(80px,9vw,130px);}
.brgw-sec--home-different::after{content:"";position:absolute;right:-4%;top:0;width:52%;height:58%;
  z-index:0;pointer-events:none;opacity:.13;
  background:right top/contain no-repeat
    url('https://blacktoprg.netlify.app/assets/media/bkgnds/brg-pattern-blk@2x.webp');}
.brgw-sec--home-different > *{position:relative;z-index:2;}

/* Paper tag: white card, tilted, bolt centered — bleeds up over the seam. */
.brgw-sec--home-different .seam{position:absolute;top:0;left:clamp(24px,7vw,150px);
  width:clamp(74px,7vw,104px);aspect-ratio:104/128;background:var(--white);
  transform:translateY(-46%) rotate(-7deg);display:grid;place-items:center;z-index:5;
  box-shadow:0 10px 26px rgba(0,0,0,.34);}
.brgw-sec--home-different .seam img{width:40%;height:auto;display:block;filter:invert(1);}
  /* bolt.svg ships white — invisible on the white tag; the comp's is black. */

.brgw-sec--home-different .grid{display:grid;grid-template-columns:1fr;gap:clamp(44px,5vw,80px);
  max-width:1500px;margin-inline:auto;align-items:center;}
@media(min-width:940px){ .brgw-sec--home-different .grid{grid-template-columns:1.02fr .98fr;gap:clamp(48px,6vw,110px);} }

.brgw-sec--home-different h2{font-size:clamp(1.6rem,3.05vw,2.65rem);text-transform:uppercase;
  margin-bottom:clamp(28px,3.2vw,46px);}
/* Pink marker block on the opening phrase. */
/* Look is unchanged; it now travels as variables the shared highlight system reads.
   --brgw-hl-rot is 0deg because THIS element already rotates — letting the h3 block
   add its own -1.4deg on top would compound into a visible skew. */
.brgw-sec--home-different h2 .mark{--brgw-hl-c:var(--pink);--brgw-hl-pad:.03em .2em;--brgw-hl-rot:0deg;
  display:inline-block;transform:rotate(-1.6deg);}
.brgw-sec--home-different p{opacity:.88;font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.62;max-width:47ch;}
.brgw-sec--home-different p + p{margin-top:1.25em;}

/* Three overlapping IMAGE plates, at the comp's block positions. The comp draws them as
   flat yellow/black/white, but they're image slots — same treatment as home-community.
   Each keeps its comp color as the background beneath the photograph, so a missing or
   slow image still reads as the composition rather than as a hole. */
.brgw-sec--home-different .blocks{position:relative;aspect-ratio:4/3.2;min-height:280px;}
.brgw-sec--home-different .blocks .p{position:absolute;display:block;overflow:hidden;}
.brgw-sec--home-different .blocks .p img{width:100%;height:100%;object-fit:cover;display:block;
  filter:contrast(1.05);}
.brgw-sec--home-different .blocks .y{right:8%;top:0;width:62%;height:60%;background:var(--yellow);}
.brgw-sec--home-different .blocks .k{right:0;top:34%;width:52%;height:62%;background:#000;z-index:2;}
.brgw-sec--home-different .blocks .w{left:6%;top:52%;width:26%;height:29%;background:var(--white);z-index:3;}

/* SD|CA, top right — in the comp, and supplied by Sean as its own SVG. A placed mark
   rather than part of the background artwork, so it keeps its position and its size
   regardless of how the background behind it is cropped. Above the background layer,
   below the copy. */
.brgw-sec--home-different .sdca{position:absolute;top:4%;right:3%;z-index:1;
  width:clamp(130px,19vw,300px);opacity:.1;pointer-events:none;}
.brgw-sec--home-different .sdca img{width:100%;height:auto;display:block;}
@media(max-width:760px){ .brgw-sec--home-different .sdca{width:120px;top:2%;right:4%;} }
</style>
  <span class="sdca" aria-hidden="true"><img src="https://blacktoprestaurantgroup.com/wp-content/uploads/2026/10/brg-icn-sdca-wht.svg" alt="" width="600" height="300" loading="lazy" decoding="async"></span>
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <span class="seam" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/svg/icons/bolt.svg" alt="" width="94" height="176" loading="lazy" decoding="async"></span>

  <div class="grid">
    <div>
      <h2 class="blanco anim-head"><span class="mark"><svg class="hl-b" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"><path d="M5,6 C62,3 140,5 210,3 C228,2 236,4 236,9 C237,20 235,31 234,38 C233,42 226,43 208,42 C138,40 64,42 10,41 C5,41 3,38 3,31 C2,22 2,12 5,6 Z"/></svg><span class="hl-t">{{heading_mark}}</span></span> {{heading_1}}</h2>
  <div class="brgw-cta" data-cta-at="head"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
      <p class="anim-up">{{body_1}}</p>
      <p class="anim-up">{{body_2}}</p>
      <p class="anim-up">{{body_3}}</p>
    </div>
    <!-- Parallax rates alternate in sign and grow with how far forward the plate sits, so
         the three separate as you scroll instead of tracking together. Stand-in photography
         — Sean to name the real three. -->
    <div class="blocks anim-up">
      <span class="p y brgw-img" data-brgw-img>
        <img src="{{photo_1}}" alt=""
             width="1600" height="1067" decoding="async" loading="lazy" data-tone="{{photo_1_tone}}" data-px="{{photo_1_px}}" data-px-dir="{{photo_1_px_dir}}" data-float="{{photo_1_float}}" data-float-dir="{{photo_1_float_dir}}">
      </span>
      <span class="p k brgw-img" data-brgw-img>
        <img src="{{photo_2}}" alt=""
             width="733" height="1100" decoding="async" loading="lazy" data-tone="{{photo_2_tone}}" data-px="{{photo_2_px}}" data-px-dir="{{photo_2_px_dir}}" data-float="{{photo_2_float}}" data-float-dir="{{photo_2_float_dir}}">
      </span>
      <span class="p w brgw-img" data-brgw-img>
        <img src="{{photo_3}}" alt=""
             width="548" height="820" decoding="async" loading="lazy" data-tone="{{photo_3_tone}}" data-px="{{photo_3_px}}" data-px-dir="{{photo_3_px_dir}}" data-float="{{photo_3_float}}" data-float-dir="{{photo_3_float_dir}}">
      </span>
    </div>
  </div>
  <div class="brgw-cta" data-cta-at="foot"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
