<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Home — what we're about — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: home-about  →  [brg_home-about]
     Matches website/mocks/brg_home-about. Light section — .brgw is white-on-dark, so this
     re-grounds to ink. Full-bleed color photograph on the left half, content on the right;
     below 940px the photo goes full-width above the copy rather than shrinking to a sliver. -->
<section data-sec-color="{{section_color}}" data-sec-text="{{section_text}}" data-sec-custom="{{section_color_custom}}" class="brgw-sec brgw-sec--home-about reveal" data-nav="light" data-hl="{{hl_variant}}" data-shot="{{photo_height}}" data-values="{{values_on}}" data-vlayout="{{values_layout}}" data-vtone="{{values_tone}}" data-vil="{{values_img_light}}" data-vila="{{values_img_light_amt}}" data-vsb="{{values_soft_base}}" data-vid="{{values_img_dark}}" data-vida="{{values_img_dark_amt}}" aria-label="What we're about" data-cta-pos="{{cta_position}}">
<style>
/* position:relative makes THIS section the anchor for its .sec-bg layer. Without it the layer
   anchors to the page and a background chosen here appeared on the hero (Sean, 31 Oct). */
.brgw-sec--home-about{--v-pad:clamp(12px,1.4vw,20px);position:relative;background:var(--white);color:var(--ink);}
.brgw-sec--home-about .grid{display:grid;grid-template-columns:1fr;align-items:stretch;}
@media(min-width:940px){ .brgw-sec--home-about .grid{grid-template-columns:1fr 1fr;} }

.brgw-sec--home-about .shot{position:relative;min-height:clamp(260px,34vw,480px);overflow:hidden;}
/* Photo height is a setting. "tall" is what it was before Erin asked for the vision and
   mission to shrink (30 Oct): the photo was driving the section's height. */
.brgw-sec--home-about[data-shot="tall"] .shot{min-height:clamp(260px,46vw,620px);}
.brgw-sec--home-about[data-shot="short"] .shot{min-height:clamp(220px,26vw,360px);}
/* Scale + reveal are owned by the GSAP layer (data-brgw-img); the CSS here only
   guarantees the picture is visible and correctly cropped if that layer never loads. */
.brgw-sec--home-about .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

.brgw-sec--home-about .body{display:flex;flex-direction:column;justify-content:center;
  gap:clamp(26px,3vw,44px);padding:clamp(52px,6vw,90px) var(--pad);text-align:center;}
/* Yellow marker block behind the section title, rotated as in the comp. */
.brgw-sec--home-about h2{display:inline-block;align-self:center;background:var(--yellow);color:var(--ink);
  font-size:clamp(1.7rem,3.4vw,3rem);text-transform:uppercase;padding:.04em .3em;
  transform:rotate(-1.6deg);}
/* NO MARKED WORDS, NO MARK. Sean, 7 Oct: "What We're About" had no highlight option at all.
   It has one now, and it ships EMPTY so the page does not change until he types the words
   he wants marked. An empty mark would still paint a small block (the text span has padding
   and the h3 block is sized from it), so the attribute the plugin fills in is what hides it.
   Specificity (0,3,0) beats the shared [data-hl="h3"] .mark display rule (0,2,0). */
.brgw-sec--home-about .mark[data-mark=""]{display:none;}
.brgw-sec--home-about .lbl{display:inline-block;align-self:center;background:var(--teal);color:var(--white);
  font-weight:700;font-size:clamp(.66rem,.82vw,.76rem);letter-spacing:.22em;text-transform:uppercase;
  padding:9px 20px;}
.brgw-sec--home-about .big{font-size:clamp(1rem,1.55vw,1.3rem);text-transform:uppercase;
  line-height:1.25;max-width:24ch;margin-inline:auto;}
.brgw-sec--home-about .pair{display:grid;gap:clamp(10px,1.1vw,14px);align-content:start;}
.brgw-sec--home-about .pair .lbl{justify-self:center;}
/* Vision and mission side by side, one tight block (Erin, 30 Oct: "shrink them down into a
   tighter side-by-side block so they don't dominate the page"). One column on a phone. */
.brgw-sec--home-about .mv{display:grid;grid-template-columns:1fr;gap:clamp(22px,2.4vw,32px);}
@media(min-width:560px){ .brgw-sec--home-about .mv{grid-template-columns:1fr 1fr;gap:clamp(18px,2vw,30px);} }
.brgw-sec--home-about .body{gap:clamp(18px,2.2vw,30px);}

/* ---- CORE VALUES, in this section (hidden until values_on = on) -------------------------
   Erin 30 Oct: fold Core Values into What We're About; Clayton: a wheel, with the definition
   appearing when the cursor goes over a value. The names sit round a ring; the definition of
   the one pointed at (or focused, or tapped) shows in the middle. One is always showing, so
   the middle is never an empty circle. The positions are trigonometry in CSS (cos/sin on an
   angle from --i and --n, which brgw.js sets), so any number of values spaces itself.
   Below 700px, or in a browser without cos(), the ring becomes a row of names with the
   definition in a panel underneath: five labels round a circle is too tight at 390px. */
.brgw-sec--home-about .values-blk{display:none;padding:clamp(40px,5vw,72px) var(--pad) clamp(52px,6vw,90px);
  text-align:center;border-top:1px solid rgba(35,31,32,.14);}
.brgw-sec--home-about[data-values="on"] .values-blk{display:block;}
.brgw-sec--home-about .vh{font-size:clamp(1.3rem,2.3vw,1.9rem);text-transform:uppercase;
  margin-bottom:clamp(22px,3vw,40px);}
.brgw-sec--home-about .wheel{width:100%;max-width:640px;margin-inline:auto;}
.brgw-sec--home-about .ring{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:18px;}
.brgw-sec--home-about .vl{font:inherit;cursor:pointer;border:0;background:var(--teal);color:var(--white);
  font-weight:700;font-size:clamp(.7rem,.9vw,.8rem);letter-spacing:.2em;text-transform:uppercase;
  padding:10px 20px;transition:background-color .2s ease,color .2s ease,transform .2s ease;}
.brgw-sec--home-about .vl:hover,
.brgw-sec--home-about .vl:focus-visible,
.brgw-sec--home-about .vl.is-on{background:var(--yellow);color:var(--ink);}
.brgw-sec--home-about .vl:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
.brgw-sec--home-about .core{display:grid;align-items:center;justify-items:center;padding:24px 22px;
  border:2px solid var(--ink);min-height:8.5em;}
.brgw-sec--home-about .def{grid-area:1/1;margin:0;font-size:clamp(.92rem,1.05vw,1rem);line-height:1.55;
  opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s;}
.brgw-sec--home-about .def.is-on{opacity:1;visibility:visible;transition:opacity .25s ease;}
@media(min-width:700px){ @supports (left:calc(50% + 1% * cos(10deg))){
  .brgw-sec--home-about .wheel{position:relative;aspect-ratio:1;max-width:600px;}
  .brgw-sec--home-about .wheel::before{content:"";position:absolute;inset:9%;border:2px dashed rgba(35,31,32,.35);border-radius:50%;}
  .brgw-sec--home-about .ring{display:block;margin:0;}
  .brgw-sec--home-about .vl{position:absolute;white-space:nowrap;
    left:calc(50% + 41% * cos(calc(var(--i, 0) / var(--n, 5) * 360deg - 90deg)));
    top:calc(50% + 41% * sin(calc(var(--i, 0) / var(--n, 5) * 360deg - 90deg)));
    transform:translate(-50%,-50%);}
  .brgw-sec--home-about .vl:hover,
  .brgw-sec--home-about .vl.is-on{transform:translate(-50%,-50%) scale(1.06);}
  .brgw-sec--home-about .core{position:absolute;inset:22%;border-radius:50%;padding:0 6%;min-height:0;}
  .brgw-sec--home-about .def{font-size:clamp(.78rem,1vw,.95rem);}
} }
@media (prefers-reduced-motion:reduce){
  .brgw-sec--home-about .def,.brgw-sec--home-about .vl{transition:none;}
}

/* The numbers come from brgw.js (data-no on each name), not a CSS counter: a counter does not
   count through the list layout's display:contents rows and every name read 00. */
/* ---- CORE VALUES, two more layouts: COLUMNS and LIST (Sean, 30 Oct) -------------------------
   Both read the same values list as the wheel, plus a photo per value, and the Layout setting
   picks which one shows. Columns: numbered, side by side; the open one is wide and solid, the
   rest narrow at 60%. List: numbered names on the left, the open one's photo and words on the
   right. Both can step through by themselves (a pause button shows), and under 800px both are a
   stack of rows where the open row grows downward, because five columns are 78px each at 390px.
   The photo look is chosen separately for a light and a dark background (the Background box
   picks which pair applies): normal, black and white, or soft, which multiplies on light and
   screens on dark at a strength you set. A photo with full strength needs light words and a
   dark shade at its foot, so those looks flip the words white; Soft keeps the tone's own words. */
.brgw-sec--home-about .vset{display:none;}
.brgw-sec--home-about[data-vlayout="columns"] .vset,.brgw-sec--home-about[data-vlayout="list"] .vset{display:block;}
.brgw-sec--home-about[data-vlayout="columns"] .wheel,.brgw-sec--home-about[data-vlayout="list"] .wheel{display:none;}
.brgw-sec--home-about{--v-tone-fg:var(--ink);--v-tone-bg:#fff;--v-fg:var(--ink);--v-bg:#fff;--v-blend:normal;--v-filter:none;--v-scrim:0;}
.brgw-sec--home-about[data-vtone="dark"]{--v-tone-fg:#fff;--v-tone-bg:#000;--v-fg:#fff;--v-bg:#000;}
.brgw-sec--home-about[data-vtone="dark"] .values-blk{background:#000;color:#fff;border-top-color:rgba(255,255,255,.2);}
.brgw-sec--home-about[data-vtone="dark"] .wheel::before{border-color:rgba(255,255,255,.4);}
.brgw-sec--home-about[data-vtone="dark"] .core{border-color:#fff;}
.brgw-sec--home-about[data-vtone="light"][data-vil="normal"],.brgw-sec--home-about[data-vtone="dark"][data-vid="normal"]{--v-fg:#fff;--v-bg:var(--ink);--v-scrim:.55;}
.brgw-sec--home-about[data-vtone="light"][data-vil="bw"],.brgw-sec--home-about[data-vtone="dark"][data-vid="bw"]{--v-fg:#fff;--v-bg:var(--ink);--v-scrim:.55;--v-filter:grayscale(1);}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"]{--v-blend:multiply;--v-base:#c9c9c9;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vsb="white"]{--v-base:#fff;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vsb="light"]{--v-base:#e4e4e4;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vsb="slate"]{--v-base:#a8a8a8;}
.brgw-sec--home-about[data-vtone="dark"][data-vid="soft"]{--v-blend:screen;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vila="10"]{--v-imgop:.1;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vila="20"]{--v-imgop:.2;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vila="30"]{--v-imgop:.3;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vila="40"]{--v-imgop:.4;}
.brgw-sec--home-about[data-vtone="light"][data-vil="soft"][data-vila="60"]{--v-imgop:.6;}
.brgw-sec--home-about[data-vtone="dark"][data-vid="soft"][data-vida="10"]{--v-imgop:.1;}
.brgw-sec--home-about[data-vtone="dark"][data-vid="soft"][data-vida="20"]{--v-imgop:.2;}
.brgw-sec--home-about[data-vtone="dark"][data-vid="soft"][data-vida="30"]{--v-imgop:.3;}
.brgw-sec--home-about[data-vtone="dark"][data-vid="soft"][data-vida="40"]{--v-imgop:.4;}

.brgw-sec--home-about .vi{position:relative;isolation:isolate;overflow:hidden;opacity:.6;background:var(--v-base,var(--v-bg));color:var(--v-fg);
  transition:opacity .35s ease;}
.brgw-sec--home-about .vi.is-on{opacity:1;}
.brgw-sec--home-about .values-blk{container:vb / inline-size;}
.brgw-sec--home-about .vset{max-width:1320px;margin-inline:auto;text-align:left;}
.brgw-sec--home-about .vbg{position:absolute;inset:0;z-index:0;}
/* A photo shows ONLY on the open item: it fades in and settles from a slight zoom. The fade is on
   the <img> itself, not on .vbg, because an opacity or transform on .vbg would wall the blend
   mode off from the column color behind it and multiply/screen would do nothing. */
.brgw-sec--home-about .vbg img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:var(--v-blend);
  opacity:0;transform:scale(1.1);filter:var(--v-filter);
  transition:opacity .25s ease,transform .25s ease;}
.brgw-sec--home-about .vi.is-on .vbg img{opacity:var(--v-imgop,1);transform:none;
  transition:opacity .8s ease .1s,transform 1.4s cubic-bezier(.2,.8,.2,1) .1s;}
.brgw-sec--home-about .vbg::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s ease;
  background:linear-gradient(to top,rgba(0,0,0,var(--v-scrim)),rgba(0,0,0,0) 70%);}
.brgw-sec--home-about .vi.is-on .vbg::after{opacity:1;transition:opacity .8s ease .1s;}
/* Split text: words are wrapped by the script and rise in one after another, but only once the
   column has finished widening (.is-set), so no line ever re-breaks while words are moving. */
.brgw-sec--home-about .vp .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em;}
.brgw-sec--home-about .vp .wi{display:inline-block;transform:translateY(115%);opacity:0;transition:opacity .15s ease;}
.brgw-sec--home-about .vi.is-set .vp .wi{transform:none;opacity:1;
  transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s ease;transition-delay:calc(var(--i,0) * 28ms);}
.brgw-sec--home-about .vn{position:relative;z-index:1;display:block;width:100%;border:0;background:none;color:inherit;font:inherit;
  cursor:pointer;text-align:left;text-transform:uppercase;font-family:'Blanco Cavelary','Montserrat',cursive;font-weight:400;font-size:clamp(1.05rem,1.6vw,1.4rem);padding:18px 16px 18px 52px;}
.brgw-sec--home-about .vn::before{content:attr(data-no);position:absolute;left:16px;top:21px;
  font-family:'Montserrat',system-ui,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.18em;opacity:.8;}
.brgw-sec--home-about .vn:focus-visible{outline:2px solid currentColor;outline-offset:-4px;}
.brgw-sec--home-about .vp{position:relative;z-index:1;margin:0;max-height:0;overflow:hidden;padding:0 16px 0 52px;
  font-size:clamp(.92rem,1.05vw,1rem);line-height:1.55;transition:max-height .45s ease;}
.brgw-sec--home-about .vi.is-on .vp{max-height:16em;padding-bottom:20px;}
.brgw-sec--home-about .vi + .vi{border-top:1px solid rgba(128,128,128,.4);}
.brgw-sec--home-about .vx{display:contents;}
@container vb (min-width:720px){
  .brgw-sec--home-about[data-vlayout="columns"] .vset{display:flex;height:clamp(420px,44vw,620px);}
  .brgw-sec--home-about[data-vlayout="columns"] .vset{container-type:inline-size;}
  .brgw-sec--home-about[data-vlayout="columns"] .vi{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;
    transition:flex-grow .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease;}
  .brgw-sec--home-about[data-vlayout="columns"] .vi + .vi{border-top:0;box-shadow:inset 1px 0 0 rgba(128,128,128,.4);}
  .brgw-sec--home-about[data-vlayout="columns"] .vi.is-on{flex-grow:3.4;}
  .brgw-sec--home-about[data-vlayout="columns"] .vx{display:block;position:absolute;inset:0;pointer-events:none;}
  /* the number sits at the top of the column and the name right under it; the description stays at
     the foot. The name is as wide as a CLOSED column (one share out of 3.4 + 4 = 7.4, less the side
     padding), so a name that wraps to two lines closed wraps the same way when its column opens. */
  .brgw-sec--home-about[data-vlayout="columns"] .vn{position:static;box-sizing:content-box;
    width:calc(min(100vw,1320px) / 7.4 - 2 * var(--v-pad));
    width:calc(100cqw / 7.4 - 2 * var(--v-pad));
    padding:calc(var(--v-pad) + 26px) var(--v-pad) 0;font-size:clamp(.72rem,1.5vw,1.45rem);line-height:1.15;overflow-wrap:normal;}
  .brgw-sec--home-about[data-vlayout="columns"] .vn::before{left:var(--v-pad);top:var(--v-pad);}
  .brgw-sec--home-about[data-vlayout="columns"] .vp{position:absolute;left:var(--v-pad);bottom:var(--v-pad);box-sizing:content-box;max-height:none;overflow:visible;padding:0;
    width:calc(100cqw * 3.4 / 7.4 - 2 * var(--v-pad));opacity:0;}
  .brgw-sec--home-about[data-vlayout="columns"] .vi.is-on .vp{opacity:1;padding-bottom:0;}
  .brgw-sec--home-about[data-vlayout="list"] .vset{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);
    grid-template-rows:repeat(var(--n,5),auto);column-gap:clamp(32px,5vw,80px);align-items:start;}
  .brgw-sec--home-about[data-vlayout="list"] .vi{display:contents;opacity:1;}
  .brgw-sec--home-about[data-vlayout="list"] .vi + .vi{border-top:0;}
  .brgw-sec--home-about[data-vlayout="list"] .vn{grid-column:1;color:var(--v-tone-fg);opacity:.4;transition:opacity .3s ease;
    font-size:clamp(1.5rem,3vw,2.7rem);padding:18px 0 18px 3.2em;border-top:1px solid rgba(128,128,128,.4);}
  .brgw-sec--home-about[data-vlayout="list"] .vn::before{left:0;top:calc(18px + .55em);}
  .brgw-sec--home-about[data-vlayout="list"] .vi.is-on .vn{opacity:1;}
  .brgw-sec--home-about[data-vlayout="list"] .vx{display:block;grid-column:2;grid-row:1 / span var(--n,5);position:relative;opacity:0;visibility:hidden;
    transition:opacity .35s ease;color:var(--v-tone-fg);background:var(--v-tone-bg);isolation:isolate;}
  .brgw-sec--home-about[data-vlayout="list"] .vi.is-on .vx{opacity:1;visibility:visible;}
  .brgw-sec--home-about[data-vlayout="list"] .vbg{position:relative;inset:auto;aspect-ratio:4 / 3;background:var(--v-base,rgba(128,128,128,.18));}
  .brgw-sec--home-about[data-vlayout="list"] .vbg::after{display:none;}
  .brgw-sec--home-about[data-vlayout="list"] .vp{max-height:none;overflow:visible;padding:20px 0 0;color:var(--v-tone-fg);font-size:clamp(1rem,1.2vw,1.15rem);}
}
@media (prefers-reduced-motion:reduce){
  .brgw-sec--home-about .vi,.brgw-sec--home-about .vp,.brgw-sec--home-about .vx{transition:none!important;}
}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <div class="grid">
    <div class="shot brgw-img" data-brgw-img>
      <img src="{{photo}}"
           alt="Friends walking the Oceanside pier at golden hour" width="1600" height="1067"
           decoding="async" loading="lazy" data-tone="{{photo_tone}}" data-px="{{photo_px}}" data-px-dir="{{photo_px_dir}}" data-float="{{photo_float}}" data-float-dir="{{photo_float_dir}}">
    </div>
    <div class="body">
      <h2 class="blanco anim-head">{{heading}} <span class="mark" data-mark="{{heading_mark}}"><svg class="hl-b" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"><path d="M5,6 C62,3 140,5 210,3 C228,2 236,4 236,9 C237,20 235,31 234,38 C233,42 226,43 208,42 C138,40 64,42 10,41 C5,41 3,38 3,31 C2,22 2,12 5,6 Z"/></svg><span class="hl-t">{{heading_mark}}</span></span></h2>
  <div class="brgw-cta" data-cta-at="head" data-btn-color="{{btn_color}}" data-btn-hover="{{btn_hover}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-hover="{{buttons.hover}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
      <div class="mv">
        <div class="pair">
          <span class="lbl anim-up">{{vision_label}}</span>
          <div class="big blanco anim-up">{{vision_text}}</div>
        </div>
        <div class="pair">
          <span class="lbl anim-up">{{mission_label}}</span>
          <div class="big blanco anim-up">{{mission_text}}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="values-blk" aria-label="Our core values">
    <h3 class="vh blanco anim-up">{{values_heading}}</h3>
    <div class="wheel anim-up" data-wheel>
      <div class="ring">
      <!--brg:repeat values-->
      <button type="button" class="vl blanco">{{values.label}}</button>
      <!--brg:empty-->
      <button type="button" class="vl blanco">Leadership</button>
      <button type="button" class="vl blanco">Culture</button>
      <button type="button" class="vl blanco">Advocate</button>
      <button type="button" class="vl blanco">Stay Stoked</button>
      <button type="button" class="vl blanco">Community</button>
      <!--/brg:repeat-->
      </div>
      <div class="core" aria-live="polite">
      <!--brg:repeat values-->
