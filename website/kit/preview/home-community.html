<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Home — born in San Diego — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: home-community  →  [brg_home-community]
     Matches website/mocks/brg_home-community.
     Owns the yellow BOLT seam badge that straddles its top edge — per the cross-section
     bleed rule (notes/controller.md): the element lives in the LOWER section and bleeds
     UPWARD, because later shells paint on top. Nothing here bleeds downward. -->
<section class="brgw-sec brgw-sec--home-community reveal" data-nav="dark" data-hl="{{hl_variant}}" aria-label="Born in San Diego">
<style>
.brgw-sec--home-community{position:relative;background:#000;overflow:visible;
  padding:clamp(84px,9vw,132px) var(--pad) clamp(76px,8vw,120px);}
.brgw-sec--home-community > *{position:relative;z-index:2;}

.brgw-sec--home-community .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--home-community .seam img{width:100%;height:auto;display:block;}

.brgw-sec--home-community .grid{display:grid;grid-template-columns:1fr;gap:clamp(40px,5vw,72px);
  max-width:1500px;margin-inline:auto;align-items:start;}
@media(min-width:940px){ .brgw-sec--home-community .grid{grid-template-columns:1fr 1fr;gap:clamp(48px,6vw,110px);} }

.brgw-sec--home-community h2{font-size:clamp(1.75rem,3.5vw,3rem);text-transform:uppercase;
  margin-bottom:clamp(26px,3vw,42px);}
/* Teal marker block on the second line, rotated as in the comp. */
/* Look is unchanged; it now travels as variables the shared highlight system reads.
   --brgw-hl-rot is 0deg because THIS element already rotates — letting the h3 block
   add its own -1.4deg on top would compound into a visible skew. */
.brgw-sec--home-community h2 .mark{--brgw-hl-c:var(--teal);--brgw-hl-pad:.03em .22em;--brgw-hl-rot:0deg;
  display:inline-block;transform:rotate(-1.8deg);}
.brgw-sec--home-community p{opacity:.9;font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.62;max-width:46ch;}
.brgw-sec--home-community p + p{margin-top:1.25em;}
.brgw-sec--home-community strong{font-weight:700;opacity:1;}

/* Media composition: two overlapping photographs (the comp draws them as flat color
   blocks, but they are image slots). Each gets the reveal + its own parallax rate, and
   the rates have OPPOSITE signs so the two plates separate as you scroll rather than
   sliding together — that counter-movement is what reads as depth. */
/* THE CLUSTER IS MEANT TO HANG OUT, so this .media must not clip.
   The shared rule in brgw.css — .brgw .media{overflow:hidden} — exists to crop the photos
   inside a media box, and it was also cutting the BRG smiley: .cluster below is positioned
   right:-2% bottom:-7%, i.e. deliberately OUTSIDE its parent, so a clipping parent removes
   exactly the part that was the point of it. Sean reported the icon cropped twice.
   SAFE TO OPEN because the photos do not depend on this element to crop them — both
   children carry .brgw-img, which brings its own overflow:hidden. The clipping that
   matters stays exactly where it was; only the decoration is released. */
.brgw-sec--home-community .media{position:relative;aspect-ratio:4/3.35;min-height:260px;
  overflow:visible;}
.brgw-sec--home-community .media .plate{position:absolute;left:0;bottom:0;width:86%;height:82%;}
.brgw-sec--home-community .media .block{position:absolute;right:0;top:0;width:46%;height:44%;
  background:var(--yellow);}
.brgw-sec--home-community .media .block img{filter:contrast(1.04);}
/* THE BIG OUTLINE SMILEY, top left, bleeding up over the section above. It is in the comp
   and the artwork has been in the repo since August as icn-smile-line-xl-wht.svg,
   referenced by nothing — which is why it was missing rather than wrong.
   A PLACED MARK, not a background: it belongs at one spot rather than tiling, so it is an
   element. It sits above the section-background layer and below the copy. The section is
   already overflow:visible for the seam badge, which is what lets it hang over the
   boundary the way the comp draws it. */
.brgw-sec--home-community .smiley{position:absolute;top:-5%;left:-3%;z-index:1;
  width:clamp(150px,21vw,330px);opacity:.1;pointer-events:none;}  /* 10%: the SVGs are solid white, no baked-in alpha */
.brgw-sec--home-community .smiley img{width:100%;height:auto;display:block;}
@media(max-width:700px){ .brgw-sec--home-community .smiley{width:140px;top:-2%;} }

/* Doodle cluster, bottom-right, overlapping the media as in the comp. */
.brgw-sec--home-community .cluster{position:absolute;right:-2%;bottom:-7%;width:clamp(120px,15vw,215px);z-index:3;}
.brgw-sec--home-community .cluster img{width:100%;height:auto;display:block;}

@media(max-width:560px){ .brgw-sec--home-community .cluster{width:110px;right:0;bottom:-4%;} }
</style>
  <span class="smiley" aria-hidden="true"><img src="https://blacktoprestaurantgroup.com/wp-content/uploads/2026/08/icn-smile-line-xl-wht.svg" alt="" width="520" height="520" loading="lazy" decoding="async"></span>
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <span class="seam" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/div-icn-bolt.svg" alt="" width="151" height="145" loading="lazy" decoding="async"></span>

  <div class="grid">
    <div>
      <h2 class="blanco anim-head">Born in San Diego.<br>Built <span class="mark"><svg class="hl-b" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"><path d="M5,6 C62,3 140,5 210,3 C228,2 236,4 236,9 C237,20 235,31 234,38 C233,42 226,43 208,42 C138,40 64,42 10,41 C5,41 3,38 3,31 C2,22 2,12 5,6 Z"/></svg><span class="hl-t">for community.</span></span></h2>
      <p class="anim-up">{{intro_1}} <strong>{{intro_emphasis}}</strong> {{intro_2}}</p>
      <p class="anim-up">{{body_1}}</p>
      <p class="anim-up">{{body_2}}</p>
    </div>
    <div class="media anim-up">
      <div class="plate brgw-img" data-brgw-img>
        <img src="{{photo_1}}" alt=""
             width="733" height="1100" decoding="async" loading="lazy" data-tone="{{photo_1_tone}}" data-px="{{photo_1_px}}" data-px-dir="{{photo_1_px_dir}}" data-float="{{photo_1_float}}" data-float-dir="{{photo_1_float_dir}}">
      </div>
      <div class="block brgw-img" data-brgw-img>
        <img src="{{photo_2}}" alt=""
             width="548" height="820" decoding="async" loading="lazy" data-tone="{{photo_2_tone}}" data-px="{{photo_2_px}}" data-px-dir="{{photo_2_px_dir}}" data-float="{{photo_2_float}}" data-float-dir="{{photo_2_float_dir}}">
      </div>
      <span class="cluster" aria-hidden="true"><img class="brgw-pop" src="https://blacktoprg.netlify.app/assets/media/icons/icn-clust-all-trim.svg" alt="" width="302" height="310" loading="lazy" decoding="async"></span>
    </div>
  </div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"intro_1": "Blacktop Restaurant Group started with a simple belief:", "intro_emphasis": "that a great meal is really just an excuse to connect.", "intro_2": "Since 2013, we've been growing a family of restaurant brands rooted in genuine hospitality, craft food, and a deep love for the communities we call home.", "body_1": "We're not a corporation chasing locations \u2014 we're operators who eat at our own restaurants, know our guests by name, and measure success by how many times someone walks out the door smiling.", "body_2": "Today, BRG operates 12 Board & Brew locations across San Diego and Orange County, plus Odie's Pizza Co. in Oceanside \u2014 and we're just getting started.", "hl_variant": "h3", "photo_1": "https://blacktoprg.netlify.app/assets/media/bg/skater.webp", "photo_1_tone": "color", "photo_1_px": "0", "photo_1_px_dir": "down", "photo_1_float": "0", "photo_1_float_dir": "down", "photo_2": "https://blacktoprg.netlify.app/assets/media/bg/surfer.webp", "photo_2_tone": "color", "photo_2_px": "0", "photo_2_px_dir": "down", "photo_2_float": "0", "photo_2_float_dir": "down", "section_bg": "https://blacktoprg.netlify.app/assets/media/bkgnds/brg-pattern-gry.webp", "section_bg_mobile": "", "section_bg_opacity": "0.14", "section_bg_px": "0", "section_bg_px_dir": "down"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
