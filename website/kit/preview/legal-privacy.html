<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: legal-privacy / legal-cookies / legal-accessibility  →  [brg_legal-privacy] etc.
     ONE TEMPLATE, THREE COPIES. The three files are identical on purpose (the plugin fills a
     section by its id, so each page needs its own); only slots.json differs, in its words.
     Sean, 19 Nov: black page, white words, the policy's title top left with the hand-drawn
     underline; an anchor menu down the left; sections that open as you reach them; a light
     version; the brand marks floating in a gutter that never holds text.
     THE WORDS ARE ONE BOX. {{content}} is a single rich-text field; brgwLegal() (brgw.js) cuts
     it into sections at every Heading 2, builds the menu from them, and turns each into an
     open/close row. With no script the box is simply the whole policy, all open. All the look
     lives in brgw.css under .brgw-sec--legal. -->
<section class="brgw-sec brgw-sec--legal reveal" data-legal data-look="{{look}}" data-nav="{{look}}" data-read="{{reading}}" data-num="{{numbers}}" data-icons="{{icons}}" data-uline-c="{{uline_color}}" aria-label="{{heading}}">
  <div class="lg-wrap">
    <header class="lg-head">
      <span class="lg-title"><h1 class="blanco anim-head">{{heading}}</h1><img class="uline" aria-hidden="true" alt="" width="845" height="28" src="https://blacktoprg.netlify.app/assets/media/lines/line-{{uline_color}}-lg.svg"></span>
      <p class="lg-sub anim-up">{{sub}}</p>
      <p class="lg-upd anim-up">{{updated}}</p>
    </header>
    <div class="lg-body">
      <nav class="lg-toc" aria-label="On this page"></nav>
      <div class="lg-main"><div class="lg-src lg-prose">{{content}}</div></div>
      <div class="lg-gut" aria-hidden="true" data-px="{{icons_px}}">
        <span class="lg-ico" data-i="1"><img src="{{icon_1_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
        <span class="lg-ico" data-i="2"><img src="{{icon_2_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
        <span class="lg-ico" data-i="3"><img src="{{icon_3_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
      </div>
    </div>
  </div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Privacy Policy", "updated": "Last updated: November 19, 2026", "sub": "How Blacktop Restaurant Group collects, uses and protects information on this website, in plain language.", "content": "<p>Blacktop Restaurant Group (\"Blacktop,\" \"we,\" \"us\") runs this website, blacktoprestaurantgroup.com, to tell people about our restaurants, our team, our community work and our careers. This policy explains what information we collect when you use it, what we do with it, and the choices you have.</p>\n<h2>The short version</h2>\n<ul><li>We don't ask you to create an account, and the site has no checkout or sign-up forms.</li>\n<li>We collect only what you choose to send us (for example, an email), plus basic visit statistics from analytics, and only analytics if you allow it.</li>\n<li>We don't sell your personal information.</li>\n<li>You can ask us what we hold about you, or to delete it, any time.</li></ul>\n<h2>What we collect</h2>\n<p><strong>What you send us.</strong> When you email us, apply for a job or ask about a partnership, we receive the details you include: usually your name, email address, any phone number, and whatever you write or attach.</p>\n<p><strong>Visit information.</strong> Like most websites, our servers and our analytics record technical details about a visit: your approximate location (city level), the pages you view, when and for how long, the site you came from, and your browser, device and operating system. We use this to understand which pages are useful and to keep the site working.</p>\n<p><strong>Cookies and similar tools.</strong> Some of this is gathered with cookies. What each one does, and how to say no, is in our <a href=\"/cookie-policy/\">Cookie Policy</a>.</p>\n<h2>How we use it</h2>\n<ul><li>To answer you: replying to messages, press, partnership and job inquiries.</li>\n<li>To consider job applications and, if you apply, to contact you about the role.</li>\n<li>To measure and improve the site: what people read, what is slow, what is broken.</li>\n<li>To keep the site secure and prevent misuse.</li>\n<li>To meet legal obligations.</li></ul>\n<p>We do not use your information to make automated decisions about you, and we do not sell it.</p>\n<h2>Who we share it with</h2>\n<p>We share information only with companies that help us run the site, and only as needed for that:</p>\n<ul><li><strong>Analytics:</strong> Google (Google Analytics), if you accept analytics cookies.</li>\n<li><strong>Hosting, delivery and security:</strong> our web host and the services that deliver and protect the site and its files (including Cloudflare, Netlify and jsDelivr). They see technical request data such as your IP address.</li>\n<li><strong>Video:</strong> if a page plays a YouTube or Vimeo video, that provider may set its own cookies when you press play.</li>\n<li><strong>Site feedback tool:</strong> while the site is being built, a feedback tool (BugHerd) lets our team leave notes on pages.</li></ul>\n<p>We may also disclose information when the law requires it, or to protect our rights, our guests or our team. If the company is ever sold or merged, information may transfer to the new owner under the same protections.</p>\n<h2>How long we keep it</h2>\n<p>Messages and applications are kept as long as we need them to deal with your request, and for job applications for a reasonable period afterward in case another role opens up, then deleted. Analytics data is kept for the period set in our analytics account. You can ask us to delete your information sooner.</p>\n<h2>Your choices and rights</h2>\n<p>You can change your cookie choices at any time from the cookie settings on this site, or in your browser. If you live in California, you have the right to:</p>\n<ul><li>know what personal information we collect, use and disclose about you;</li>\n<li>ask us to delete the personal information we hold about you;</li>\n<li>ask us to correct information that is wrong;</li>\n<li>opt out of the sale or sharing of your personal information (we do not sell it, and we do not share it for advertising);</li>\n<li>be treated the same whether or not you use these rights.</li></ul>\n<p>To use any of these, write to us through our <a href=\"/contact/\">Contact page</a> and tell us what you would like. We may need to confirm it is you before we act.</p>\n<h2>Children</h2>\n<p>This website is for a general audience and is not directed at children under 13. We do not knowingly collect personal information from children. If you believe a child has sent us information, tell us and we will delete it.</p>\n<h2>Security</h2>\n<p>The site is served over an encrypted connection (HTTPS) and we limit who can see messages sent to us. No method of transmission or storage is completely secure, so we can't promise absolute security.</p>\n<h2>Other websites</h2>\n<p>We link to restaurant sites, social networks and other places we don't run. Their privacy practices are their own, so please read their policies.</p>\n<h2>Changes to this policy</h2>\n<p>We will update this page when our practices change and change the \"last updated\" date at the top. If a change is significant, we will say so on the site.</p>\n<h2>Contact us</h2>\n<p>Questions about this policy or your information? Reach us through the <a href=\"/contact/\">Contact page</a>. Blacktop Restaurant Group, San Diego, California.</p>", "look": "dark", "uline_color": "home", "numbers": "1", "reading": "follow", "icons": "1", "icons_px": "16", "icon_1_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-brg-yel.svg", "icon_2_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg", "icon_3_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-smile-yel.svg"};
  var raw = document.getElementById('frag').innerHTML;
  // A repeater with no saved rows shows its brg:empty set (the defaults), exactly as the plugin does;
  // without this the raw template row, with its {{row.tokens}} unfilled, showed beside the defaults.
  raw = raw.replace(/<!--brg:repeat [a-z0-9_-]+-->([\s\S]*?)<!--\/brg:repeat-->/gi, function(m, inner){
    var i = inner.indexOf('<!--brg:empty-->'); return i < 0 ? '' : inner.slice(i + 16);
  });
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
