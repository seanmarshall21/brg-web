<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Team — join the crew — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: team-apply  →  [brg_team-apply]
     Teal band. Doodle cluster bleeds off the bottom-right corner as in the comp.
     ACF-editable (slots.json beside this file): heading, sub copy, CTA label + href. The
     <h2> IS wired here, unlike careers-apply's — it has no structural <br> and no inline
     span, so it free-wraps inside max-width:20ch and substituted copy behaves like
     authored copy. The cluster is decorative and stays as code. -->
<section class="brgw-sec brgw-sec--team-apply reveal" data-nav="light" aria-label="Join the team" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--team-apply{position:relative;background:var(--teal);color:var(--ink);overflow:hidden;
  text-align:center;padding:clamp(56px,6.4vw,88px) var(--pad);}
.brgw-sec--team-apply h2{font-size:clamp(1.8rem,4.2vw,3.5rem);text-transform:uppercase;max-width:20ch;margin:0 auto;}
.brgw-sec--team-apply .sub{max-width:60ch;margin:clamp(18px,2.2vw,28px) auto 0;
  font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.6;}
.brgw-sec--team-apply .btn{margin-top:clamp(26px,3vw,40px);}
.brgw-sec--team-apply .cluster{position:absolute;right:2%;bottom:-24%;width:clamp(130px,15vw,230px);
  z-index:2;pointer-events:none;}
.brgw-sec--team-apply .cluster img{width:100%;height:auto;display:block;}
@media(max-width:760px){ .brgw-sec--team-apply .cluster{display:none;} }
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <h2 class="blanco anim-head" data-head="words">{{heading}}</h2>
  <p class="sub anim-up">{{sub}}</p>
  <a class="btn anim-cta" data-btn-size="{{btn_size}}" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" href="{{cta_href}}">{{cta_label}}</a>
  <span class="cluster" aria-hidden="true" data-mark-pos="{{mark_1_all_trim_pos}}" data-mark-show="{{mark_1_all_trim_show}}" data-mark-anim="{{mark_1_all_trim_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_all_trim_opacity}}"><img class="brgw-pop" src="{{mark_1_all_trim_art}}" alt="" width="302" height="310" loading="lazy" decoding="async"></span>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"cta_label": "Apply Today", "cta_href": "/careers/", "heading": "Want to be part of the team?", "sub": "We're always looking for people who lead with heart, stay stoked under pressure, and believe a great guest experience starts with a great team experience.", "section_bg": "", "section_bg_opacity": "0.18", "section_bg_px": "0", "section_bg_px_dir": "down", "section_bg_mobile": "", "mark_1_all_trim_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-clust-all-trim.svg", "mark_1_all_trim_pos": "tr", "mark_1_all_trim_opacity": "100", "mark_1_all_trim_show": "1", "mark_1_all_trim_anim": "keep", "cta_position": "foot", "btn_size": "", "btn_color": "dark", "btn_style": "keep", "btn_effect": "lift", "buttons": "", "modal_bg": "white"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
