<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Community — hero — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: community-hero  →  [brg_community-hero] -->
<section class="brgw-sec brgw-sec--community-hero brgw-hero reveal" data-uline="{{uline_variant}}" aria-label="Community">
<style>
.brgw-sec--community-hero{overflow:hidden;}
/* Underline is now Sean's line-community-lg.svg; its colour is baked into the path fill,
   so the old `color:var(--orange)` is gone rather than left as a rule that does nothing.
   Geometry matches the blob it replaces; the reveal is the shared system in brgw.css. */
/* Width is the ARTWORK'S OWN LENGTH at home-hero's scale, not a shared number.
   line-community-lg.svg is 841 units and home renders its 845 at 640px, so 841x0.757
   = 640px keeps this stroke the same WEIGHT as home's. A flat width for every hero
   would thin the wide sources and fatten the narrow ones, because height is auto and
   the aspect ratio differs per drawing. The 62% keeps it responsive on narrow screens.
   (Was min(340px,62%) — inherited from the CSS blob this replaced, which was a small
   decorative bar; on a ~1100px headline it read as far too short.) */
.brgw-sec--community-hero .uline{display:block;width:min(640px,62%);margin:16px auto 0;height:auto;}
</style>
  <h1 class="blanco anim-head" data-head="words">{{heading}}</h1>
  <img class="uline anim-up" aria-hidden="true" alt="" width="841" height="28"
       src="https://blacktoprg.netlify.app/assets/media/lines/line-community-lg.svg">
  <p class="sub anim-up">{{sub}}</p>
  <span class="brgw-doodle" style="top:var(--brgw-doodle-top);left:9%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg" alt="" width="129" height="207"></span>
  <span class="brgw-doodle brgw-doodle--c" style="bottom:var(--brgw-doodle-bottom);right:8%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-circle-wht.svg" alt="" width="122" height="118"></span>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Great food, great people, epic communities.", "sub": "We're not just in these neighborhoods \u2014 we're part of them. From local sponsorships to giveback programs, showing up for our communities is just how we operate.", "uline_variant": "u3"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
