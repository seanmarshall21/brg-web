<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal — cookie policy — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: legal-privacy / legal-cookies / legal-accessibility  →  [brg_legal-privacy] etc.
     ONE TEMPLATE, THREE COPIES. The three files are identical on purpose (the plugin fills a
     section by its id, so each page needs its own); only slots.json differs, in its words.
     Sean, 19 Nov: black page, white words, the policy's title top left with the hand-drawn
     underline; an anchor menu down the left; sections that open as you reach them; a light
     version; the brand marks floating in a gutter that never holds text.
     THE WORDS ARE ONE BOX. {{content}} is a single rich-text field; brgwLegal() (brgw.js) cuts
     it into sections at every Heading 2, builds the menu from them, and turns each into an
     open/close row. With no script the box is simply the whole policy, all open. All the look
     lives in brgw.css under .brgw-sec--legal. -->
<section class="brgw-sec brgw-sec--legal reveal" data-legal data-look="{{look}}" data-nav="{{look}}" data-read="{{reading}}" data-num="{{numbers}}" data-icons="{{icons}}" data-uline-c="{{uline_color}}" aria-label="{{heading}}">
  <div class="lg-wrap">
    <header class="lg-head">
      <span class="lg-title"><h1 class="blanco anim-head">{{heading}}</h1><img class="uline" aria-hidden="true" alt="" width="845" height="28" src="https://blacktoprg.netlify.app/assets/media/lines/line-{{uline_color}}-lg.svg"></span>
      <p class="lg-sub anim-up">{{sub}}</p>
      <p class="lg-upd anim-up">{{updated}}</p>
    </header>
    <div class="lg-body">
      <nav class="lg-toc" aria-label="On this page"></nav>
      <div class="lg-main"><div class="lg-src lg-prose">{{content}}</div></div>
      <div class="lg-gut" aria-hidden="true" data-px="{{icons_px}}">
        <span class="lg-ico" data-i="1"><img src="{{icon_1_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
        <span class="lg-ico" data-i="2"><img src="{{icon_2_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
        <span class="lg-ico" data-i="3"><img src="{{icon_3_art}}" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
      </div>
    </div>
  </div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Cookie Policy", "updated": "Last updated: November 19, 2026", "sub": "What cookies and similar tools this site uses, why, and how to turn them off.", "content": "<p>This page explains what cookies and similar tools this website uses, why, and how to turn them off. For how we handle personal information in general, see our <a href=\"/privacy-policy/\">Privacy Policy</a>.</p>\n<h2>What cookies are</h2>\n<p>A cookie is a small text file a website saves in your browser. Some are needed for the site to work, some remember your choices, and some tell us how the site is used. \"Similar tools\" means things like your browser's local and session storage, which work the same way.</p>\n<h2>Your choice</h2>\n<p>When you first visit, a banner asks whether you accept cookies. The strictly necessary ones are always on. The rest are off until you accept, and you can change your mind at any time from the cookie settings on this site. You can also block or delete cookies in your browser; the site still works, though some things may be less smooth.</p>\n<h2>Strictly necessary</h2>\n<p>These keep the site working and remember your cookie choice. They don't track you across other sites, and they can't be switched off here.</p>\n<ul><li><strong>Cookie consent preferences</strong> \u2014 remembers what you chose in the banner. Kept for about 30 days.</li>\n<li><strong>Site display settings</strong> \u2014 the site uses your browser's session and local storage to remember which loading animation it showed last, so it doesn't repeat. This holds no personal information and never leaves your browser.</li>\n<li><strong>Login cookies</strong> \u2014 set only for our team when they sign in to edit the site. Visitors don't get them.</li></ul>\n<h2>Analytics</h2>\n<p>With your permission, we use Google Analytics to count visits and see which pages are read, so we can improve the site. It sets cookies such as <strong>_ga</strong> and <strong>_ga_</strong> followed by an identifier, which last up to two years and tell visits apart without naming anyone. The information is sent to Google and stored on its servers. You can opt out through the banner, or by using Google's browser add-on at <a href=\"https://tools.google.com/dlpage/gaoptout\" rel=\"noopener\" target=\"_blank\">tools.google.com/dlpage/gaoptout</a>.</p>\n<h2>Embedded video and other services</h2>\n<p>Some pages may show a video from YouTube or Vimeo. We use privacy-friendly embed addresses where we can, but if you press play, the provider may set its own cookies. Their policies apply to those. The site's files are delivered through content networks (Cloudflare, Netlify and jsDelivr), which may log technical request details such as your IP address.</p>\n<h2>Site feedback tool</h2>\n<p>While the site is being built, our team uses a feedback tool (BugHerd) to leave notes on pages. It may set a cookie in your browser.</p>\n<h2>How to manage cookies</h2>\n<ul><li><strong>On this site:</strong> use the cookie settings link on the page to change what you've allowed.</li>\n<li><strong>In your browser:</strong> every major browser lets you see, block and delete cookies. Look for \"Privacy\" or \"Cookies\" in its settings.</li>\n<li><strong>Browser settings:</strong> many browsers can also send a \"Do Not Track\" or Global Privacy Control signal. Check your browser's privacy settings.</li></ul>\n<h2>Changes and contact</h2>\n<p>If we add or change a cookie, we will update this page and its date. Questions? Reach us through the <a href=\"/contact/\">Contact page</a>.</p>", "look": "dark", "uline_color": "restaurants", "numbers": "1", "reading": "follow", "icons": "1", "icons_px": "16", "icon_1_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-brg-yel.svg", "icon_2_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-bolt-fill-yel.svg", "icon_3_art": "https://blacktoprg.netlify.app/assets/media/icons/icn-misc-smile-yel.svg"};
  var raw = document.getElementById('frag').innerHTML;
  // A repeater with no saved rows shows its brg:empty set (the defaults), exactly as the plugin does;
  // without this the raw template row, with its {{row.tokens}} unfilled, showed beside the defaults.
  raw = raw.replace(/<!--brg:repeat [a-z0-9_-]+-->([\s\S]*?)<!--\/brg:repeat-->/gi, function(m, inner){
    var i = inner.indexOf('<!--brg:empty-->'); return i < 0 ? '' : inner.slice(i + 16);
  });
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
