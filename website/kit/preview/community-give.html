<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Community — how we give back — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: community-give  →  [brg_community-give]
     Matches the Community comp (mocks/BRG - Community.png, y 916–3456 @1x).
     Owns the yellow asterisk seam badge AND the teal "How we give back" banner, both of
     which straddle a boundary and therefore live here and bleed upward (bleed rule).

     Slides alternate side: odd slides put the copy panel left / image right, even slides
     reverse it — that alternation is the comp's rhythm, so it's driven by :nth-child
     rather than per-slide markup. Consumes the SHARED .brgw-slider engine in brgw.js
     (auto-advance, dots, swipe) — no second slider.

     ACF-editable (slots.json beside this file): the lede — as THREE slots around the inline
     <b>, so no field ever carries HTML — and the teal banner. The spaces either side of the
     <b> are in the markup on purpose: ACF trims on save, so a default ending in a space
     would lose it and the words would run together.

     THE SLIDES ARE NOW A REPEATER (conti 2026-09-23, Sean's request — finn owns this file,
     same arrangement as team-members). Sean could not change a slide photo or add a fourth
     slide because the three slides were hardcoded: nothing about them existed in wp-admin to
     edit. The count was never a design constant — the shared slider builds its own dots, and
     the panel colors come from :nth-child rather than the count — so any number works and
     adding one re-colors the rest on its own.

     The three slides below sit inside brg:empty, so they keep rendering until the first row
     is added. Without that half, wiring the repeater would take a section that shows three
     slides today to one that shows none the moment this lands — a live regression caused by
     shipping the mechanism.

     Per-row <img> carries no width/height: .shot img is absolutely positioned and object-fit
     cover, so the container sizes it and an uploaded photo of any dimensions cannot shift the
     layout. The button is hidden by :empty when no label is typed, so a row without one does
     not leave an empty yellow box. -->
<section data-sides="{{slide_sides}}" class="brgw-sec brgw-sec--community-give reveal" data-nav="light" aria-label="How we give back" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--community-give{position:relative;background:var(--white);color:var(--ink);overflow:visible;}
.brgw-sec--community-give .intro{padding:clamp(76px,8.4vw,120px) var(--pad) clamp(58px,6vw,86px);
  text-align:center;}
/* NO WORDS, NO BLOCK — not even its padding. */
.brgw-sec--community-give .intro[data-has-text=""]{display:none;}

/* THE TITLE SITS OVER THE SECTION ABOVE. Sean, 3 Oct: "the little blue title box should
   sit over the hero a little bit… the slider and the hero should touch edges." With the
   intro gone the slider now meets the hero directly, and the banner is lifted so it
   straddles that join rather than floating in a white band of its own. The lift is half
   the banner's own height, so it overlaps by the same amount whatever the type scales to.
   margin-bottom keeps pulling the slider up under it, as it already did. */
.brgw-sec--community-give .intro[data-has-text=""] + .banner{margin-top:-0.62em;}
.brgw-sec--community-give .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:6;}
.brgw-sec--community-give .seam img{width:100%;height:auto;display:block;}
.brgw-sec--community-give .lede{max-width:78ch;margin:0 auto;
  font-size:clamp(.98rem,1.15vw,1.1rem);line-height:1.65;opacity:.92;}
.brgw-sec--community-give .lede b{font-weight:400;font-size:1.14em;}

/* Teal banner straddles the white intro and the dark slider below it. */
.brgw-sec--community-give .banner{position:relative;z-index:5;display:block;width:max-content;
  max-width:92%;margin:0 auto -1.1em;background:var(--teal);color:var(--ink);
  font-size:clamp(1.4rem,3.4vw,3rem);text-transform:uppercase;padding:.08em .38em;
  transform:rotate(-1.4deg);}

.brgw-sec--community-give .brgw-slide{display:grid;grid-template-columns:1fr;min-height:clamp(360px,44vw,620px);}
@media(min-width:820px){ .brgw-sec--community-give .brgw-slide{grid-template-columns:1fr 1fr;} }
.brgw-sec--community-give .panel{display:flex;flex-direction:column;justify-content:center;
  padding:clamp(46px,5.4vw,86px) clamp(28px,4vw,74px);text-align:center;}
.brgw-sec--community-give .shot{position:relative;background:#5b5b5b;min-height:240px;}
.brgw-sec--community-give .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* WHICH SIDE THE WORDS SIT ON. The comp alternates — panel left, then right, then left —
   and that stays the default. Sean, 3 Oct, wanted the other option too: the text block
   staying on one side the whole way through, so the photo is always opposite it. The
   section carries data-sides and the slider follows it; nothing about the slides themselves
   changes, only the order of the two halves. */
@media(min-width:820px){
  .brgw-sec--community-give[data-sides="alternate"] .brgw-slide:nth-child(even) .panel{order:2;}
  .brgw-sec--community-give[data-sides="alternate"] .brgw-slide:nth-child(even) .shot{order:1;}
  .brgw-sec--community-give[data-sides="right"] .brgw-slide .panel{order:2;}
  .brgw-sec--community-give[data-sides="right"] .brgw-slide .shot{order:1;}
}
/* The panel colour still alternates whichever side it sits on — it is what stops a fixed
   side reading as one long slab — so these are not tied to data-sides. */
.brgw-sec--community-give .brgw-slide:nth-child(odd) .panel{background:#000;color:var(--white);}
.brgw-sec--community-give .brgw-slide:nth-child(even) .panel{background:var(--yellow);color:var(--ink);}
.brgw-sec--community-give h3{font-size:clamp(1.3rem,2.4vw,2rem);text-transform:uppercase;margin-bottom:18px;}
.brgw-sec--community-give .panel p{font-size:clamp(.94rem,1.05vw,1.02rem);line-height:1.62;
  max-width:44ch;margin-inline:auto;opacity:.9;}
/* A slide with no button label renders an EMPTY <a>, which would otherwise show as a bare
   yellow block. :empty hides it, so the button is genuinely optional per slide. */
.brgw-sec--community-give .btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  margin-top:clamp(18px,2vw,26px);}
/* An empty label means that button was not filled in, so it is not a button. */
.brgw-sec--community-give .btnrow .btn[data-cta=""]{display:none;}
.brgw-sec--community-give .panel .btn{margin-top:clamp(18px,2vw,26px);align-self:center;}
.brgw-sec--community-give .panel .btn:empty{display:none;}
.brgw-sec--community-give .brgw-slide:nth-child(odd) .panel .btn{background:var(--yellow);color:var(--ink);}
.brgw-sec--community-give .brgw-slide:nth-child(even) .panel .btn{background:var(--ink);color:var(--white);}
/* Dots sit over the image half, as in the comp, not on a separate bar. */
.brgw-sec--community-give .brgw-slider__dots{position:absolute;right:clamp(20px,3vw,54px);
  bottom:clamp(18px,2.4vw,38px);background:none;padding:0;z-index:4;}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <span class="seam" aria-hidden="true" data-mark-pos="{{mark_1_ast_pos}}" data-mark-show="{{mark_1_ast_show}}" data-mark-anim="{{mark_1_ast_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_ast_opacity}}"><img class="brgw-pop" src="{{mark_1_ast_art}}" alt="" width="150" height="146" loading="lazy" decoding="async"></span>

  <!-- data-has-text is the three lede slots concatenated. With all three cleared it is
       empty, and the rule below collapses the block entirely — padding included. Without
       it, emptying the intro left its 120px of padding behind as a white band between the
       hero and the slider, which is exactly what Sean reported. :empty cannot do this: the
       <p> is still a child even with no words in it. -->
  <div class="intro" data-has-text="{{lede_1}}{{lede_emphasis}}{{lede_2}}">
    <p class="lede anim-up">{{lede_1}} <b class="blanco">{{lede_emphasis}}</b> {{lede_2}}</p>
  </div>

  <span class="banner blanco anim-up">{{banner}}</span>

  <!-- The slider is DARK inside a light section. data-nav nests: brgw-nav.js takes the
       nearest labeled ancestor, so the header reads this rather than the section. -->
  <div class="brgw-slider" data-split="{{slide_split}}" data-nav="dark" data-autoplay="6500">
    <div class="brgw-slider__track">
<!--brg:repeat slides-->
      <div class="brgw-slide">
        <div class="panel">
          <h3 class="blanco">{{slides.title}}</h3>
          <p>{{slides.body}}</p>
          <!-- Up to two buttons per slide. A slide with one label fills one button and
               leaves the other hidden; a slide with neither shows no row at all. They
               cannot be a repeater: the plugin's brg:repeat grammar does not nest, and
               these already sit inside the slides repeater. -->
          <div class="btnrow">
            <a class="btn anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}"
               data-cta="{{slides.cta_label}}" href="{{slides.cta_href}}"
               data-brgw-modal="{{slides.cta_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{slides.cta_label}}</a>
            <a class="btn anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}"
               data-cta="{{slides.cta2_label}}" href="{{slides.cta2_href}}"
               data-brgw-modal="{{slides.cta2_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{slides.cta2_label}}</a>
          </div>
        </div>
        <div class="shot brgw-img media" data-brgw-img>
          <img src="{{slides.photo}}" alt="" decoding="async" loading="lazy" data-tone="{{slides.photo_tone}}" data-px="{{slides.photo_px}}" data-px-dir="{{slides.photo_px_dir}}" data-float="{{slides.photo_float}}" data-float-dir="{{slides.photo_float_dir}}">
          <div class="vid" data-vid="{{slides.video_id}}" data-src="{{slides.video_source}}" aria-hidden="true"></div>
        </div>
      </div>
<!--brg:empty-->
      <div class="brgw-slide">
        <div class="panel">
          <h3 class="blanco">Urban Surf 4 Kids</h3>
          <p>As our flagship give-back partner, Urban Surf 4 Kids provides foster youth and kids experiencing hardship out into the water with surf lessons. Together, we use the healing power of surf therapy to share confidence, connection, and pure local stoke.</p>
        </div>
        <div class="shot brgw-img" data-brgw-img>
          <img src="https://blacktoprg.netlify.app/assets/media/bg/surfer.webp" alt="" width="548" height="820"
               decoding="async" loading="lazy">
        </div>
      </div>
      <div class="brgw-slide">
        <div class="panel">
          <h3 class="blanco">Local partnerships</h3>
          <p>Schools, youth sports, neighborhood nonprofits &mdash; we show up where our guests already are, with food, sponsorship and hands on deck.</p>
        </div>
        <div class="shot brgw-img" data-brgw-img>
          <img src="https://blacktoprg.netlify.app/assets/media/bg/skater.webp" alt="" width="733" height="1100"
               decoding="async" loading="lazy">
        </div>
      </div>
      <div class="brgw-slide">
        <div class="panel">
          <h3 class="blanco">Community Fundraisers</h3>
          <p>From school dine-out events to youth team fundraisers, helping local groups raise money is a huge part of how we operate. We partner with neighborhood organizations across our shops to donate a portion of sales straight back into their programs, giving local causes a reliable place to hit their goals.</p>
        </div>
        <div class="shot brgw-img" data-brgw-img>
          <img src="https://blacktoprg.netlify.app/assets/media/bg/car.webp" alt="" width="492" height="760"
               decoding="async" loading="lazy">
        </div>
      </div>
<!--/brg:repeat-->
    </div>
    <div class="brgw-slider__dots"></div>
  </div>
  <div class="brgw-cta" data-cta-at="foot"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"lede_1": "At BRG, community isn't a marketing initiative \u2014", "lede_emphasis": "it's in our DNA.", "lede_2": "When our restaurants thrive, the people around us should feel that too. That means showing up at local events, supporting causes that matter, partnering with schools and nonprofits, and investing in the places our guests call home.", "banner": "How we give back", "slides": "", "section_bg": "", "section_bg_opacity": "0.18", "section_bg_px": "0", "section_bg_px_dir": "down", "section_bg_mobile": "", "mark_1_ast_art": "https://blacktoprg.netlify.app/assets/media/icons/div-icn-ast.svg", "mark_1_ast_pos": "keep", "mark_1_ast_opacity": "100", "mark_1_ast_show": "1", "mark_1_ast_anim": "keep", "btn_color": "keep", "btn_style": "keep", "btn_effect": "lift", "modal_bg": "white", "buttons": "", "cta_position": "foot", "slide_sides": "alternate", "slide_split": ""};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
