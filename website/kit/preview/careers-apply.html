<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers — what it's like — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: careers-apply  →  [brg_careers-apply]
     First LIGHT section: .brgw sets white text on dark, so this one re-grounds to ink.
     The yellow asterisk badge straddles the top edge (half above the section boundary),
     which is why the root is overflow:visible rather than hidden.
     ACF-editable (slots.json beside this file): the two body paragraphs, the right-column
     heading, and the CTA label + href. NOT the <h2> — it carries a structural <br> AND an
     inline <span class="mark">, neither of which any slot type can express. NOT the offer
     <ul> either: four is not a design constant here, so numbering the items would bake the
     row count in while looking editable. Both stay as code on purpose. -->
<section class="brgw-sec brgw-sec--careers-apply reveal" data-hl="{{hl_variant}}" aria-label="What it's like to work here">
<style>
.brgw-sec--careers-apply{position:relative;background:var(--white);color:var(--ink);
  padding:clamp(76px,10vw,120px) var(--pad) clamp(70px,9vw,110px);}
/* Divider badge: sits ON the seam between this section and the one above. */
.brgw-sec--careers-apply .seam{position:absolute;top:0;left:50%;width:clamp(64px,6.5vw,96px);
  transform:translate(-50%,-50%);z-index:4;}
.brgw-sec--careers-apply .seam img{width:100%;height:auto;display:block;}

.brgw-sec--careers-apply h2{font-size:clamp(2.1rem,4.6vw,3.9rem);text-transform:uppercase;
  max-width:14ch;margin-bottom:clamp(38px,5vw,64px);}
/* Second line carries a pink marker block, rotated like the comp. */
/* Look is unchanged; it now travels as variables the shared highlight system reads.
   --brgw-hl-rot is 0deg because THIS element already rotates — letting the h3 block
   add its own -1.4deg on top would compound into a visible skew. */
.brgw-sec--careers-apply h2 .mark{--brgw-hl-c:var(--pink);--brgw-hl-pad:.04em .26em;--brgw-hl-rot:0deg;
  display:inline-block;transform:rotate(-1.6deg);}

.brgw-sec--careers-apply .cols{display:grid;grid-template-columns:1fr;gap:clamp(34px,5vw,80px);
  max-width:1360px;margin-inline:auto;}
@media(min-width:900px){ .brgw-sec--careers-apply .cols{grid-template-columns:1.15fr .85fr;} }
.brgw-sec--careers-apply .cols p{opacity:.86;font-size:clamp(.98rem,1.15vw,1.1rem);line-height:1.66;}
.brgw-sec--careers-apply .cols p + p{margin-top:1.15em;}

.brgw-sec--careers-apply h3{font-size:clamp(1.5rem,2.6vw,2.2rem);text-transform:uppercase;margin-bottom:22px;}
.brgw-sec--careers-apply ul{list-style:none;margin:0;padding:0;display:grid;gap:20px;}
.brgw-sec--careers-apply li{position:relative;padding-left:38px;line-height:1.5;
  font-size:clamp(.98rem,1.15vw,1.1rem);}
/* Asterisk bullet: masked so the mark can take brand yellow. Must be icn-misc-ast-blk
   (a single bare asterisk path) — svg/icons/asterisk.svg is the badge lockup, 3 paths
   including its blob, so masking with it yields a solid disc, not an asterisk. */
.brgw-sec--careers-apply li::before{content:"";position:absolute;left:0;top:.12em;width:20px;height:20px;
  background:var(--yellow);
  -webkit-mask:url('https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-blk.svg') center/contain no-repeat;
  mask:url('https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-blk.svg') center/contain no-repeat;}

.brgw-sec--careers-apply .cta{text-align:center;margin-top:clamp(52px,6vw,86px);}
.brgw-sec--careers-apply .cta .btn{border:3px solid var(--ink);}
</style>
  <span class="seam" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/div-icn-ast.svg" alt="" width="150" height="146" loading="lazy" decoding="async"></span>

  <h2 class="blanco anim-head">What it's like<br><span class="mark"><svg class="hl-b" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true"><path d="M5,6 C62,3 140,5 210,3 C228,2 236,4 236,9 C237,20 235,31 234,38 C233,42 226,43 208,42 C138,40 64,42 10,41 C5,41 3,38 3,31 C2,22 2,12 5,6 Z"/></svg><span class="hl-t">to work here</span></span></h2>

  <div class="cols">
    <div>
      <p class="anim-up">{{body_1}}</p>
      <p class="anim-up">{{body_2}}</p>
    </div>
    <div>
      <h3 class="blanco anim-up">{{offers_heading}}</h3>
      <ul>
        <li class="anim-up">Competitive pay</li>
        <li class="anim-up">Growth and advancement opportunities across multiple brands and locations</li>
        <li class="anim-up">A team-first culture that takes your development seriously</li>
        <li class="anim-up">The chance to work in restaurants that people genuinely love</li>
      </ul>
    </div>
  </div>

  <div class="cta"><a class="btn anim-cta" href="{{cta_href}}">{{cta_label}}</a></div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"body_1": "This isn't your average restaurant gig. At BRG, we invest in our people \u2014 with real training, real growth paths, and a culture that actually lives up to the hype.", "body_2": "Whether you're starting your first job in hospitality or you're a seasoned operator looking for your next move, there's a place for you here. We promote from within, develop leaders intentionally, and build teams that stick around.", "offers_heading": "We offer:", "cta_label": "Apply Today", "cta_href": "#open-positions", "hl_variant": "h3"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
