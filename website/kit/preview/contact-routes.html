<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — where to send it — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: contact-routes  →  [brg_contact-routes]
     Built from Expo SPEC-006 §2.2. The page's actual content: a switchboard, not a form.
     Reuses home-values' hairline-rule grid — dividers BETWEEN cells, nothing on the outside —
     at community-stats' 2-col width. The only new behavior is that each label is a link.

     ODD-COUNT SAFE. The two rules at the foot of the grid block are the ones I added to
     community-stats (6021c32): a 2-col grid whose last cell is odd would otherwise leave that
     cell alone in the left column still carrying border-right — a rule beside empty space —
     and strip the bottom rule from its neighbor too. Carried here deliberately rather than
     copied later, because a FIFTH route is already foreseeable: Sean asked for phone links and
     no number exists yet, so the phone card drops in as a 5th cell the day he supplies one.
     Both rules are inert at four cells.

     Two of the four destinations are already live and proven — the general mailto and the
     partnership mailto both work on community-partner today. Careers points at a live page.
     Only the press route is provisional, pending SPEC-005. -->
<section class="brgw-sec brgw-sec--contact-routes reveal" data-nav="light" aria-label="Who to contact" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--contact-routes{--brgw-wrap:1080px;background:var(--white);color:var(--ink);
  padding:clamp(64px,7.5vw,104px) var(--pad) clamp(70px,8vw,116px);}
.brgw-sec--contact-routes h2{font-size:clamp(1.9rem,4vw,3.2rem);text-transform:uppercase;
  text-align:center;max-width:20ch;margin:0 auto clamp(34px,4vw,60px);}

.brgw-sec--contact-routes .grid{display:grid;grid-template-columns:1fr;
  max-width:var(--brgw-wrap);margin-inline:auto;}
@media(min-width:700px){ .brgw-sec--contact-routes .grid{grid-template-columns:1fr 1fr;} }
.brgw-sec--contact-routes .cell{padding:clamp(26px,3vw,44px) clamp(20px,2.6vw,40px);
  border-top:1px solid rgba(0,0,0,.16);}
/* THE SMALL BUTTON under each route. Sean, 3 Oct: "each one of these sections is
   supposed to have a button underneath it, like a small button." The route's heading
   was the only link, which is not obviously clickable and gives nothing to press on a
   phone. btn--sm is the house button at a size that sits under a one-line description
   without becoming the loudest thing in the cell.
   An empty label means that route has no button, same rule as everywhere else. */
.brgw-sec--contact-routes .cell .btn--sm{margin-top:clamp(14px,1.6vw,20px);}
.brgw-sec--contact-routes .cell .btn[data-cta=""]{display:none;}
@media(min-width:700px){
  .brgw-sec--contact-routes .cell{border-top:0;border-bottom:1px solid rgba(0,0,0,.16);
    border-right:1px solid rgba(0,0,0,.16);}
  .brgw-sec--contact-routes .cell:nth-child(2n){border-right:0;}
  .brgw-sec--contact-routes .cell:nth-last-child(-n+2){border-bottom:0;}
  /* See the header note — keeps an odd final cell from stranding a rule beside empty space. */
  .brgw-sec--contact-routes .cell:last-child:nth-child(odd){grid-column:1/-1;border-right:0;}
  .brgw-sec--contact-routes .grid:has(.cell:last-child:nth-child(odd)) .cell:nth-last-child(2){
    border-bottom:1px solid rgba(0,0,0,.16);}
}
/* The label IS the link. Teal to match .lbl elsewhere; the underline is drawn on a
   pseudo-element so it can wipe in on hover without shifting the text baseline. */
.brgw-sec--contact-routes .lbl{display:inline-block;position:relative;color:var(--teal);
  text-decoration:none;font-size:clamp(1.3rem,2.2vw,1.9rem);text-transform:uppercase;
  margin-bottom:12px;}
.brgw-sec--contact-routes .lbl::after{content:"";position:absolute;left:0;right:0;bottom:-2px;
  height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;
  transition:transform .24s cubic-bezier(.4,0,.2,1);}
.brgw-sec--contact-routes .lbl:hover::after,
.brgw-sec--contact-routes .lbl:focus-visible::after{transform:scaleX(1);}
.brgw-sec--contact-routes .cell p{font-size:clamp(.94rem,1.05vw,1.02rem);line-height:1.55;opacity:.86;}
</style>
  <!-- Section background: a pattern or photo behind everything in this section.
       NO src ON THE <img>, only <source srcset>: an empty src resolves against the
       PAGE and re-downloads the document as an image for every visitor, so a section
       with no background chosen has to cost nothing. An empty <source srcset=""> is
       skipped by the browser instead. data-brgw-frame lets the parallax engine move it. -->
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <h2 class="blanco anim-head">{{heading}}</h2>
  <div class="brgw-cta" data-cta-at="head" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
  <div class="grid">
    <div class="cell anim-up"><a class="lbl blanco" href="{{route_1_href}}">{{route_1_label}}</a><p>{{route_1_text}}</p><a class="btn btn--sm anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{route_1_btn_label}}" href="{{route_1_btn_href}}" data-brgw-modal="{{route_1_btn_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{route_1_btn_label}}</a></div>
    <div class="cell anim-up"><a class="lbl blanco" href="{{route_2_href}}">{{route_2_label}}</a><p>{{route_2_text}}</p><a class="btn btn--sm anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{route_2_btn_label}}" href="{{route_2_btn_href}}" data-brgw-modal="{{route_2_btn_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{route_2_btn_label}}</a></div>
    <div class="cell anim-up"><a class="lbl blanco" href="{{route_3_href}}">{{route_3_label}}</a><p>{{route_3_text}}</p><a class="btn btn--sm anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{route_3_btn_label}}" href="{{route_3_btn_href}}" data-brgw-modal="{{route_3_btn_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{route_3_btn_label}}</a></div>
    <div class="cell anim-up"><a class="lbl blanco" href="{{route_4_href}}">{{route_4_label}}</a><p>{{route_4_text}}</p><a class="btn btn--sm anim-cta" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}" data-btn-fx="{{btn_effect}}" data-cta="{{route_4_btn_label}}" href="{{route_4_btn_href}}" data-brgw-modal="{{route_4_btn_popup}}" data-brgw-modal-bg="{{modal_bg}}">{{route_4_btn_label}}</a></div>
  </div>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-style="{{btn_style}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-color="{{buttons.color}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{btn_effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Who do you need?", "route_1_label": "General", "route_1_href": "mailto:hello@blacktoprg.com", "route_1_text": "Anything that doesn't fit the boxes below.", "route_1_btn_label": "", "route_1_btn_href": "", "route_1_btn_popup": "", "route_2_label": "Press & media", "route_2_href": "mailto:hello@blacktoprg.com?subject=Press%20enquiry", "route_2_text": "Press kit, high-res imagery, interviews, or a comment on a story.", "route_2_btn_label": "", "route_2_btn_href": "", "route_2_btn_popup": "", "route_3_label": "Partnerships & giveback", "route_3_href": "mailto:hello@blacktoprg.com?subject=Community%20partnership", "route_3_text": "Nonprofits, schools, and local organizations.", "route_3_btn_label": "", "route_3_btn_href": "", "route_3_btn_popup": "", "route_4_label": "Careers", "route_4_href": "/careers/", "route_4_text": "Open roles across Board & Brew and Odie's.", "route_4_btn_label": "", "route_4_btn_href": "", "route_4_btn_popup": "", "section_bg": "", "section_bg_opacity": "0.18", "section_bg_px": "0", "section_bg_px_dir": "down", "section_bg_mobile": "", "cta_position": "foot", "btn_color": "keep", "btn_style": "keep", "btn_effect": "lift", "buttons": "", "modal_bg": "white"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
