<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Home — core values — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: home-values  →  [brg_home-values]
     Matches website/mocks/brg_home-values.
     Owns the yellow ASTERISK seam badge, bleeding upward into home-different (bleed rule).
     The comp's grid is RULES, not filled cards: hairline dividers between cells, no borders
     on the outside. Five values, not six — "Do It Right" isn't in the comp, and Stay Stoked's
     copy differs from the old monolith, so the copy here is taken from the export. -->
<section class="brgw-sec brgw-sec--home-values reveal" data-nav="dark" aria-label="Our core values" data-cta-pos="{{cta_position}}">
<style>
.brgw-sec--home-values{--brgw-wrap:1420px;position:relative;background:#000;overflow:visible;
  padding:clamp(84px,9vw,130px) var(--pad) clamp(80px,9vw,124px);}
.brgw-sec--home-values > *{position:relative;z-index:2;}

.brgw-sec--home-values .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--home-values .seam img{width:100%;height:auto;display:block;}

.brgw-sec--home-values h2{font-size:clamp(2.2rem,5vw,4.2rem);text-transform:uppercase;
  margin-bottom:clamp(40px,4.6vw,72px);max-width:1420px;margin-inline:auto;}

/* Hairline rules between cells, nothing on the outside — gap+background would draw an outer
   border too, so the rules are per-cell insets instead. */
.brgw-sec--home-values .grid{display:grid;grid-template-columns:1fr;
  max-width:var(--brgw-wrap);margin-inline:auto;}
@media(min-width:700px){ .brgw-sec--home-values .grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1040px){ .brgw-sec--home-values .grid{grid-template-columns:repeat(3,1fr);} }
.brgw-sec--home-values .cell{padding:clamp(24px,2.6vw,40px) clamp(20px,2.4vw,38px);
  border-top:1px solid rgba(255,255,255,.42);}
@media(min-width:700px){
  .brgw-sec--home-values .cell{border-top:0;border-bottom:1px solid rgba(255,255,255,.42);
    border-right:1px solid rgba(255,255,255,.42);}
  .brgw-sec--home-values .cell:nth-child(2n){border-right:0;}
}
@media(min-width:1040px){
  .brgw-sec--home-values .cell:nth-child(2n){border-right:1px solid rgba(255,255,255,.42);}
  .brgw-sec--home-values .cell:nth-child(3n){border-right:0;}
  .brgw-sec--home-values .cell:nth-last-child(-n+2){border-bottom:0;}
}
.brgw-sec--home-values .lbl{display:inline-block;background:var(--teal);color:var(--ink);
  font-size:clamp(1rem,1.5vw,1.35rem);text-transform:uppercase;padding:.08em .34em;margin-bottom:16px;}
.brgw-sec--home-values .cell p{opacity:.9;font-size:clamp(.94rem,1.05vw,1.02rem);line-height:1.6;}
</style>
  <div class="sec-bg" data-bg="{{section_bg}}" style="--sec-bg-o:{{section_bg_opacity}}"
       data-brgw-frame aria-hidden="true"><picture><source media="(max-width:767px)" srcset="{{section_bg_mobile}}"><source srcset="{{section_bg}}"><img alt="" loading="lazy" decoding="async" width="1600" height="1200"
            data-px="{{section_bg_px}}" data-px-dir="{{section_bg_px_dir}}"></picture></div>
  <span class="seam" aria-hidden="true" data-mark-pos="{{mark_1_ast_pos}}" data-mark-show="{{mark_1_ast_show}}" data-mark-anim="{{mark_1_ast_anim}}" data-mark-o style="--brgw-mark-o:{{mark_1_ast_opacity}}"><img class="brgw-pop" src="{{mark_1_ast_art}}" alt="" width="150" height="146" loading="lazy" decoding="async"></span>

  <h2 class="blanco anim-head">{{heading}}</h2>
  <div class="brgw-cta" data-cta-at="head" data-btn-color="{{btn_color}}" data-btn-hover="{{btn_hover}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-hover="{{buttons.hover}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
  <div class="grid">
    <!--brg:repeat values-->
    <div class="cell anim-up"><span class="lbl blanco">{{values.label}}</span><p>{{values.body}}</p></div>
    <!--brg:empty-->
    <div class="cell anim-up"><span class="lbl blanco">Leadership</span><p>We lead from the front. Every shift, every decision, every interaction is an opportunity to set the standard &mdash; not follow it.</p></div>
    <div class="cell anim-up"><span class="lbl blanco">Culture</span><p>Culture isn't a poster on the wall. It's how we treat each other, how we show up, and the environment we build every single day.</p></div>
    <div class="cell anim-up"><span class="lbl blanco">Advocate</span><p>We go to bat for our team, our guests, and our communities. If you're part of our world, we're in your corner.</p></div>
    <div class="cell anim-up"><span class="lbl blanco">Stay Stoked</span><p>Life's too short to be boring about food. We bring energy, passion, and a little fun to everything we do.</p></div>
    <div class="cell anim-up"><span class="lbl blanco">Community</span><p>We don't just operate in communities &mdash; we're part of them. We give back, show up, and invest in the places that invest in us.</p></div>
    <!--/brg:repeat-->
  </div>
  <div class="brgw-cta" data-cta-at="foot" data-btn-color="{{btn_color}}" data-btn-hover="{{btn_hover}}" data-btn-style="{{btn_style}}" data-btn-size="{{btn_size}}" data-btn-fx="{{btn_effect}}"><!--brg:repeat buttons--><a class="btn anim-cta" data-btn-size="{{buttons.size}}" data-btn-color="{{buttons.color}}" data-btn-hover="{{buttons.hover}}" data-btn-style="{{buttons.style}}" data-btn-fx="{{buttons.effect}}" data-cta="{{buttons.label}}" href="{{buttons.href}}" data-brgw-modal="{{buttons.popup}}" data-brgw-modal-bg="{{modal_bg}}">{{buttons.label}}</a><!--brg:empty--><!--/brg:repeat--></div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Our core values", "section_bg": "https://blacktoprg.netlify.app/assets/media/bkgnds/brg-pattern-gry.webp", "section_bg_mobile": "", "section_bg_opacity": "0.18", "section_bg_px": "0", "section_bg_px_dir": "down", "values": "", "mark_1_ast_art": "https://blacktoprg.netlify.app/assets/media/icons/div-icn-ast.svg", "mark_1_ast_pos": "keep", "mark_1_ast_opacity": "100", "mark_1_ast_show": "1", "mark_1_ast_anim": "keep", "cta_position": "foot", "btn_size": "", "btn_color": "keep", "btn_hover": "keep", "btn_style": "keep", "btn_effect": "lift", "buttons": "", "modal_bg": "white"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
