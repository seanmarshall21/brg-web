<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Restaurants — brands — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: our-restaurants-brands  →  [brg_our-restaurants-brands]
     Matches the Our Restaurants comp (mocks/BRG - Our Restaurants.png, y 916–2466 @1x).
     Light section. Owns the yellow asterisk seam badge, bleeding upward per the bleed rule.
     Brand plates are the real label artwork (bnb-img-label / odies-img-label), each on the
     image-reveal + parallax hooks. -->
<section class="brgw-sec brgw-sec--or-brands reveal" aria-label="Our brands">
<style>
.brgw-sec--or-brands{position:relative;background:var(--white);color:var(--ink);overflow:visible;
  padding:clamp(78px,8.5vw,124px) var(--pad) clamp(74px,8vw,116px);}
.brgw-sec--or-brands .seam{position:absolute;top:0;left:50%;width:clamp(62px,6vw,92px);
  transform:translate(-50%,-50%);z-index:5;}
.brgw-sec--or-brands .seam img{width:100%;height:auto;display:block;}

.brgw-sec--or-brands .brand{display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,64px);
  max-width:1400px;margin-inline:auto;align-items:center;}
@media(min-width:900px){ .brgw-sec--or-brands .brand{grid-template-columns:1fr 1fr;gap:clamp(40px,5vw,84px);} }
/* Hairline rule between the two brands, as in the comp — nothing above or below. */
.brgw-sec--or-brands .brand + .brand{margin-top:clamp(46px,5vw,80px);padding-top:clamp(46px,5vw,80px);
  border-top:1px solid var(--ink);}

/* No image-reveal here: these are logo lockups, and the reveal's 2→1.2 counter-scale
   crops the wordmark. A brand mark should never be cropped for the sake of an effect. */
.brgw-sec--or-brands .plate{border-radius:14px;aspect-ratio:16/11;overflow:hidden;}
.brgw-sec--or-brands .plate img{width:100%;height:100%;object-fit:cover;display:block;}
.brgw-sec--or-brands h3{font-size:clamp(1.8rem,3.6vw,3.1rem);text-transform:uppercase;margin-bottom:18px;}
.brgw-sec--or-brands p{opacity:.86;font-size:clamp(.97rem,1.1vw,1.06rem);line-height:1.62;max-width:46ch;}
.brgw-sec--or-brands p + p{margin-top:1.1em;}
.brgw-sec--or-brands .btn{background:var(--ink);color:var(--white);margin-top:clamp(24px,2.6vw,36px);}
</style>
  <span class="seam" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/div-icn-ast.svg" alt="" width="150" height="146"></span>

  <div class="brand">
    <div class="plate">
      <img class="anim-up" src="https://blacktoprg.netlify.app/assets/media/imgs/bnb-img-label.svg"
           alt="Board &amp; Brew" width="800" height="550" decoding="async" loading="lazy">
    </div>
    <div>
      <h3 class="blanco anim-head">{{bnb_heading}}</h3>
      <p class="anim-up">{{bnb_body_1}}</p>
      <p class="anim-up">{{bnb_body_2}}</p>
      <a class="btn anim-cta" href="{{bnb_cta_href}}" target="_blank" rel="noopener">{{bnb_cta_label}}</a>
    </div>
  </div>

  <div class="brand">
    <div class="plate">
      <img class="anim-up" src="https://blacktoprg.netlify.app/assets/media/imgs/odies-img-label.svg"
           alt="Odie's Pizza Co." width="800" height="550" decoding="async" loading="lazy">
    </div>
    <div>
      <h3 class="blanco anim-head">{{odies_heading}}</h3>
      <p class="anim-up">{{odies_body_1}}</p>
      <p class="anim-up">{{odies_body_2}}</p>
      <a class="btn anim-cta" href="{{odies_cta_href}}" target="_blank" rel="noopener">{{odies_cta_label}}</a>
    </div>
  </div>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"bnb_heading": "Board & Brew", "bnb_body_1": "San Diego's iconic sandwich shop. Board & Brew has been handcrafting sandos with fresh-baked bread and premium ingredients since before craft sandwiches were cool.", "bnb_body_2": "12 locations across San Diego and Orange County \u2014 each one a neighborhood staple.", "bnb_cta_label": "Visit Us", "bnb_cta_href": "https://boardandbrew.com", "odies_heading": "Odie's Pizza Co.", "odies_body_1": "Oceanside's newest pizza obsession. Odie's Pizza Co. brings sourdough pies and radical vibes to the Southern California coast \u2014 think big slices, bold flavors, and a neighborhood vibe that makes you want to stick around.", "odies_body_2": "Our flagship is right in the heart of downtown Oceanside, and more locations are on the way.", "odies_cta_label": "Visit Us", "odies_cta_href": "https://odiespizza.com"};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
