<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers — hero — preview</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<style>html,body{margin:0;background:#0f0e0d}</style></head><body>
<div class="brgw" id="root"></div>
<template id="frag"><!-- BRG · section: careers-hero  →  [brg_careers-hero] -->
<section class="brgw-sec brgw-sec--careers-hero brgw-hero reveal" aria-label="Careers">
<style>
.brgw-sec--careers-hero{overflow:hidden;}
.brgw-sec--careers-hero .brgw-uline{color:var(--teal);}
</style>
  <h1 class="blanco anim-head" data-head="words">{{heading}}</h1>
  <span class="brgw-uline anim-up" aria-hidden="true"></span>
  <p class="sub anim-up">{{sub_1}} <span class="hl">{{sub_highlight}}</span></p>
  <span class="brgw-doodle brgw-doodle--c" style="top:var(--brgw-doodle-top);right:9%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-ast-circle-wht.svg" alt="" width="122" height="118"></span>
  <span class="brgw-doodle brgw-doodle--b" style="bottom:var(--brgw-doodle-bottom);left:8%" aria-hidden="true"><img src="https://blacktoprg.netlify.app/assets/media/icons/icn-misc-smile-yel.svg" alt="" width="215" height="208"></span>
</section>
</template>
<script>
// Fill the raw fragment exactly the way the plugin does: a literal string replace of
// {{token}} on the RAW markup, so a token inside an attribute (href="{{cta_href}}")
// works the same as one in text. Slots arrive base64 in the hash, so changing them
// reloads the frame — which doubles as the animation replay.
(function(){
  var D = {"heading": "Come work somewhere you actually want to be", "sub_1": "We're building careers here, not just filling shifts. If you're driven, hospitality-minded, and ready to grow \u2014", "sub_highlight": "let's talk."};
  var raw = document.getElementById('frag').innerHTML;
  var slots = {};
  try { if (location.hash.length > 1) slots = JSON.parse(atob(decodeURIComponent(location.hash.slice(1)))); } catch(e){}
  var out = raw.replace(/\{\{([a-z0-9_-]+)\}\}/gi, function(m, k){
    return Object.prototype.hasOwnProperty.call(slots, k) ? slots[k] : (D[k] !== undefined ? D[k] : '');
  });
  document.getElementById('root').innerHTML = out;
  var s = document.createElement('script'); s.src = 'https://blacktoprg.netlify.app/assets/brgw.js'; document.body.appendChild(s);
})();
</script></body></html>
