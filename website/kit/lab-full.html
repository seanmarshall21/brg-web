<!DOCTYPE html>
<!--
  Underline lab — FULL VIEW of one item.  lab-full.html?v=A1

  Hand-authored, deliberately NOT generated by kit/build-kit.py — it is content, not a
  rendering of a source of truth. Safe because build-kit.py only makedirs, never wipes.

  WHAT THIS IS, after Sean cut it back:

    ONE real section, rendered as it is on the site, with ONLY the element under test
    replaced by the variant. Replay fires it. That is the whole page.

  What it deliberately is NOT any more: a composed multi-section page with spacers and a
  simulated scroll trigger. That version tried to prove something the lab cannot — where
  an animation fires is a per-section decision made when a section is built, not a
  property of an underline — and the machinery to fake it is what broke twice. Replay
  shows the animation; where it fires is settled later, per section.

  Section is chosen to match the group: A and B ride a hero headline, C rides the marker
  block in careers-apply, D is the nav alone and is interactive rather than timed.
  Everything not under test renders as production.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full view — underline lab</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw-nav.css">
<link rel="stylesheet" href="lab-core.css">
<style>
:root{--labink:#f4f1ea;--labdim:rgba(244,241,234,.6);--labline:rgba(244,241,234,.16)}
html,body{margin:0;background:#0f0e0d}
body{overflow-x:clip}
.ctl{position:fixed;z-index:9999;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
padding:9px 14px;background:rgba(10,9,8,.94);border-bottom:1px solid var(--labline);
backdrop-filter:blur(8px);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.ctl a,.ctl button{font:600 .68rem 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;
text-transform:uppercase;background:transparent;color:var(--labdim);border:1px solid var(--labline);
border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
.ctl a:hover,.ctl button:hover{color:var(--labink);border-color:var(--labink)}
.ctl .on{background:var(--labink);color:#0f0e0d;border-color:var(--labink)}
.ctl .who{color:var(--labink);margin-right:auto;font-size:.8rem;text-transform:none;letter-spacing:0}
.ctl .go{border-color:var(--labink);color:var(--labink)}
.wrap{margin-top:44px}
.wrap.mob{max-width:390px;margin-left:auto;margin-right:auto;
border-left:1px solid var(--labline);border-right:1px solid var(--labline)}
.note{padding:9px 16px;background:#171514;color:var(--labdim);border-bottom:1px solid var(--labline);
font:400 .74rem 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
.note b{color:var(--labink)}
.loading{padding:80px 24px;text-align:center;color:var(--labdim);
font:400 .85rem 'Helvetica Neue',Helvetica,Arial,sans-serif}
.navonly{padding:0 0 90px;background:#f4f1ea}
.navonly .hint{padding:70px 24px 0;text-align:center;color:#231F20;opacity:.6;
font:400 .82rem 'Helvetica Neue',Helvetica,Arial,sans-serif}
</style>
</head><body>

<div class="ctl">
  <span class="who">Full view — <b id="vname">…</b> <span id="vid" style="color:var(--labdim)"></span></span>
  <span id="vp"><button data-vp="desk" class="on">Desktop</button><button data-vp="mob">Mobile 390</button></span>
  <button id="replay" class="go">Replay</button>
  <a href="lab.html">&larr; back to the lab</a>
</div>

<div class="wrap" id="wrap">
  <div class="note" id="note">Real section, real <b>brgw.css</b> and <b>brgw.js</b>.
  <b>Only the underline is the variant.</b> Press <b>Replay</b> to fire it again.</div>
  <div class="brgw" id="root"><div class="loading">loading the section&hellip;</div></div>
</div>

<script src="lab-core.js"></script>
<script>
const $=(q,r)=>(r||document).querySelector(q);
const CDN='https://blacktoprg.netlify.app';
const id=(new URLSearchParams(location.search).get('v')||'A1').toUpperCase();
const card=(typeof CARDS!=='undefined'?CARDS:[]).find(c=>c.id===id);

/* One section per group — whichever actually carries the element under test. */
const SECTION={gA:'careers-hero', gB:'careers-hero', gC:'careers-apply'};

const NAV = '<div class="bnav lay-left" data-sticky="pin">'
  + '<a class="bnav-logo" href="#"><img src="'+CDN+'/assets/media/logos/logo-brg-nav-sm.svg" alt="Blacktop" height="30"></a>'
  + '<ul class="nav-src">'
  + ['Home','Brands','Team','Community','Careers','Contact']
      .map(function(t,i){return '<li class="menu-item'+(i===4?' current-menu-item':'')+'"><a href="#">'+t+'</a></li>';}).join('')
  + '</ul></div>';

async function frag(sec){
  const [html,slots]=await Promise.all([
    fetch(CDN+'/sections/'+sec+'/embed.html').then(r=>r.ok?r.text():''),
    fetch(CDN+'/sections/'+sec+'/slots.json').then(r=>r.ok?r.json():({})).catch(()=>({}))
  ]);
  const d={};Object.keys(slots).forEach(k=>{if(!k.startsWith('_'))d[k]=(slots[k]||{}).default||'';});
  return html.replace(/\{\{([a-z0-9_-]+)\}\}/gi,function(m,k){return d[k]!==undefined?d[k]:'';});
}

/* Swap ONLY the element under test, carrying the real element's geometry across so the
   variant occupies exactly the space the original did. */
function applyVariant(scope){
  const m=card.html.match(/<span class="(u[^"]*)"([^>]*)>/);
  const mk=card.html.match(/<span class="(mk[^"]*)"/);
  if(m) scope.querySelectorAll('.brgw-uline').forEach(function(el){
    const cs=getComputedStyle(el), s=document.createElement('span');
    s.className=m[1]+' blk';
    const k=(m[2].match(/data-k="([^"]+)"/)||[])[1];
    if(k) s.dataset.k=k;
    s.style.color=cs.color; s.style.width=cs.width; s.style.height=cs.height;
    s.style.marginTop=cs.marginTop; s.style.marginInline='auto';
    s.innerHTML='<span class="box" aria-hidden="true">'+sv(k||'line-home-lg')+'</span>';
    el.replaceWith(s);
  });
  if(mk) scope.querySelectorAll('.mark').forEach(function(el){
    el.className=mk[1]; el.innerHTML='<span class="t">'+el.textContent+'</span>';
  });
}

/* Transitions are suppressed for the reset, or removing .on animates the thing
   backwards and the replay picks up mid-reverse. */
function fire(){
  const r=$('#root');
  r.classList.add('noanim');
  r.querySelectorAll('.u,.mk').forEach(function(x){x.classList.remove('on');});
  void r.offsetWidth; r.classList.remove('noanim'); void r.offsetWidth;
  setTimeout(function(){r.querySelectorAll('.u,.mk').forEach(function(x){x.classList.add('on');});},40);
}

(async function(){
  if(!card){
    $('#root').innerHTML='<div class="loading">No variant <b>'+id+'</b> — '
      +'<a href="lab.html" style="color:#19C7C2">back to the lab</a></div>';
    $('#vname').textContent='not found'; return;
  }
  $('#vname').textContent=card.t; $('#vid').textContent='· '+card.id;

  if(card.g==='gD'){
    $('#note').innerHTML='The production nav. <b>Hover the items</b> to see the underline '
      +'behaviour — this one is interactive, not a timed animation.';
    $('#root').innerHTML=NAV+'<div class="navonly"><p class="hint">Hover any menu item above.</p></div>';
    $('#replay').style.display='none';
  }else{
    const sec=SECTION[card.g]||'careers-hero';
    $('#root').innerHTML=NAV+(await frag(sec));
    applyVariant($('#root'));
  }

  /* brgw.js self-inits .brgw roots on load, so it must come after the injection. It
     brings the production split-line headline reveal, the fade-ups and the doodles. */
  [CDN+'/assets/brgw.js', CDN+'/assets/brgw-nav.js'].forEach(function(src){
    const s=document.createElement('script'); s.src=src; document.body.appendChild(s);
  });
  if(card.g!=='gD') setTimeout(fire,700);   /* let the headline reveal start first */
})();

$('#replay').onclick=function(){location.reload();};
document.querySelectorAll('#vp button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('#vp button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on'); $('#wrap').classList.toggle('mob',b.dataset.vp==='mob');};});
</script>
</body></html>
