<!DOCTYPE html>
<!--
  Underline lab — FULL PAGE VIEW.  lab-full.html?v=A1

  Hand-authored, deliberately NOT generated by kit/build-kit.py (same reasoning as
  lab.html: it is content, not a rendering of a source of truth). Safe because
  build-kit.py only makedirs and never wipes.

  WHAT CHANGED, AND WHY IT MATTERS: the first version of this page mocked the nav, the
  hero and the sections with its own CSS. Sean was right that this defeats the purpose —
  approving an animation inside an approximation means approving it twice. So this page
  now composes the REAL section fragments off the CDN, with the REAL brgw.css and the
  REAL brgw.js. That means the split-line headline reveal, the fade-ups, the doodles,
  the seam badges and the scroll triggers are the ones that ship, not imitations.

  The ONLY thing swapped is the element under test: each section's <span class="brgw-uline">
  (the current fixed-width bar) is replaced by the variant's mechanism, and each
  <span class="mark"> by the variant's marker. Everything around it is production.

  One honest finding while building it: on the real site an underline appears ONLY on
  the five heroes. There is no below-the-fold section with an underline, so that case
  cannot be shown without inventing one. What IS below the fold is careers-apply's
  marker block — which is where the C variants live — so the scroll trigger is real for
  those, and for A/B it fires at the top of the page exactly as it does in production.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full page — underline lab</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw-nav.css">
<link rel="stylesheet" href="lab-core.css">
<style>
:root{--labink:#f4f1ea;--labdim:rgba(244,241,234,.6);--labline:rgba(244,241,234,.16)}
html,body{margin:0;background:#0f0e0d}
body{overflow-x:clip}
.ctl{position:fixed;z-index:9999;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
padding:9px 14px;background:rgba(10,9,8,.94);border-bottom:1px solid var(--labline);
backdrop-filter:blur(8px);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.ctl a,.ctl button{font:600 .68rem 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;
text-transform:uppercase;background:transparent;color:var(--labdim);border:1px solid var(--labline);
border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
.ctl a:hover,.ctl button:hover{color:var(--labink);border-color:var(--labink)}
.ctl .on{background:var(--labink);color:#0f0e0d;border-color:var(--labink)}
.ctl .who{color:var(--labink);margin-right:auto;font-size:.8rem;text-transform:none;letter-spacing:0}
.wrap{margin-top:44px}
.wrap.mob{max-width:390px;margin-left:auto;margin-right:auto;
border-left:1px solid var(--labline);border-right:1px solid var(--labline)}
.note{padding:10px 16px;background:#171514;color:var(--labdim);border-bottom:1px solid var(--labline);
font:400 .74rem 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
.note b{color:var(--labink)}
.loading{padding:80px 24px;text-align:center;color:var(--labdim);
font:400 .85rem 'Helvetica Neue',Helvetica,Arial,sans-serif}
</style>
</head><body>

<div class="ctl">
  <span class="who">Full page — <b id="vname">…</b> <span id="vid" style="color:var(--labdim)"></span></span>
  <span id="vp"><button data-vp="desk" class="on">Desktop</button><button data-vp="mob">Mobile 390</button></span>
  <button id="replay">Replay</button>
  <a href="lab.html">&larr; back to the lab</a>
</div>

<div class="wrap" id="wrap">
  <div class="note">Real sections, real <b>brgw.css</b> and <b>brgw.js</b> &mdash; the split-line
  headline reveal, doodles and scroll triggers are the production ones.
  <b>Only the underline / marker is the variant.</b></div>
  <div class="brgw" id="root"><div class="loading">composing the real page&hellip;</div></div>
</div>

<script src="lab-core.js"></script>
<script>
const $=(q,r)=>(r||document).querySelector(q);
const CDN='https://blacktoprg.netlify.app';
const id=(new URLSearchParams(location.search).get('v')||'A1').toUpperCase();
const card=(typeof CARDS!=='undefined'?CARDS:[]).find(c=>c.id===id);

/* The real nav contract: the plugin emits wp_nav_menu output as <ul class="nav-src">,
   and brgw-nav.js turns that into the live bar. Same markup, so the same component. */
const NAV = '<div class="bnav lay-left" data-sticky="pin">'
  + '<a class="bnav-logo" href="#"><img src="'+CDN+'/assets/media/logos/logo-brg-nav-sm.svg" alt="Blacktop" height="30"></a>'
  + '<ul class="nav-src">'
  + ['Home','Brands','Team','Community','Careers','Contact']
      .map((t,i)=>'<li class="menu-item'+(i===4?' current-menu-item':'')+'"><a href="#">'+t+'</a></li>').join('')
  + '</ul></div>';

/* Three real sections: a hero (underline lives on heroes and nowhere else), an
   editorial section that carries the marker block, and a second hero far enough down
   that its trigger genuinely has to fire on scroll. */
const STACK=['careers-hero','careers-apply','community-hero'];

async function frag(id){
  const [html,slots]=await Promise.all([
    fetch(CDN+'/sections/'+id+'/embed.html').then(r=>r.ok?r.text():''),
    fetch(CDN+'/sections/'+id+'/slots.json').then(r=>r.ok?r.json():({})).catch(()=>({}))
  ]);
  const d={};Object.keys(slots).forEach(k=>{if(!k.startsWith('_'))d[k]=(slots[k]||{}).default||'';});
  // Fill exactly as the plugin does — literal replace on the raw markup, so a token in
  // an attribute behaves the same as one in text.
  return html.replace(/\{\{([a-z0-9_-]+)\}\}/gi,(m,k)=>d[k]!==undefined?d[k]:'');
}

function applyVariant(scope){
  if(!card) return;
  const m=card.html.match(/<span class="(u[^"]*)"([^>]*)>/);
  const mk=card.html.match(/<span class="(mk[^"]*)"/);
  // swap the fixed bar for the mechanism under test
  if(m) scope.querySelectorAll('.brgw-uline').forEach(el=>{
    const s=document.createElement('span');
    s.className=m[1]+' blk anim-up';
    const k=(m[2].match(/data-k="([^"]+)"/)||[])[1];
    if(k) s.dataset.k=k;
    // Carry the REAL element's geometry across, not just its colour. Otherwise the swap
    // silently changes layout — .u.blk is 520px wide with a ~1px top margin (tuned for the
    // card stage) where .brgw-uline is 340px with 16px, so the page ends up testing a
    // differently-sized element in a different place instead of testing the animation.
    // Doing it here rather than by tuning .u.blk means the two contexts stop fighting:
    // whatever the site uses is what the variant inherits, by construction.
    const cs=getComputedStyle(el);
    s.style.color=cs.color;
    s.style.width=cs.width;
    s.style.height=cs.height;
    s.style.marginTop=cs.marginTop;
    s.style.marginInline='auto';
    s.innerHTML='<span class="box" aria-hidden="true">'+sv(k||'line-home-lg')+'</span>';
    el.replaceWith(s);
  });
  // and the marker block, where the C variants live
  if(mk) scope.querySelectorAll('.mark').forEach(el=>{
    el.className=mk[1]; el.innerHTML='<span class="t">'+el.textContent+'</span>';
  });
}

(async function(){
  if(!card){
    $('#root').innerHTML='<div class="loading">No variant <b>'+id+'</b> — '
      +'<a href="lab.html" style="color:#19C7C2">back to the lab</a></div>';
    $('#vname').textContent='not found'; return;
  }
  $('#vname').textContent=card.t; $('#vid').textContent='· '+card.id;
  const parts=await Promise.all(STACK.map(frag));
  $('#root').innerHTML=NAV+parts.join('\n');
  applyVariant($('#root'));
  // The D group is nav hover. The real nav already injects .bnav-uline and already draws
  // in and un-draws out on hover — so on this page a D variant is not swapped in, you are
  // looking at the production behaviour. Saying so beats faking a swap and calling it a test.
  if(card.g==='gD'){
    $('#root').insertAdjacentHTML('afterbegin',
      '<div class="note" style="background:#2a2417;border-color:#5a4a1e">'
      +'<b>D variants are not injected here.</b> The nav above is the production one, which '
      +'already draws in and un-draws out on hover (<code>.bnav-uline</code>). Hover it to see '
      +'the shipped behaviour — then use the card on the lab page to compare the alternative.</div>');
  }
  // brgw.js self-inits every .brgw root on load, so it must come AFTER the injection.
  // It brings the split-line headline reveal, the fade-ups and the scroll triggers —
  // which is the whole reason this page composes the real thing.
  [CDN+'/assets/brgw.js', CDN+'/assets/brgw-nav.js'].forEach(src=>{
    const s=document.createElement('script'); s.src=src; document.body.appendChild(s);
  });
})();

$('#replay').onclick=()=>location.reload();
document.querySelectorAll('#vp button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#vp button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#wrap').classList.toggle('mob',b.dataset.vp==='mob');});
</script>
</body></html>
