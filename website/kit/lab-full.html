<!DOCTYPE html>
<!--
  Underline lab — FULL VIEW of one item.  lab-full.html?v=A1

  Hand-authored, deliberately NOT generated by kit/build-kit.py — it is content, not a
  rendering of a source of truth. Safe because build-kit.py only makedirs, never wipes.

  WHAT THIS IS, after Sean cut it back:

    ONE real section, rendered as it is on the site, with ONLY the element under test
    replaced by the variant. Replay fires it. That is the whole page.

  What it deliberately is NOT any more: a composed multi-section page with spacers and a
  simulated scroll trigger. That version tried to prove something the lab cannot — where
  an animation fires is a per-section decision made when a section is built, not a
  property of an underline — and the machinery to fake it is what broke twice. Replay
  shows the animation; where it fires is settled later, per section.

  Section is chosen to match the group: A and B ride a hero headline, C rides the marker
  block in careers-apply, D is the nav alone and is interactive rather than timed.
  Everything not under test renders as production.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full view — underline lab</title>
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw.css">
<link rel="stylesheet" href="https://blacktoprg.netlify.app/assets/brgw-nav.css">
<link rel="stylesheet" href="lab-core.css">
<style>
:root{--labink:#f4f1ea;--labdim:rgba(244,241,234,.6);--labline:rgba(244,241,234,.16)}
html,body{margin:0;background:#0f0e0d}
body{overflow-x:clip}
.ctl{position:fixed;z-index:9999;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
padding:9px 14px;background:rgba(10,9,8,.94);border-bottom:1px solid var(--labline);
backdrop-filter:blur(8px);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.ctl a,.ctl button{font:600 .68rem 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;
text-transform:uppercase;background:transparent;color:var(--labdim);border:1px solid var(--labline);
border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
.ctl a:hover,.ctl button:hover{color:var(--labink);border-color:var(--labink)}
.ctl .on{background:var(--labink);color:#0f0e0d;border-color:var(--labink)}
.ctl .who{color:var(--labink);margin-right:auto;font-size:.8rem;text-transform:none;letter-spacing:0}
.ctl .go{border-color:var(--labink);color:var(--labink)}
.wrap{margin-top:44px}
/* The production nav is position:fixed;top:0 and the lab's own control bar is
   fixed;top:0;z-index:9999 — so the bar sat directly on top of the nav and hid it
   completely. Sean: "I can't see them on the full screen preview because I can't see
   the header", which makes the whole D group unjudgeable in full view. Push the nav
   below the bar rather than moving the bar: the nav overlaying the hero is the real
   site's behaviour and that is the thing under test. */
.brgw .bnav{top:44px}
/* In the 390 column the nav would still span the whole window, because position:fixed
   ignores the .mob wrapper. Pin it to the column instead — left/right rather than a
   transform, since .bnav animates transform for its sticky hide. */
.wrap.mob .bnav{left:calc(50% - 195px);right:auto;width:390px}
/* Nothing paints until the sequence is armed. On first load the wrapper is inserted
   after brgw.js splits the headline, so there is a window where the box is positioned
   against a rect that is still settling — Sean on S-A2: "starts beyond where it's
   supposed to start and disappears and starts at that correct starting point." That is
   a real first paint at a stale position, not a bug in the variant. */
#root:not(.armed) .u .box,#root:not(.armed) .mk::before{visibility:hidden}
.wrap.mob{max-width:390px;margin-left:auto;margin-right:auto;
border-left:1px solid var(--labline);border-right:1px solid var(--labline)}
.note{padding:9px 16px;background:#171514;color:var(--labdim);border-bottom:1px solid var(--labline);
font:400 .74rem 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
.note b{color:var(--labink)}
.loading{padding:80px 24px;text-align:center;color:var(--labdim);
font:400 .85rem 'Helvetica Neue',Helvetica,Arial,sans-serif}
.navonly{padding:0 0 90px;background:#f4f1ea}
.navonly .hint{padding:70px 24px 0;text-align:center;color:#231F20;opacity:.6;
font:400 .82rem 'Helvetica Neue',Helvetica,Arial,sans-serif}
</style>
</head><body>

<div class="ctl">
  <span class="who">Full view — <b id="vname">…</b> <span id="vid" style="color:var(--labdim)"></span></span>
  <span id="vp"><button data-vp="desk" class="on">Desktop</button><button data-vp="mob">Mobile 390</button></span>
  <button id="replay" class="go">Replay</button>
  <a href="lab.html">&larr; back to the lab</a>
</div>

<div class="wrap" id="wrap">
  <div class="note" id="note">Real section, real <b>brgw.css</b> and <b>brgw.js</b>.
  <b>Only the underline is the variant.</b> <b>Replay</b> plays the whole entrance from the
  start &mdash; headline lines rising, then the underline.</div>
  <div class="brgw" id="root"><div class="loading">loading the section&hellip;</div></div>
</div>

<!-- Shared with lab.html — the artwork and the card list have ONE home each.
     Order matters: lines before cards, both before this page's script. -->
<script src="lab-lines.js"></script>
<script src="lab-cards.js"></script>
<script src="lab-core.js"></script>
<script>
const $=(q,r)=>(r||document).querySelector(q);
const CDN='https://blacktoprg.netlify.app';
const id=(new URLSearchParams(location.search).get('v')||'A1').toUpperCase();
const card=(typeof CARDS!=='undefined'?CARDS:[]).find(c=>c.id===id);

/* One section per group — whichever actually carries the element under test. */
const SECTION={gA:'careers-hero', gB:'careers-hero', gC:'careers-apply'};

/* MIRRORS the plugin's nav markup exactly — vc-clients-embed.php, vcc_render_nav().
   Not a simplification of it. brgw-nav.js reads <ul class="nav-src"> as its SOURCE and
   builds the visible items into .bnav-grp-a / .bnav-grp-b; with those two divs missing
   it threw on `grpA.innerHTML=''` before rendering a single item, so the nav showed a
   logo and nothing else and the whole D group was unjudgeable. The error was in the
   console the entire time and read as unrelated.

   If the plugin's header markup changes, this must follow. It is a hand copy of markup
   generated by PHP we cannot run here, which makes it the one piece of this page with
   no way to prove itself — treat a nav that looks wrong as this first. */
const NAV = '<header class="bnav lay-left bg-solid" data-left="2" data-right="3" data-sticky="pin">'
  + '<a class="bnav-logo" href="#" aria-label="Blacktop Restaurant Group — home">'
  + '<img src="'+CDN+'/assets/media/logos/logo-brg-nav-sm.svg" alt="Blacktop Restaurant Group"></a>'
  + '<ul class="nav-src">'
  + ['Home','Brands','Team','Community','Careers','Contact']
      .map(function(t,i){return '<li class="menu-item'+(i===4?' current-menu-item':'')
        +'"><a href="#">'+t+'</a></li>';}).join('')
  + '</ul>'
  + '<div class="bnav-grp bnav-grp-a"></div><div class="bnav-grp bnav-grp-b"></div>'
  + '<button class="bnav-ham" aria-label="Menu"><i></i><i></i></button>'
  + '</header>';

async function frag(sec){
  const [html,slots]=await Promise.all([
    fetch(CDN+'/sections/'+sec+'/embed.html').then(r=>r.ok?r.text():''),
    fetch(CDN+'/sections/'+sec+'/slots.json').then(r=>r.ok?r.json():({})).catch(()=>({}))
  ]);
  const d={};Object.keys(slots).forEach(k=>{if(!k.startsWith('_'))d[k]=(slots[k]||{}).default||'';});
  return html.replace(/\{\{([a-z0-9_-]+)\}\}/gi,function(m,k){return d[k]!==undefined?d[k]:'';});
}

/* Swap ONLY the element under test.

   The site's underline is a STANDALONE bar — fixed 340px, centred, with no relationship
   to the words above it. That is precisely the defect being fixed, so inheriting its
   geometry (which an earlier version did) made the full page show the current site's
   problem rather than the variant's answer.

   So: delete the bar, and WRAP the last line of the headline in the mechanism, exactly
   as the lab card does. An inline wrapper sizes itself to the text it contains, which is
   the entire point of the change. brgw.js splits the headline into .ln / .ln-i first, so
   this has to run after that. */
function applyVariant(scope){
  const m=card.html.match(/<span class="(u[^"]*)"([^>]*)>/);
  const mk=card.html.match(/<span class="(mk[^"]*)"/);

  if(m){
    const k=(m[2].match(/data-k="([^"]+)"/)||[])[1];
    scope.querySelectorAll('.brgw-uline').forEach(function(el){
      const colour=getComputedStyle(el).color;
      const head=el.closest('section,div').querySelector('.anim-head,h1,h2');
      el.remove();                                   // the fixed bar goes entirely
      if(!head) return;
      const lines=head.querySelectorAll('.ln-i');
      const target=lines.length?lines[lines.length-1]:head;   // last line, or the whole head
      const w=document.createElement('span');
      w.className=m[1];                              // e.g. "u wipe" — inline, hugs the text
      if(k) w.dataset.k=k;
      w.style.color=colour;
      while(target.firstChild) w.appendChild(target.firstChild);
      target.appendChild(w);
      // sv(k, draw): the second argument selects the CENTRELINE. Omitting it renders the
      // outline, which is the defect these variants exist to fix — lab.html passes the
      // same flag from the same class, so keep the two calls identical.
      w.insertAdjacentHTML('beforeend','<span class="box" aria-hidden="true">'
        +sv(k||'line-home-lg', w.classList.contains('draw'))+'</span>');
    });
  }

  if(mk) scope.querySelectorAll('.mark').forEach(function(el){
    el.className=mk[1];
    // Mirror the card's OWN inner structure rather than assuming one. The C cards wrap
    // .t in a .tw overflow mask, and rebuilding without it silently removes the clip the
    // text slides against — the animation still plays, just not the one under test.
    // This reads the shape out of card.html instead of hardcoding it, because the coupling
    // here is to a string format that nothing else records. (Expo, on applyVariant.)
    const txt = el.textContent;
    el.innerHTML = /class="tw"/.test(card.html)
      ? '<span class="tw"><span class="t">'+txt+'</span></span>'
      : '<span class="t">'+txt+'</span>';
  });
}

/* brgw.js splits the headline on its own schedule, so wait for the lines to exist
   before wrapping one. Polling rather than a fixed delay: a fixed delay is a guess that
   is wrong on a slow font load, and this is the element the whole page is about. */
function afterSplit(root,cb){
  let n=0;
  const t=setInterval(function(){
    if(root.querySelector('.anim-head .ln-i') || ++n>60){clearInterval(t); cb();}
  },50);
}

/* REPLAY PLAYS THE WHOLE ENTRANCE, not just the underline.

   The headline reveal is driven by brgw.js's IntersectionObserver, which calls
   io.unobserve() the moment it fires — so it is one-shot by design and a reload was
   the only way to see it again. But a reload plays it during the blank-to-painted
   flash, so what you actually saw was the tail: the underline alone, arriving on a
   headline that was already in place. Sean: "it replays like the last half-second."

   So we drive it ourselves. .is-in is what brgw.js toggles and what the CSS keys on
   (.brgw .reveal.is-in .ln-i{transform:translateY(0);transition:transform .9s}), so
   removing it returns the lines to translateY(160%) — the true pre-entrance state,
   which is what "before it comes on the screen" means.

   Order matters and each step is load-bearing:
     1. .noanim, so the reset does not animate BACKWARDS and get picked up mid-reverse
     2. drop .is-in and .on — lines back under the mask, underline undrawn
     3. reflow, drop .noanim, reflow — paint the start state before anything moves
     4. HOLD, so the pre-state is visible rather than a single frame
     5. re-add .is-in — lines rise on brgw.js's own 85ms stagger
     6. fire the underline once the last line has landed */
function revealMs(scope){
  /* brgw.js writes the stagger as an inline transition-delay, which survives the
     class removal — so it can be read while the element is in its reset state, when
     the computed transition is 'none' because the rule only exists under .is-in. */
  let max=0;
  scope.querySelectorAll('.ln-i,.anim-up,.anim-cta').forEach(function(el){
    max=Math.max(max, parseFloat(el.style.transitionDelay)||0);
  });
  return max + 900;                    // + the .9s transform in brgw.css
}

const HOLD = 520;                      // long enough to register as a start, not a stall

function fire(){
  const r=$('#root');
  const secs=r.querySelectorAll('.reveal');

  r.classList.add('armed');      // first paint is suppressed until here — see .armed in the CSS
  r.classList.add('noanim');
  r.querySelectorAll('.u,.mk').forEach(function(x){x.classList.remove('on');});
  secs.forEach(function(sec){sec.classList.remove('is-in');});
  void r.offsetWidth;
  r.classList.remove('noanim');
  void r.offsetWidth;

  const wait=revealMs(r);
  setTimeout(function(){
    secs.forEach(function(sec){sec.classList.add('is-in');});
    setTimeout(function(){
      r.querySelectorAll('.u,.mk').forEach(function(x){x.classList.add('on');});
    }, wait);
  }, HOLD);
}

(async function(){
  if(!card){
    $('#root').innerHTML='<div class="loading">No variant <b>'+id+'</b> — '
      +'<a href="lab.html" style="color:#19C7C2">back to the lab</a></div>';
    $('#vname').textContent='not found'; return;
  }
  $('#vname').textContent=card.t; $('#vid').textContent='· '+card.id;

  // nofull: the lab hides the link, but a pasted URL still lands here. S-B1's finding is
  // a TRIGGER THRESHOLD — fires only when fully on screen — and this page has no scroll
  // observation at all, so it would play identically to B1 and quietly misrepresent the
  // one thing the card exists to show. Absent beats explained; explained beats wrong.
  if(card.nofull){
    $('#note').innerHTML='<b>'+card.id+' has no full-page view, on purpose.</b> Its finding is '
      +'<i>when</i> the animation fires, and this page fires on a timer with no scroll '
      +'observation — so it would look identical to B1 and tell you nothing. Judge it on the '
      +'lab card, where the trigger is what is being shown.';
    $('#root').innerHTML='<div class="loading">Nothing to render here — '
      +'<a href="lab.html" style="color:#19C7C2">back to the lab</a></div>';
    $('#replay').style.display='none'; return;
  }

  if(card.g==='gD'){
    $('#note').innerHTML='The production nav. <b>Hover the items</b> to see the underline '
      +'behaviour — this one is interactive, not a timed animation.';
    $('#root').innerHTML=NAV+'<div class="navonly"><p class="hint">Hover any menu item above.</p></div>';
    $('#replay').style.display='none';
  }else{
    const sec=SECTION[card.g]||'careers-hero';
    $('#root').innerHTML=NAV+(await frag(sec));
  }

  /* brgw.js self-inits .brgw roots on load, so it must come after the injection. It
     brings the production split-line headline reveal, the fade-ups and the doodles. */
  [CDN+'/assets/brgw.js', CDN+'/assets/brgw-nav.js'].forEach(function(src){
    const s=document.createElement('script'); s.src=src; document.body.appendChild(s);
  });
  if(card.g!=='gD') afterSplit($('#root'),function(){
    applyVariant($('#root'));      // wrap the line brgw.js has just produced
    fire();                        // same path as Replay, so the first view and the button agree
  });
})();

$('#replay').onclick=fire;   // in place, so the entrance is visible rather than lost to a page load
document.querySelectorAll('#vp button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('#vp button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on'); $('#wrap').classList.toggle('mob',b.dataset.vp==='mob');};});
</script>
</body></html>
