# Auto-deploy the WordPress mu-plugin FILES on push, so you never hand-drop them again.
# (WPCode snippets live in the DB and can't be deployed this way — that's why the ACF
#  loader + embed plugin are mu-plugin FILES: brg-acf.php auto-registers ACF from Netlify,
#  and this Action copies both PHP files to /wp-content/mu-plugins/ over SSH.)
#
# ── ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions) ──────────
#   WP_SSH_HOST          your host, e.g. ssh.blacktoprestaurantgroup.com  (DreamHost gives you one)
#   WP_SSH_USER          the SSH user
#   WP_SSH_PASSWORD      that user's SSH password
#   WP_MU_PLUGINS_PATH   absolute path, e.g. /home/USER/blacktoprestaurantgroup.com/wp-content/mu-plugins
#
# AUTH: password, not key (Sean's call 2026-08-12 — DreamHost user already has one).
# If this ever moves to key auth, swap `password:` back to `key:` and store the PRIVATE
# key in WP_SSH_KEY, with its public half in the host's ~/.ssh/authorized_keys. Key auth
# is the stronger option: a password travels to the host on every run and is reusable by
# anyone who obtains it, where a deploy key can be scoped and revoked on its own.
#
# ⚠️ TRADE-OFF: this deploys to the LIVE site on every push to these files — it removes the
#    manual "verify before dropping it in" gate. If you'd rather keep a gate, delete the `push:`
#    block below and run it manually from the Actions tab (workflow_dispatch stays either way).
name: Deploy mu-plugins to WordPress
on:
  push:
    branches: [ main ]
    paths: [ 'website/wp-mu-plugin/**' ]
  workflow_dispatch: {}        # manual "Run workflow" button — also the safe-gate option

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LINT BEFORE COPYING. These are must-use plugins: a parse error in one is not a
      # broken feature, it is a white screen on every page of the site, admin included.
      # Until now the workflow copied first and verified bytes afterwards — which would
      # have confirmed that a fatally broken file arrived intact. The byte check answers
      # "did it get there", never "is it valid", and the difference is the whole site.
      #
      # It runs here rather than in pre-push because the authoring clone has no PHP at
      # all, so pre-push reports "php -l SKIPPED — N changed .php UNVERIFIED". A check
      # that is skipped on the only machine that runs it is not a check.
      - name: Lint the PHP before anything is deployed
        run: |
          set -euo pipefail
          php -v | head -1
          fail=0
          for f in website/wp-mu-plugin/*.php; do
            if php -l "$f" > /tmp/lint.out 2>&1; then
              echo "  OK   $f"
            else
              echo "::error file=$f::$(tail -1 /tmp/lint.out)"
              sed 's/^/      /' /tmp/lint.out
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::refusing to deploy — a mu-plugin would fatal the site"; exit 1; }

      # LINT PROVES IT PARSES. THIS PROVES IT LOADS. The difference is the whole site.
      # v2.9.0 nested vcc_chrome() inside another function: valid PHP, php -l passed,
      # and every page fataled with "call to undefined function" — wp-admin included,
      # white for five hours. A parse check cannot see that. This loads each plugin in
      # a real PHP process and asserts every function it DECLARES is defined afterwards.
      #
      # THE FIXTURE RUNS FIRST, AND MUST FAIL. A check that has never failed is not
      # known to work. scripts/smoke-fixtures/nested-function.php reproduces the v2.9.0
      # bug exactly; if the smoke check ever ACCEPTS it, the check is dead and we would
      # be deploying on a green tick that means nothing. This repo has met that failure
      # three times already — a version grep that compared nothing, a deploy file list
      # that went blind, and a git diff whose pathspec matched nothing and returned the
      # SHA-1 of empty input. Not a fourth.
      - name: Prove the smoke check can FAIL, then that the plugins PASS
        run: |
          set -euo pipefail
          # FIRST, PROVE THE CHECKER ITSELF PARSES. If plugin-smoke.php were broken, PHP
          # would exit non-zero on every invocation — including against the fixture — and
          # a naive "did it fail?" test would read that as the fixture being caught. A
          # broken checker would look exactly like a working one.
          php -l scripts/plugin-smoke.php
          echo "--- positive control: the broken fixture must be rejected ---"
          php -l scripts/smoke-fixtures/nested-function.php
          echo "    (php -l passed it — exactly the blind spot this step covers)"
          set +e
          php scripts/plugin-smoke.php scripts/smoke-fixtures/nested-function.php
          rc=$?
          set -e
          # EXIT CODE 1 SPECIFICALLY. 0 means it accepted a known-broken plugin. 255 means
          # the checker itself crashed. Both are failures, and they are different failures —
          # accepting either as "the fixture was caught" is how a dead check stays green.
          if [ "$rc" -eq 0 ]; then
            echo "::error::THE SMOKE CHECK ACCEPTED A KNOWN-BROKEN PLUGIN — it is not checking anything"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::smoke check exited $rc on the fixture, expected 1 — the checker itself is broken"
            exit 1
          fi
          echo "    fixture correctly REJECTED (exit 1)"
          echo "--- the real mu-plugins must all load ---"
          php scripts/plugin-smoke.php website/wp-mu-plugin/*.php

      - name: Copy mu-plugin files over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WP_SSH_HOST }}
          username: ${{ secrets.WP_SSH_USER }}
          password: ${{ secrets.WP_SSH_PASSWORD }}
          source: "website/wp-mu-plugin/*.php"
          target: ${{ secrets.WP_MU_PLUGINS_PATH }}
          strip_components: 2   # drop "website/wp-mu-plugin/" so files land directly in mu-plugins/

      # scp succeeding only proves bytes moved. These two steps prove the server got
      # what this commit contains.
      #
      # This began as one `grep … || true`, which PRINTED the deployed version and passed
      # whatever it found, under the name "Confirm the deployed version matches the repo".
      # It compared nothing for months. Then it compared two files BY NAME — and the day a
      # third plugin file was added, scp shipped it (it globs *.php) while the check stayed
      # blind to it. Same failure twice: a checker that knows less than the thing it checks.
      # The file list is DERIVED from the directory, never typed. The previous version
      # named vc-clients-embed.php and brg-acf.php, so adding brg-acf-admin-style.php
      # shipped a file (scp globs *.php) that the verification step could not see. A
      # deploy that checks a hardcoded subset of what it deploys reports success about
      # the files it happens to know — fc-brands' allowlist trap, moved into the checker.
      - name: Manifest of what this commit deploys
        id: want
        run: |
          set -euo pipefail
          cd website/wp-mu-plugin
          : > /tmp/manifest
          for f in *.php; do
            printf '%s %s\n' "$f" "$(sha256sum "$f" | cut -c1-16)" >> /tmp/manifest
          done
          [ -s /tmp/manifest ] || { echo "::error::no .php files to deploy — refusing a no-op deploy"; exit 1; }
          {
            echo "manifest<<MANIFEST_EOF"
            cat /tmp/manifest
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "deploying $(wc -l < /tmp/manifest) file(s):"
          cat /tmp/manifest

      - name: Confirm every deployed file matches the repo
        uses: appleboy/ssh-action@v1.0.3
        env:
          MANIFEST: ${{ steps.want.outputs.manifest }}
        with:
          host: ${{ secrets.WP_SSH_HOST }}
          username: ${{ secrets.WP_SSH_USER }}
          password: ${{ secrets.WP_SSH_PASSWORD }}
          envs: MANIFEST
          script: |
            cd "${{ secrets.WP_MU_PLUGINS_PATH }}"
            ls -l *.php
            if command -v sha256sum >/dev/null 2>&1; then digest() { sha256sum "$1" | cut -c1-16; }
            elif command -v shasum >/dev/null 2>&1; then digest() { shasum -a 256 "$1" | cut -c1-16; }
            else echo "::error::no sha256sum/shasum on the host — cannot verify the deploy"; exit 1; fi
            printf '%s\n' "$MANIFEST" > /tmp/brg-manifest
            bad=0; n=0
            while read -r name want; do
              [ -n "$name" ] || continue
              n=$((n+1))
              if [ ! -f "$name" ]; then
                echo "::error::$name is NOT on the server — scp reported success"
                bad=1; continue
              fi
              got=$(digest "$name")
              if [ "$got" != "$want" ]; then
                echo "::error::$name differs — server $got, repo $want"
                bad=1
              else
                echo "$name: match ($got)"
              fi
            done < /tmp/brg-manifest
            [ "$n" -gt 0 ] || { echo "::error::empty manifest — the check verified nothing"; exit 1; }
            [ "$bad" -eq 0 ] || exit 1
            rm -f /tmp/brg-manifest
            echo "all $n file(s) match, by bytes"

      # SMOKE TEST. The lint proves the file PARSES. It cannot prove the site RUNS, and on
      # 2026-08-19 that difference took every page down: a function was defined inside
      # another function's body, which is valid PHP and fatal at runtime — "call to
      # undefined function" before the outer function had ever been called. php -l passed
      # it, the byte check confirmed it arrived intact, and the deploy went green over a
      # white screen.
      #
      # A must-use plugin fatal takes the whole site including wp-admin, so the only
      # honest verification is to ask the site whether it is alive. The password gate
      # answers 200; a fatal answers 500. That is the distinction that matters.
      - name: Is the site actually alive?
        env:
          SITE: https://blacktoprestaurantgroup.com/
        run: |
          set -uo pipefail
          bad=0
          # wp-admin is in the list because that is where a mu-plugin fatal hurts most:
          # v2.9.0 white-screened the ADMIN too, so Sean could not even get in to fix it.
          # It is reachable unauthenticated — it 302s to wp-login.php, which is a real page.
          for path in "" "brands/" "team/" "wp-admin/"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -L --max-time 25 "$SITE$path" || echo 000)
            bytes=$(wc -c < /tmp/body | tr -d ' ')
            # A STATUS CODE ALONE IS NOT LIVENESS. With display_errors off, a fatal can
            # answer 200 with an empty body — that IS the white screen. 500 bytes is far
            # below any real page here (the gated splash is ~214KB, wp-login ~6KB) and far
            # above an empty response, so it separates them without being brittle.
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && [ "$bytes" -ge 500 ]; then
              echo "  OK   /$path -> $code (${bytes}B)"
            elif [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "::error::/$path answered $code but returned only ${bytes}B — that is what a white screen looks like"
              head -c 400 /tmp/body | sed 's/^/      /'
              bad=1
            else
              echo "::error::/$path returned $code — the deploy has broken the live site"
              head -c 400 /tmp/body | sed 's/^/      /'
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::ROLL BACK NOW: git checkout <last-good> -- website/wp-mu-plugin/ && git commit && git push"
            exit 1
          fi
          echo "site responding on every checked path"
