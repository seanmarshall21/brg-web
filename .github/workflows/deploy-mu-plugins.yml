# Auto-deploy the WordPress mu-plugin FILES on push, so you never hand-drop them again.
# (WPCode snippets live in the DB and can't be deployed this way — that's why the ACF
#  loader + embed plugin are mu-plugin FILES: brg-acf.php auto-registers ACF from Netlify,
#  and this Action copies both PHP files to /wp-content/mu-plugins/ over SSH.)
#
# ── ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions) ──────────
#   WP_SSH_HOST          your host, e.g. ssh.blacktoprestaurantgroup.com  (DreamHost gives you one)
#   WP_SSH_USER          the SSH user
#   WP_SSH_PASSWORD      that user's SSH password
#   WP_MU_PLUGINS_PATH   absolute path, e.g. /home/USER/blacktoprestaurantgroup.com/wp-content/mu-plugins
#
# AUTH: password, not key (Sean's call 2026-08-12 — DreamHost user already has one).
# If this ever moves to key auth, swap `password:` back to `key:` and store the PRIVATE
# key in WP_SSH_KEY, with its public half in the host's ~/.ssh/authorized_keys. Key auth
# is the stronger option: a password travels to the host on every run and is reusable by
# anyone who obtains it, where a deploy key can be scoped and revoked on its own.
#
# ⚠️ TRADE-OFF: this deploys to the LIVE site on every push to these files — it removes the
#    manual "verify before dropping it in" gate. If you'd rather keep a gate, delete the `push:`
#    block below and run it manually from the Actions tab (workflow_dispatch stays either way).
name: Deploy mu-plugins to WordPress
on:
  push:
    branches: [ main ]
    paths: [ 'website/wp-mu-plugin/**' ]
  workflow_dispatch: {}        # manual "Run workflow" button — also the safe-gate option

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LINT BEFORE COPYING. These are must-use plugins: a parse error in one is not a
      # broken feature, it is a white screen on every page of the site, admin included.
      # Until now the workflow copied first and verified bytes afterwards — which would
      # have confirmed that a fatally broken file arrived intact. The byte check answers
      # "did it get there", never "is it valid", and the difference is the whole site.
      #
      # It runs here rather than in pre-push because the authoring clone has no PHP at
      # all, so pre-push reports "php -l SKIPPED — N changed .php UNVERIFIED". A check
      # that is skipped on the only machine that runs it is not a check.
      - name: Lint the PHP before anything is deployed
        run: |
          set -euo pipefail
          php -v | head -1
          fail=0
          for f in website/wp-mu-plugin/*.php; do
            if php -l "$f" > /tmp/lint.out 2>&1; then
              echo "  OK   $f"
            else
              echo "::error file=$f::$(tail -1 /tmp/lint.out)"
              sed 's/^/      /' /tmp/lint.out
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::refusing to deploy — a mu-plugin would fatal the site"; exit 1; }

      - name: Copy mu-plugin files over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WP_SSH_HOST }}
          username: ${{ secrets.WP_SSH_USER }}
          password: ${{ secrets.WP_SSH_PASSWORD }}
          source: "website/wp-mu-plugin/*.php"
          target: ${{ secrets.WP_MU_PLUGINS_PATH }}
          strip_components: 2   # drop "website/wp-mu-plugin/" so files land directly in mu-plugins/

      # scp succeeding only proves bytes moved. These two steps prove the server got
      # what this commit contains.
      #
      # This began as one `grep … || true`, which PRINTED the deployed version and passed
      # whatever it found, under the name "Confirm the deployed version matches the repo".
      # It compared nothing for months. Then it compared two files BY NAME — and the day a
      # third plugin file was added, scp shipped it (it globs *.php) while the check stayed
      # blind to it. Same failure twice: a checker that knows less than the thing it checks.
      # The file list is DERIVED from the directory, never typed. The previous version
      # named vc-clients-embed.php and brg-acf.php, so adding brg-acf-admin-style.php
      # shipped a file (scp globs *.php) that the verification step could not see. A
      # deploy that checks a hardcoded subset of what it deploys reports success about
      # the files it happens to know — fc-brands' allowlist trap, moved into the checker.
      - name: Manifest of what this commit deploys
        id: want
        run: |
          set -euo pipefail
          cd website/wp-mu-plugin
          : > /tmp/manifest
          for f in *.php; do
            printf '%s %s\n' "$f" "$(sha256sum "$f" | cut -c1-16)" >> /tmp/manifest
          done
          [ -s /tmp/manifest ] || { echo "::error::no .php files to deploy — refusing a no-op deploy"; exit 1; }
          {
            echo "manifest<<MANIFEST_EOF"
            cat /tmp/manifest
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "deploying $(wc -l < /tmp/manifest) file(s):"
          cat /tmp/manifest

      - name: Confirm every deployed file matches the repo
        uses: appleboy/ssh-action@v1.0.3
        env:
          MANIFEST: ${{ steps.want.outputs.manifest }}
        with:
          host: ${{ secrets.WP_SSH_HOST }}
          username: ${{ secrets.WP_SSH_USER }}
          password: ${{ secrets.WP_SSH_PASSWORD }}
          envs: MANIFEST
          script: |
            cd "${{ secrets.WP_MU_PLUGINS_PATH }}"
            ls -l *.php
            if command -v sha256sum >/dev/null 2>&1; then digest() { sha256sum "$1" | cut -c1-16; }
            elif command -v shasum >/dev/null 2>&1; then digest() { shasum -a 256 "$1" | cut -c1-16; }
            else echo "::error::no sha256sum/shasum on the host — cannot verify the deploy"; exit 1; fi
            printf '%s\n' "$MANIFEST" > /tmp/brg-manifest
            bad=0; n=0
            while read -r name want; do
              [ -n "$name" ] || continue
              n=$((n+1))
              if [ ! -f "$name" ]; then
                echo "::error::$name is NOT on the server — scp reported success"
                bad=1; continue
              fi
              got=$(digest "$name")
              if [ "$got" != "$want" ]; then
                echo "::error::$name differs — server $got, repo $want"
                bad=1
              else
                echo "$name: match ($got)"
              fi
            done < /tmp/brg-manifest
            [ "$n" -gt 0 ] || { echo "::error::empty manifest — the check verified nothing"; exit 1; }
            [ "$bad" -eq 0 ] || exit 1
            rm -f /tmp/brg-manifest
            echo "all $n file(s) match, by bytes"
