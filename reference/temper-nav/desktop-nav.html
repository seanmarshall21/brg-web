<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPER — Desktop Nav (Ranger · generic · configurable)</title>
<link rel="stylesheet" href="https://use.typekit.net/kxm0tud.css">
<!-- ============================================================
     GENERIC, REUSABLE nav component (not Temper-specific).
     Feed it a standard wp_nav_menu <ul class="nav-src"> and it lays out.
     RESKIN for another site by changing only:
       --acc (accent), --cond (font stack), the .logo (text+font),
       the <ul class="nav-src"> items, the Tickets label/href, Social items.
     CONFIG (data-attrs on .nav):
       data-left / data-right = items per side (overflow -> More)
       data-mtix = "bar" | "menu"   (mobile Tickets in the bar, or inside the takeover)
     Behaviour tokens (classes): lay-left|split|center|compact, on-dark|on-light,
       surface (frost). Tickets is ALWAYS top-right AND mirrored in the More fly-out.
     ============================================================ -->
<style>
  :root{--cond:"helvetica-neue-lt-pro-cond","helvetica-neue-lt-pro",Arial,sans-serif;--tix:clamp(120px,13vw,168px);}
  *{box-sizing:border-box;} html,body{margin:0;font-family:var(--cond);}

  .nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:26px;
    padding:20px var(--tix) 20px 34px;transition:color .35s ease, transform .4s cubic-bezier(.5,0,.2,1);}
  .nav.on-dark { color:#eaf6ff; --acc:#6BCEE8; }
  .nav.on-light{ color:#0a0f16; --acc:#0f86a6; }
  .nav::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity .35s ease,background .35s ease;}
  .nav.surface::before,.nav.auto-surface::before{opacity:1;}
  .nav.on-dark.surface::before,.nav.on-dark.auto-surface::before{background:rgba(6,9,14,.55);}
  .nav.on-light.surface::before,.nav.on-light.auto-surface::before{background:rgba(240,238,232,.6);}

  .logo{font-family:"minion-pro","times new roman",serif;font-style:italic;font-size:24px;color:var(--acc);text-decoration:none;transition:color .35s ease;}
  .grp{display:flex;align-items:center;gap:26px;}
  .nl{position:relative;color:currentColor;text-decoration:none;text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:700;opacity:.85;
    transition:color .18s ease,opacity .18s ease;background:none;border:0;cursor:pointer;font-family:var(--cond);}
  .nl::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:right;transition:transform .28s ease;}
  .nl:hover{color:var(--acc);opacity:1;} .nl:hover::after{transform:scaleX(1);transform-origin:left;}
  .more{display:inline-flex;align-items:center;gap:6px;} .more .pl{font-size:17px;color:var(--acc);}

  .btn-tix{position:absolute;right:34px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;text-decoration:none;
    text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:800;color:#04070d;background:var(--acc);border-radius:999px;padding:9px 20px;transition:top .15s ease;}
  .btn-tix:hover{top:calc(50% - 1px);}
  .nav.on-light .btn-tix{color:#fff;}   /* light register: accent bg darkens, so flip the label to light */
  .mob-ham{all:unset;cursor:pointer;display:none;width:38px;height:38px;place-items:center;}
  .mob-ham i{display:block;width:24px;height:2px;background:currentColor;} .mob-ham i+i{margin-top:6px;}

  /* layouts */
  .nav.lay-left .logo{order:-1;margin-right:auto;}
  .nav.lay-split{display:grid;grid-template-columns:1fr auto 1fr;}
  .nav.lay-split .grp-a{justify-self:start;} .nav.lay-split .logo{justify-self:center;} .nav.lay-split .grp-b{justify-self:end;}
  .nav.lay-center{display:grid;grid-template-columns:1fr auto 1fr;}
  .nav.lay-center .grp-a{justify-self:end;} .nav.lay-center .logo{justify-self:center;} .nav.lay-center .grp-b{justify-self:start;}
  .nav.lay-compact .logo{order:-1;margin-right:auto;}

  @media (max-width:860px){
    .nav{display:flex !important;justify-content:space-between;padding:16px 20px;}
    .nav .grp{display:none !important;}
    .nav .logo{order:-1;margin:0;}
    .nav .btn-tix{position:static !important;transform:none !important;margin-left:auto;margin-right:12px;padding:8px 16px;}
    .nav[data-mtix="menu"] .btn-tix{display:none !important;}
    .nav .mob-ham{display:grid !important;}
  }

  /* fly-out drawer (More / mobile) — includes overflow items + Tickets + Social */
  .scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;}
  .scrim.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,88vw);z-index:60;background:#06090e;color:#eaf6ff;transform:translateX(100%);
    transition:transform .5s cubic-bezier(.7,0,.15,1);padding:96px 34px 34px;display:flex;flex-direction:column;gap:2px;
    background-image:repeating-linear-gradient(90deg,rgba(150,200,240,.06) 0 1px,transparent 1px 5px);}
  .drawer.open{transform:translateX(0);}
  .drawer a{color:inherit;text-decoration:none;text-transform:uppercase;font-weight:800;font-size:28px;letter-spacing:.01em;padding:8px 0;
    border-top:1px solid rgba(107,206,232,.25);overflow:hidden;}
  .drawer .d-items{display:flex;flex-direction:column;}   /* overflow items STACK (were flowing inline in a row) */
  .drawer a:first-of-type{border-top:none;}
  .drawer a.d-tix{color:#6BCEE8;} .drawer a .di{display:inline-block;transition:color .18s ease;} .drawer a:hover .di{color:#6BCEE8;}
  .drawer .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.55;margin:18px 0 2px;}
  .drawer .soc{font-size:20px;border:none;}
  .drawer-close{all:unset;cursor:pointer;position:absolute;top:30px;right:30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:7px 14px;}

  section{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6vw;}
  section h2{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.86;font-size:clamp(48px,12vw,180px);}
  .sec-dark{background:radial-gradient(70% 40% at 50% 30%,rgba(96,168,228,.14),transparent 70%),repeating-linear-gradient(90deg,rgba(150,200,240,.05) 0 1px,transparent 1px 5px),#06090e;color:#6BCEE8;}
  .sec-dark h2{text-shadow:0 0 40px rgba(107,206,232,.25);}
  .sec-light{background:#f2efe8;color:#0a0f16;} .sec-gray{background:#808080;color:#0a0f16;}

  .ctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:94vw;
    background:rgba(10,14,20,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;}
  .ctl .set{display:flex;align-items:center;gap:5px;}
  .ctl label{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .ctl button{all:unset;cursor:pointer;color:rgba(255,255,255,.7);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);}
  .ctl button.on{background:#6BCEE8;color:#04070d;border-color:#6BCEE8;font-weight:700;}
  .ctl .val{color:#eaf6ff;font-size:12px;min-width:1.2em;text-align:center;}
</style>
</head>
<body>

<nav class="nav lay-center on-dark" id="nav" data-left="2" data-right="2" data-mtix="bar">
  <div class="grp grp-a"></div>
  <a class="logo" href="#">Temper</a>
  <div class="grp grp-b"></div>
  <a class="btn-tix" href="#">Tickets</a>
  <button class="mob-ham" id="mobHam" aria-label="Menu"><i></i><i></i></button>

  <!-- SOURCE: standard wp_nav_menu markup. Swap these <li><a> for any site's menu. -->
  <ul class="nav-src" hidden>
    <li><a href="#home">Home</a></li>
    <li><a href="#lineup">Lineup</a></li>
    <li><a href="#artists">Artists</a></li>
    <li><a href="#info">Info</a></li>
    <li><a href="#gallery">Gallery</a></li>
  </ul>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawerClose">Close &times;</button>
  <div class="d-items"></div>
  <a class="d-tix" href="#"><span class="di">Tickets &rarr;</span></a>
  <div class="eyebrow">Social</div>
  <a class="soc" href="#"><span class="di">Instagram</span></a>
  <a class="soc" href="#"><span class="di">SoundCloud</span></a>
  <a class="soc" href="#"><span class="di">Spotify</span></a>
</aside>

<section class="sec-dark"  data-nav="dark"><h2>The Lineup</h2></section>
<section class="sec-light" data-nav="light"><h2>Tickets</h2></section>
<section class="sec-gray"  data-nav="gray"><h2>50% Gray</h2></section>
<section class="sec-light" data-nav="light"><h2>The Experience</h2></section>
<section class="sec-dark"  data-nav="dark"><h2>Dec 30</h2></section>

<div class="ctl" id="ctl">
  <div class="set"><label>Layout</label>
    <button data-lay="left">Left</button><button data-lay="split">Split</button><button data-lay="center" class="on">Center</button><button data-lay="compact">Compact</button></div>
  <div class="set"><label>Left</label><button data-cnt="left" data-d="-1">&minus;</button><span class="val" id="vL">2</span><button data-cnt="left" data-d="1">+</button></div>
  <div class="set"><label>Right</label><button data-cnt="right" data-d="-1">&minus;</button><span class="val" id="vR">2</span><button data-cnt="right" data-d="1">+</button></div>
  <div class="set"><label>Color</label><button data-reg="auto" class="on">Auto</button><button data-reg="dark">Dark</button><button data-reg="light">Light</button></div>
  <div class="set"><label>Surface</label><button data-surf="off" class="on">None</button><button data-surf="frost">Frost</button></div>
  <div class="set"><label>Mob Tix</label><button data-mtix="bar" class="on">Bar</button><button data-mtix="menu">Menu</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(function(){
  var nav=document.getElementById('nav'), grpA=nav.querySelector('.grp-a'), grpB=nav.querySelector('.grp-b');
  var drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'), dItemsBox=drawer.querySelector('.d-items');
  var SRC=Array.prototype.map.call(nav.querySelectorAll('.nav-src > li > a'), function(a){ return {label:a.textContent.trim(), href:a.getAttribute('href')}; });
  var lay='center', L=+nav.dataset.left||2, R=+nav.dataset.right||2, forced=null;

  function mkLink(it){ var a=document.createElement('a'); a.className='nl'; a.href=it.href; a.textContent=it.label; return a; }
  function mkMore(){ var b=document.createElement('button'); b.className='nl more'; b.innerHTML='More <span class="pl">+</span>'; b.addEventListener('click',openD); return b; }

  // Distribute the source menu into the visual slots per layout + per-side counts; overflow -> More/drawer.
  function render(){
    grpA.innerHTML=''; grpB.innerHTML=''; var overflow=[];
    if(lay==='left'){ SRC.forEach(function(it){ grpB.appendChild(mkLink(it)); }); }
    else if(lay==='compact'){ var show=L+R; SRC.slice(0,show).forEach(function(it){ grpB.appendChild(mkLink(it)); }); overflow=SRC.slice(show); if(overflow.length) grpB.appendChild(mkMore()); }
    else { SRC.slice(0,L).forEach(function(it){ grpA.appendChild(mkLink(it)); }); SRC.slice(L,L+R).forEach(function(it){ grpB.appendChild(mkLink(it)); }); overflow=SRC.slice(L+R); if(overflow.length) grpB.appendChild(mkMore()); }
    // drawer = overflow items (Tickets + Social are always present in the markup below)
    dItemsBox.innerHTML=''; overflow.forEach(function(it){ var a=mkLink(it); a.className=''; a.innerHTML='<span class="di">'+it.label+'</span>'; a.href=it.href; dItemsBox.appendChild(a); });
    document.getElementById('vL').textContent=L; document.getElementById('vR').textContent=R;
  }

  // ---- auto-invert + frost + sticky (unchanged behaviour) ----
  var stick='pin', lastY=window.scrollY, navH=nav.offsetHeight, ticking=false;
  function setReg(r){ var light=(r==='light'); nav.classList.toggle('on-light',light); nav.classList.toggle('on-dark',!light); }
  function apply(reg){ if(reg==='gray'){ nav.classList.add('auto-surface'); setReg('dark'); } else { nav.classList.remove('auto-surface'); setReg(reg); } }
  function autoInvert(){ if(forced){ apply(forced); return; }
    var pe=nav.style.pointerEvents; nav.style.pointerEvents='none';
    var el=document.elementFromPoint(Math.round(window.innerWidth/2), Math.round(navH*0.5+6)); nav.style.pointerEvents=pe;
    var sec=el&&el.closest('[data-nav]'); apply(sec?sec.dataset.nav:'dark'); }
  window.addEventListener('scroll', function(){ if(ticking) return; ticking=true; requestAnimationFrame(function(){ autoInvert();
    if(stick==='hide'){ var y=window.scrollY; nav.style.transform=(y>lastY&&y>navH)?'translateY(-100%)':'translateY(0)'; lastY=y; } ticking=false; }); }, {passive:true});
  window.addEventListener('resize', function(){ navH=nav.offsetHeight; autoInvert(); });

  // ---- drawer open/close + split-text stagger ----
  function openD(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false');
    var dis=drawer.querySelectorAll('a .di'); if(window.gsap){ gsap.killTweensOf(dis); gsap.fromTo(dis,{yPercent:110},{yPercent:0,duration:.55,ease:'power3.out',stagger:.05,delay:.12}); } }
  function closeD(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
  document.getElementById('mobHam').addEventListener('click', openD);
  document.getElementById('drawerClose').addEventListener('click', closeD);
  scrim.addEventListener('click', closeD);

  // ---- controls ----
  document.getElementById('ctl').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.lay!==undefined || b.dataset.reg!==undefined || b.dataset.surf!==undefined || b.dataset.mtix!==undefined){ b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); }); }
    if(b.dataset.lay){ lay=b.dataset.lay; nav.classList.remove('lay-left','lay-split','lay-center','lay-compact'); nav.classList.add('lay-'+lay); render(); navH=nav.offsetHeight; autoInvert(); closeD(); }
    if(b.dataset.cnt){ var d=+b.dataset.d; if(b.dataset.cnt==='left') L=Math.max(0,Math.min(SRC.length,L+d)); else R=Math.max(0,Math.min(SRC.length,R+d)); render(); autoInvert(); }
    if(b.dataset.reg){ forced=b.dataset.reg==='auto'?null:b.dataset.reg; autoInvert(); }
    if(b.dataset.surf){ nav.classList.toggle('surface', b.dataset.surf==='frost'); }
    if(b.dataset.mtix){ nav.setAttribute('data-mtix', b.dataset.mtix); }
  });

  render(); autoInvert();
})();
</script>
</body>
</html>
